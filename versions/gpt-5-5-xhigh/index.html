<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Digital Aquascape</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --ink: #13322f;
        --muted: #48615d;
        --panel: rgba(243, 250, 246, 0.88);
        --line: rgba(38, 70, 64, 0.22);
        --aqua: #3ea6a1;
        --coral: #e65f42;
        --sand: #dbc47f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #cde6df;
        color: var(--ink);
      }

      #app,
      #scene {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      canvas.is-hovering {
        cursor: pointer;
      }

      canvas:active {
        cursor: grabbing;
      }

      .hud {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 4;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }

      .brand,
      .control,
      .view-control {
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 16px 44px rgba(18, 51, 49, 0.14);
        backdrop-filter: blur(18px);
      }

      .brand {
        min-width: 0;
        max-width: min(460px, calc(100vw - 32px));
        padding: 12px 14px;
        border-radius: 8px;
      }

      .brand b {
        display: block;
        font-size: clamp(15px, 1.8vw, 19px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .brand span {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .controls-stack {
        display: grid;
        gap: 8px;
        justify-items: end;
        pointer-events: auto;
      }

      .control {
        display: grid;
        grid-template-columns: auto minmax(112px, 180px) 44px;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 8px;
        white-space: nowrap;
      }

      .control label,
      .control output {
        font-size: 13px;
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--aqua);
      }

      .view-control {
        display: grid;
        grid-template-columns: repeat(3, minmax(58px, 1fr));
        gap: 4px;
        width: 100%;
        max-width: 297px;
        padding: 5px;
        border-radius: 8px;
      }

      .view-control button {
        min-height: 32px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }

      .view-control button:hover {
        background: rgba(62, 166, 161, 0.12);
        color: var(--ink);
      }

      .view-control button.is-active {
        background: rgba(62, 166, 161, 0.18);
        color: var(--ink);
        box-shadow: inset 0 0 0 1px rgba(62, 166, 161, 0.22);
      }

      .quote-panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 5;
        width: min(420px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-left: 5px solid var(--aqua);
        border-radius: 8px;
        background: rgba(248, 252, 247, 0.93);
        box-shadow: 0 18px 46px rgba(20, 46, 43, 0.18);
        backdrop-filter: blur(16px);
        padding: 18px 18px 16px;
      }

      .quote-panel[hidden] {
        display: none;
      }

      .quote-panel button {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        border: 1px solid rgba(39, 75, 69, 0.22);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .quote-panel h2 {
        margin: 0 36px 8px 0;
        font-size: 17px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .quote-panel p {
        margin: 0;
        line-height: 1.55;
      }

      .quote-panel .quote {
        font-size: 15px;
        color: #233d39;
      }

      .quote-panel .meta {
        margin-top: 10px;
        color: #697872;
        font-size: 12px;
      }

      .species-strip {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: min(520px, calc(100vw - 32px));
        pointer-events: none;
      }

      .species-strip span {
        border: 1px solid rgba(32, 72, 69, 0.16);
        border-radius: 999px;
        background: rgba(249, 252, 247, 0.74);
        box-shadow: 0 10px 30px rgba(20, 46, 43, 0.1);
        color: #22433f;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        backdrop-filter: blur(14px);
      }

      .vignette {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.48), transparent 26%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 24%),
          radial-gradient(circle at center, transparent 56%, rgba(18, 57, 55, 0.16) 100%);
        mix-blend-mode: soft-light;
      }

      @media (max-width: 720px) {
        .hud {
          align-items: stretch;
          flex-direction: column;
        }

        .brand,
        .control,
        .controls-stack {
          width: 100%;
        }

        .control {
          grid-template-columns: auto 1fr 44px;
        }

        .view-control {
          max-width: none;
        }

        .species-strip {
          left: 16px;
          right: 16px;
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div id="scene" aria-label="3D 디지털 아쿠아스케이프"></div>

      <div class="hud">
        <div class="brand">
          <b>3D Digital Aquascape</b>
          <span>수초 언덕, 유목, 바위, 군영 관상어가 어우러진 브라우저 수조</span>
        </div>
        <div class="controls-stack">
          <div class="control">
            <label for="brightness">조명</label>
            <input id="brightness" type="range" min="28" max="130" value="86" />
            <output id="brightnessValue" for="brightness">86%</output>
          </div>
          <div class="view-control" role="group" aria-label="시점">
            <button type="button" class="is-active" data-view="wide">전체</button>
            <button type="button" data-view="canyon">협곡</button>
            <button type="button" data-view="school">군영</button>
          </div>
        </div>
      </div>

      <aside id="quotePanel" class="quote-panel" hidden>
        <button id="closeQuote" type="button" aria-label="명언 닫기">×</button>
        <h2 id="quoteTitle"></h2>
        <p id="quoteText" class="quote"></p>
        <p id="quoteMeta" class="meta"></p>
      </aside>

      <div class="species-strip" aria-label="관상어 종류">
        <span>네온테트라</span>
        <span>러미노즈테트라</span>
        <span>하프문구피</span>
        <span>엔젤피시</span>
        <span>체리바브</span>
      </div>
      <div class="vignette"></div>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const container = document.querySelector("#scene");
      const brightnessInput = document.querySelector("#brightness");
      const brightnessValue = document.querySelector("#brightnessValue");
      const quotePanel = document.querySelector("#quotePanel");
      const quoteTitle = document.querySelector("#quoteTitle");
      const quoteText = document.querySelector("#quoteText");
      const quoteMeta = document.querySelector("#quoteMeta");
      const closeQuote = document.querySelector("#closeQuote");
      const viewButtons = Array.from(document.querySelectorAll("[data-view]"));

      const TANK = {
        width: 28,
        depth: 13,
        bottom: -4.8,
        surface: 6.75,
        back: -6.5,
        front: 6.5
      };

      const quotes = {
        rock: {
          title: "석경석",
          text: "흔들리지 않는 것은 고집이 아니라 깊이를 가진 균형이다.",
          meta: "바위는 수초와 물길의 무게 중심을 잡습니다.",
          accent: "#a6763d"
        },
        wood: {
          title: "유목",
          text: "굽은 선은 먼 시간을 지나온 물의 기억을 가장 자연스럽게 보여준다.",
          meta: "유목은 물고기에게 그늘과 통로를 만듭니다.",
          accent: "#7a5030"
        },
        stem: {
          title: "후경 수초",
          text: "높이 자라는 잎은 빛을 탐내지 않고 물속 풍경에 깊이를 더한다.",
          meta: "후경 수초는 수조의 배경 숲을 이룹니다.",
          accent: "#4c8a3b"
        },
        carpet: {
          title: "전경 수초",
          text: "작은 잎들이 모이면 바닥도 숲이 되고, 느린 성장이 풍경을 완성한다.",
          meta: "전경 수초는 모래길과 바위 사이를 부드럽게 잇습니다.",
          accent: "#67a943"
        },
        grass: {
          title: "헤어그라스",
          text: "가느다란 움직임도 함께 흔들리면 물의 방향을 읽게 한다.",
          meta: "가는 잎은 유속과 생동감을 표현합니다.",
          accent: "#76ad54"
        },
        moss: {
          title: "활착 이끼",
          text: "가장 낮은 곳에 붙어 있는 생명도 풍경의 시간을 가장 오래 붙잡는다.",
          meta: "이끼는 바위와 유목의 경계를 부드럽게 덮습니다.",
          accent: "#5c9c4a"
        },
        floaters: {
          title: "부유 수초",
          text: "떠 있는 잎은 물의 표정을 가리고 드러내며 빛을 천천히 걸러낸다.",
          meta: "수면 식물은 그림자와 안정감을 더합니다.",
          accent: "#6ba85a"
        },
        water: {
          title: "수면",
          text: "빛은 물을 통과할 때 가장 부드러운 언어가 된다.",
          meta: "수면의 잔물결과 카우스틱 조명이 장면을 움직입니다.",
          accent: "#3ea6a1"
        },
        neon: {
          title: "네온테트라",
          text: "작은 몸의 선명한 빛은 무리를 만날 때 더 멀리 흐른다.",
          meta: "중층에서 빠르게 군영하는 소형 카라신입니다.",
          accent: "#2a8ce8"
        },
        rummy: {
          title: "러미노즈테트라",
          text: "같은 방향으로 헤엄치는 무리는 조용한 결심처럼 보인다.",
          meta: "붉은 머리와 줄무늬 꼬리가 군영의 리듬을 만듭니다.",
          accent: "#df3d30"
        },
        guppy: {
          title: "하프문구피",
          text: "가벼운 꼬리는 장식이 아니라 물살을 읽는 작은 돛이다.",
          meta: "화려한 꼬리와 느긋한 유영이 전경을 채웁니다.",
          accent: "#b854e6"
        },
        angel: {
          title: "엔젤피시",
          text: "천천히 지나가는 존재는 공간의 크기를 다시 느끼게 한다.",
          meta: "높은 체형과 긴 지느러미가 수직감을 더합니다.",
          accent: "#e8c764"
        },
        barb: {
          title: "체리바브",
          text: "짧은 번뜩임도 반복되면 풍경 안에 따뜻한 박자를 만든다.",
          meta: "붉은 몸빛이 수초 사이를 산뜻하게 통과합니다.",
          accent: "#d84b3d"
        }
      };

      let seed = 519771;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      const randRange = (min, max) => min + (max - min) * rand();
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const smoothstep = (edge0, edge1, x) => {
        const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      };
      const fract = (value) => value - Math.floor(value);
      const hashNoise = (x, y, z = 0) =>
        fract(Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.03;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd7eee8);
      scene.fog = new THREE.FogExp2(0x93cfc9, 0.028);

      const camera = new THREE.PerspectiveCamera(
        44,
        window.innerWidth / window.innerHeight,
        0.1,
        120
      );
      camera.position.set(0, 3.2, 20);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(0, 0.45, 0);
      controls.minDistance = 11;
      controls.maxDistance = 30;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.minPolarAngle = Math.PI * 0.23;
      controls.enablePan = false;
      controls.update();

      const cameraViews = {
        wide: {
          position: new THREE.Vector3(0, 3.2, 20),
          target: new THREE.Vector3(0, 0.45, 0)
        },
        canyon: {
          position: new THREE.Vector3(0.2, 0.1, 12.6),
          target: new THREE.Vector3(0.1, -1.45, -1.8)
        },
        school: {
          position: new THREE.Vector3(-3.2, 3.4, 14.2),
          target: new THREE.Vector3(1.6, 2.0, -1.1)
        }
      };
      let cameraTransition = null;

      function setActiveView(key) {
        viewButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.view === key);
        });
      }

      function moveToView(key) {
        const view = cameraViews[key];
        if (!view) return;
        setActiveView(key);
        cameraTransition = {
          position: view.position.clone(),
          target: view.target.clone()
        };
      }

      viewButtons.forEach((button) => {
        button.addEventListener("click", () => moveToView(button.dataset.view));
      });

      controls.addEventListener("start", () => {
        cameraTransition = null;
      });

      const root = new THREE.Group();
      scene.add(root);

      const ambientLight = new THREE.HemisphereLight(0xd7fffb, 0x687b4e, 1.25);
      scene.add(ambientLight);

      const keyLight = new THREE.DirectionalLight(0xfff5d3, 2.9);
      keyLight.position.set(-5, 12, 8);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -18;
      keyLight.shadow.camera.right = 18;
      keyLight.shadow.camera.top = 14;
      keyLight.shadow.camera.bottom = -10;
      keyLight.shadow.camera.near = 1;
      keyLight.shadow.camera.far = 34;
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0x7bcde8, 1.4);
      rimLight.position.set(8, 5, -8);
      scene.add(rimLight);

      const fillLight = new THREE.PointLight(0xffc98d, 1.4, 35, 2);
      fillLight.position.set(7, 1.2, 5);
      scene.add(fillLight);

      const materials = {
        sand: new THREE.MeshStandardMaterial({
          color: 0xd9c576,
          roughness: 0.94,
          metalness: 0.02
        }),
        path: new THREE.MeshStandardMaterial({
          color: 0xe6d59b,
          roughness: 0.9,
          metalness: 0.01
        }),
        rock: new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.96,
          metalness: 0.02,
          flatShading: true
        }),
        darkRock: new THREE.MeshStandardMaterial({
          color: 0x504539,
          roughness: 0.98,
          metalness: 0.02,
          flatShading: true
        }),
        wood: new THREE.MeshStandardMaterial({
          color: 0x6e4425,
          roughness: 0.88,
          metalness: 0.01
        }),
        leaf: new THREE.MeshStandardMaterial({
          color: 0x4d9a3f,
          roughness: 0.8,
          metalness: 0,
          side: THREE.DoubleSide
        })
      };

      const pickPriority = {
        neon: 80,
        rummy: 80,
        guppy: 80,
        angel: 80,
        barb: 80,
        rock: 65,
        wood: 60,
        stem: 36,
        carpet: 34,
        grass: 32,
        moss: 68,
        floaters: 30,
        water: 8
      };

      function markClickable(object, quoteKey) {
        object.userData.quote = quotes[quoteKey];
        object.userData.quoteKey = quoteKey;
        object.userData.pickPriority = pickPriority[quoteKey] ?? 10;
        return object;
      }

      function setShadow(object) {
        object.traverse((child) => {
          if (child.isMesh && !child.userData?.pickProxy) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
      }

      function pathCenterX(z) {
        const t = (z - TANK.back) / TANK.depth;
        return (
          Math.sin(t * Math.PI * 1.12 - 0.2) * 0.8 +
          Math.sin(t * Math.PI * 3.0 + 0.7) * 0.25
        );
      }

      function pathWidth(z) {
        const t = (z - TANK.back) / TANK.depth;
        return 0.9 + 0.52 * (1 - Math.abs(t - 0.52) * 1.35) + 0.18 * Math.sin(t * 8.0);
      }

      function terrainHeight(x, z) {
        const side = Math.pow(Math.abs(x) / (TANK.width / 2), 1.75);
        const back = smoothstep(0.5, 6.5, -z);
        const frontDip = smoothstep(3.6, 6.5, z) * 0.25;
        const center = pathCenterX(z);
        const path = 1 - smoothstep(pathWidth(z) * 0.45, pathWidth(z) * 1.55, Math.abs(x - center));
        const mound = 1.45 * side + 1.1 * back * (0.38 + side * 0.95);
        const smallNoise =
          Math.sin(x * 1.45 + z * 2.05) * 0.055 +
          Math.sin(x * 3.4 - z * 1.2) * 0.035;
        return TANK.bottom + mound - path * (0.72 + back * 0.3) - frontDip + smallNoise;
      }

      function createTerrain() {
        const geometry = new THREE.PlaneGeometry(TANK.width, TANK.depth, 150, 80);
        geometry.rotateX(-Math.PI / 2);
        const positions = geometry.attributes.position;
        const colors = [];
        const sand = new THREE.Color(0xd8c37d);
        const moss = new THREE.Color(0x587b37);
        const soil = new THREE.Color(0x55422a);

        for (let i = 0; i < positions.count; i += 1) {
          const x = positions.getX(i);
          const z = positions.getZ(i);
          const y = terrainHeight(x, z);
          positions.setY(i, y);

          const path = 1 - smoothstep(pathWidth(z) * 0.5, pathWidth(z) * 1.6, Math.abs(x - pathCenterX(z)));
          const mossy = smoothstep(0.15, 0.95, Math.abs(x) / (TANK.width / 2)) * 0.72;
          const back = smoothstep(1.0, 6.4, -z) * 0.42;
          const color = soil.clone().lerp(moss, mossy + back).lerp(sand, path * 0.9);
          color.offsetHSL(0, 0, randRange(-0.035, 0.035));
          colors.push(color.r, color.g, color.b);
        }

        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        const material = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.95,
          metalness: 0.01
        });
        const terrain = new THREE.Mesh(geometry, material);
        terrain.receiveShadow = true;
        root.add(terrain);
      }

      function createPathRibbon() {
        const vertices = [];
        const colors = [];
        const indices = [];
        const colorA = new THREE.Color(0xe9dca7);
        const colorB = new THREE.Color(0xcdb667);
        const steps = 92;

        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          const z = TANK.back + 0.45 + t * (TANK.depth - 1.25);
          const center = pathCenterX(z);
          const width = pathWidth(z) * (0.92 + 0.12 * Math.sin(t * Math.PI * 5));
          const leftX = center - width;
          const rightX = center + width;
          const yL = terrainHeight(leftX, z) + 0.035;
          const yR = terrainHeight(rightX, z) + 0.035;
          vertices.push(leftX, yL, z, rightX, yR, z);

          const shade = colorA.clone().lerp(colorB, 0.25 + 0.55 * hashNoise(t, z));
          colors.push(shade.r, shade.g, shade.b, shade.r, shade.g, shade.b);

          if (i < steps) {
            const a = i * 2;
            indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
          }
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        const material = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.88,
          metalness: 0.01
        });
        const path = new THREE.Mesh(geometry, material);
        path.receiveShadow = true;
        root.add(path);
      }

        uniforms: {

          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uTime;
          uniform float uBrightness;

          void main() {
            vec2 uv = vUv;
            float waveA = sin((uv.x * 18.0 + uv.y * 6.0) + uTime * 1.35);
            float waveB = sin((uv.x * -7.0 + uv.y * 21.0) + uTime * 0.95);
            float waveC = sin((uv.x * 31.0 - uv.y * 14.0) + uTime * 1.65);
            float caustic = smoothstep(2.18, 2.88, waveA + waveB + waveC);
            float falloff = smoothstep(0.02, 0.4, uv.y) * (1.0 - smoothstep(0.72, 1.0, uv.y));
            vec3 color = vec3(0.70, 0.98, 1.0) * caustic * falloff * uBrightness;
            gl_FragColor = vec4(color, caustic * falloff * 0.24 * uBrightness);

        transparent: true,

      function rockGeometry(radius = 1, detail = 2) {
        const geometry = new THREE.IcosahedronGeometry(radius, detail);
        const positions = geometry.attributes.position;
        const colors = [];
        const gray = new THREE.Color(0x6a6152);
        const ochre = new THREE.Color(0xa17f4d);
        const dark = new THREE.Color(0x40372e);

        for (let i = 0; i < positions.count; i += 1) {
          const v = new THREE.Vector3(positions.getX(i), positions.getY(i), positions.getZ(i));
          const n = v.clone().normalize();
          const ridge =
            0.18 * Math.sin(n.x * 7.8 + n.y * 4.1) +
            0.12 * Math.sin(n.z * 9.3 + n.x * 2.7) +
            (hashNoise(n.x * 8.0, n.y * 8.0, n.z * 8.0) - 0.5) * 0.28;
          v.multiplyScalar(1 + ridge);
          positions.setXYZ(i, v.x, v.y, v.z);

          const c = gray
            .clone()
            .lerp(ochre, clamp(n.y * 0.38 + 0.34 + hashNoise(n.x, n.z) * 0.2, 0, 1))
            .lerp(dark, clamp(-n.y * 0.25 + hashNoise(n.z, n.y) * 0.12, 0, 0.45));
          colors.push(c.r, c.g, c.b);
        }

        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        return geometry;
      }

          const p = randomPlantSpot(false);
          if (p.z < -5.8 || Math.abs(p.x - pathCenterX(p.z)) < pathWidth(p.z) * 1.4) {
            i -= 1;
            continue;
          }
          const h = randRange(0.42, 1.42);
          const bend = new THREE.Vector3(randRange(-0.08, 0.08), h, randRange(-0.08, 0.08));
          positions.push(p.x, p.y + 0.04, p.z, p.x + bend.x, p.y + bend.y, p.z + bend.z);
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        const blades = new THREE.LineSegments(geometry, bladeMaterial);
        grass.add(blades);
        grass.userData.sway = {
          geometry,
          basePositions: Float32Array.from(positions),
          bladeCount
        };
        root.add(grass);
        return grass;
      }

      function updateHairgrass(grass, time) {
        const data = grass?.userData?.sway;
        if (!data) return;
        const positions = data.geometry.attributes.position.array;
        const base = data.basePositions;
        for (let i = 0; i < data.bladeCount; i += 1) {
          const rootIndex = i * 6;
          const tipIndex = rootIndex + 3;
          const rootX = base[rootIndex];
          const rootZ = base[rootIndex + 2];
          const tipY = base[tipIndex + 1];
          const phase = rootX * 0.55 + rootZ * 0.9;
          const amp = 0.025 + Math.max(0, tipY - base[rootIndex + 1]) * 0.028;
          positions[tipIndex] = base[tipIndex] + Math.sin(time * 1.35 + phase) * amp;
          positions[tipIndex + 2] = base[tipIndex + 2] + Math.cos(time * 1.1 + phase * 0.7) * amp * 0.74;
        }
        data.geometry.attributes.position.needsUpdate = true;
      }

      function updateFish(time) {
        for (const actor of fishActors) {
          const t = time * actor.speed * actor.direction + actor.phase;
          const wobble = Math.sin(time * 0.7 + actor.phase) * 0.18;
          const x =
            actor.center.x +
            Math.cos(t) * actor.radiusX +
            Math.sin(t * 1.7 + actor.phase) * 0.18 +
            actor.schoolingOffset.x;
          const z =
            actor.center.z +
            Math.sin(t * 0.82) * actor.radiusZ +
            Math.cos(t * 1.25 + actor.phase) * 0.22 +
            actor.schoolingOffset.z;
          const y =
            actor.center.y +
            Math.sin(t * 1.35 + actor.phase) * actor.vertical +
            wobble * 0.2 +
            actor.schoolingOffset.y;

          const nextT = t + 0.035 * actor.direction;
          const next = new THREE.Vector3(
            actor.center.x + Math.cos(nextT) * actor.radiusX,
            y,
            actor.center.z + Math.sin(nextT * 0.82) * actor.radiusZ
          );
          const target = new THREE.Vector3(
            clamp(x, -TANK.width / 2 + 1.0, TANK.width / 2 - 1.0),
            clamp(y, TANK.bottom + 1.35, TANK.surface - 1.05),
            clamp(z, TANK.back + 0.9, TANK.front - 0.85)
          );

          actor.group.position.lerp(target, 0.09);
          const direction = next.sub(actor.group.position).normalize();
          const desiredHeading = Math.atan2(-direction.z, direction.x);
          const headingDelta = Math.atan2(
            Math.sin(desiredHeading - actor.heading),
            Math.cos(desiredHeading - actor.heading)
          );
          actor.heading += headingDelta * 0.12;
          actor.group.rotation.y = actor.heading;
          actor.group.rotation.z = Math.sin(time * 1.3 + actor.phase) * 0.045 - headingDelta * 0.08;
          actor.group.rotation.x = Math.sin(time * 0.9 + actor.phase) * 0.025;
          actor.tailPivot.rotation.y = Math.sin(time * (8.0 + actor.speed * 2.0) + actor.phase) * 0.52;
        }
      }

      function updateBubbles(group, time) {
        for (const bubble of group.children) {
          const data = bubble.userData.bubble;
          bubble.position.y += data.speed * 0.018;
          if (bubble.position.y > TANK.surface - 0.25) {
            bubble.position.y = TANK.bottom + randRange(0.5, 1.1);
          }
          bubble.position.x = data.baseX + Math.sin(time * 0.8 + data.phase + bubble.position.y) * 0.08;
          bubble.position.z = data.baseZ + Math.cos(time * 0.65 + data.phase) * 0.08;
          bubble.material.opacity = 0.22 + Math.sin(time + data.phase) * 0.08;
        }
      }

      function particleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 48;

        gradient.addColorStop(0.45, "rgba(223,255,246,0.42)");

        texture.colorSpace = THREE.SRGBColorSpace;

      function buildSuspendedParticles() {
        const count = 760;
        const positions = [];
        const phases = [];
        for (let i = 0; i < count; i += 1) {
          positions.push(
            randRange(-13.3, 13.3),
            randRange(TANK.bottom + 1.0, TANK.surface - 0.45),
            randRange(TANK.back + 0.35, TANK.front - 0.35)
          );
          phases.push(randRange(0, Math.PI * 2));
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({
          color: 0xe6fff8,
          map: particleTexture(),
          transparent: true,
          opacity: 0.32,
          size: 0.12,
          sizeAttenuation: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        const points = new THREE.Points(geometry, material);
        points.userData.ignoreRay = true;
        root.add(points);
        return {
          points,
          basePositions: Float32Array.from(positions),
          phases: Float32Array.from(phases)
        };
      }

      function updateSuspendedParticles(system, time) {
        if (!system) return;
        const positionAttribute = system.points.geometry.attributes.position;
        const positions = positionAttribute.array;
        const base = system.basePositions;
        for (let i = 0; i < system.phases.length; i += 1) {
          const index = i * 3;
          const phase = system.phases[i];
          positions[index] = base[index] + Math.sin(time * 0.18 + phase) * 0.18;
          positions[index + 1] = base[index + 1] + Math.sin(time * 0.12 + phase * 1.7) * 0.06;
          positions[index + 2] = base[index + 2] + Math.cos(time * 0.16 + phase * 0.9) * 0.16;
        }
        positionAttribute.needsUpdate = true;
      }

      createTerrain();
      createPathRibbon();
      buildBackdrop();
      createAquariumGlass();
      createLightPlanes();
      buildRocks();
      buildDriftwood();
      buildStemPlants();
      buildRedStemAccents();
      buildCarpetPlants();
      const hairgrassGroup = buildHairgrass();
      buildRosettePlants();
      buildMossPatches();
      buildFloatingPlants();
      buildFish();
      const bubbleGroup = buildBubbleStreams();
      const particleSystem = buildSuspendedParticles();

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let highlighted = null;

      function findQuoteObject(object) {
        let current = object;
        while (current) {
          if (current.userData?.quote) {
            return current;
          }
          current = current.parent;
        }
        return null;
      }

      function setPointer(event) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function intersections() {
        raycaster.setFromCamera(pointer, camera);
        return raycaster
          .intersectObjects(root.children, true)
          .filter((hit) => !hit.object.userData?.ignoreRay && findQuoteObject(hit.object))
          .map((hit) => {
            const quoteObject = findQuoteObject(hit.object);
            return {
              hit,
              quoteObject,
              priority: quoteObject.userData.pickPriority ?? 10
            };
          })
          .sort((a, b) => b.priority - a.priority || a.hit.distance - b.hit.distance);
      }

      function showQuote(data) {
        quoteTitle.textContent = data.title;
        quoteText.textContent = `“${data.text}”`;
        quoteMeta.textContent = data.meta;
        quotePanel.style.borderLeftColor = data.accent;
        quotePanel.hidden = false;
      }

      function clearHighlight() {
        if (!highlighted) return;
        highlighted.traverse((child) => {
          if (child.isMesh && child.material?.emissive && child.userData.previousEmissive) {
            child.material.emissive.copy(child.userData.previousEmissive);
            delete child.userData.previousEmissive;
          }
        });
        highlighted = null;
      }

      function highlight(object) {
        if (highlighted === object) return;
        clearHighlight();
        highlighted = object;
        object.traverse((child) => {
          if (child.isMesh && child.material?.emissive) {
            child.userData.previousEmissive = child.material.emissive.clone();
            child.material.emissive.set(0x173b34);
          }
        });
      }

      renderer.domElement.addEventListener("pointermove", (event) => {
        setPointer(event);
        const hit = intersections()[0];
        const quoteObject = hit?.quoteObject ?? null;
        renderer.domElement.classList.toggle("is-hovering", Boolean(quoteObject));
        if (quoteObject) {
          highlight(quoteObject);
        } else {
          clearHighlight();
        }
      });

      renderer.domElement.addEventListener("pointerdown", (event) => {
        setPointer(event);
        const hit = intersections()[0];
        const quoteObject = hit?.quoteObject ?? null;
        if (quoteObject?.userData.quote) {
          showQuote(quoteObject.userData.quote);
        }
      });

      closeQuote.addEventListener("click", () => {
        quotePanel.hidden = true;
      });

      function applyBrightness(value) {
        const normalized = Number(value) / 100;
        brightnessValue.textContent = `${value}%`;
        ambientLight.intensity = 0.65 + normalized * 0.85;
        keyLight.intensity = 1.1 + normalized * 2.65;
        rimLight.intensity = 0.45 + normalized * 1.45;
        fillLight.intensity = 0.55 + normalized * 1.35;
        waterMaterial.opacity = clamp(0.18 + normalized * 0.18, 0.18, 0.45);
        causticMaterial.uniforms.uBrightness.value = normalized;
        renderer.toneMappingExposure = 0.7 + normalized * 0.5;
      }

      brightnessInput.addEventListener("input", (event) => {
        applyBrightness(event.target.value);
      });
      applyBrightness(brightnessInput.value);

      function updateWater(time) {
        const positions = waterGeometry.attributes.position;
        for (let i = 0; i < positions.count; i += 1) {
          const baseIndex = i * 3;
          const x = baseWater[baseIndex];
          const z = baseWater[baseIndex + 2];
          const wave = Math.sin(x * 0.65 + time * 1.4) * 0.045 + Math.cos(z * 0.75 + time * 1.05) * 0.035;
          positions.setY(i, baseWater[baseIndex + 1] + wave);
        }
        positions.needsUpdate = true;
        waterGeometry.computeVertexNormals();
      }

      function updateCameraTransition() {
        if (!cameraTransition) return;
        camera.position.lerp(cameraTransition.position, 0.055);
        controls.target.lerp(cameraTransition.target, 0.055);
        if (
          camera.position.distanceTo(cameraTransition.position) < 0.03 &&
          controls.target.distanceTo(cameraTransition.target) < 0.02
        ) {
          camera.position.copy(cameraTransition.position);
          controls.target.copy(cameraTransition.target);
          cameraTransition = null;
        }
      }

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener("resize", onResize);

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const time = clock.getElapsedTime();
        updateCameraTransition();
        controls.update();
        updateWater(time);
        causticMaterial.uniforms.uTime.value = time;
        updateHairgrass(hairgrassGroup, time);
        updateFish(time);
        updateBubbles(bubbleGroup, time);
        updateSuspendedParticles(particleSystem, time);
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
