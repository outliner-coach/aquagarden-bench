<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Aquascape · 디지털 아쿠아스케이프</title>
<style>
  :root {
    --glass: rgba(12, 28, 36, 0.62);
    --glass-border: rgba(180, 230, 255, 0.18);
    --text: #e9f6f7;
    --accent: #66e0ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #04090c;
    color: var(--text);
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .panel {
    position: fixed;
    top: 18px;
    left: 18px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    color: var(--text);
    padding: 14px 18px 16px;
    border-radius: 14px;
    border: 1px solid var(--glass-border);
    z-index: 10;
    user-select: none;
    min-width: 240px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  .panel h1 {
    font-size: 13px;
    margin: 0 0 10px;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: #c8efff;
    text-transform: uppercase;
  }
  .panel .sub {
    font-size: 11px;
    opacity: 0.65;
    margin-bottom: 12px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .row label { width: 56px; opacity: 0.85; }
  .row .val { width: 42px; text-align: right; opacity: 0.7; }
  input[type=range] {
    flex: 1;
    accent-color: var(--accent);
    height: 4px;
  }

  .quote {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--glass);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    color: #f0fafa;
    padding: 18px 28px 16px;
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    max-width: 540px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 10px 32px rgba(0,0,0,0.4);
  }
  .quote.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .quote .text {
    font-size: 15px;
    line-height: 1.65;
    font-weight: 400;
  }
  .quote .from {
    font-size: 12px;
    opacity: 0.65;
    margin-top: 10px;
    letter-spacing: 0.04em;
  }
  .quote .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    opacity: 0.85;
  }

  .hint {
    position: fixed;
    bottom: 14px;
    right: 18px;
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    z-index: 10;
    pointer-events: none;
    letter-spacing: 0.03em;
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    box-shadow: inset 0 0 220px rgba(0, 0, 0, 0.65);
  }

  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #04090c; color: #88c0d8;
    font-size: 13px; letter-spacing: 0.2em;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  .loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="vignette"></div>

  <div class="panel">
    <h1>🌿 Digital Aquascape</h1>
    <div class="sub">자연이 잠든 작은 정원</div>
    <div class="row">
      <label>조명</label>
      <input type="range" id="brightness" min="0" max="200" value="100" />
      <span class="val" id="brightnessVal">100%</span>
    </div>
    <div class="row">
      <label>색온도</label>
      <input type="range" id="warmth" min="0" max="100" value="55" />
      <span class="val" id="warmthVal">55%</span>
    </div>
  </div>

  <div class="quote" id="quote">
    <div class="tag" id="quoteTag">— Whisper</div>
    <div class="text"></div>
    <div class="from"></div>
  </div>

  <div class="hint">오브젝트를 클릭해 보세요 · Click any object</div>
  <div class="loading" id="loading">LOADING NATURE</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
  import * as THREE from 'three';

  /* =========================================================
   * SCENE / RENDERER
   * ========================================================= */
  const app = document.getElementById('app');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05131a);
  scene.fog = new THREE.FogExp2(0x0e3a4a, 0.022);

  const camera = new THREE.PerspectiveCamera(
    52, window.innerWidth / window.innerHeight, 0.1, 200
  );
  camera.position.set(0, 5.2, 20);
  camera.lookAt(0, 3.2, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  app.appendChild(renderer.domElement);

  /* =========================================================
   * TANK DIMENSIONS
   * ========================================================= */
  const TANK = { w: 22, h: 12, d: 12 };

  /* =========================================================
   * LIGHTING
   * ========================================================= */
  const ambient = new THREE.AmbientLight(0x6090a8, 0.55);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff2cc, 1.5);
  sun.position.set(6, 26, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -16;
  sun.shadow.camera.right = 16;
  sun.shadow.camera.top = 16;
  sun.shadow.camera.bottom = -16;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 80;
  sun.shadow.bias = -0.0008;
  scene.add(sun);

  const rim = new THREE.DirectionalLight(0x8ad8ff, 0.5);
  rim.position.set(-12, 8, -8);
  scene.add(rim);

  const fill = new THREE.HemisphereLight(0x88ccff, 0x2b3a20, 0.45);
  scene.add(fill);

  // Volumetric "sun beam" feel via a soft spotlight
  const beam = new THREE.SpotLight(0xddf4ff, 0.7, 40, Math.PI / 5, 0.6, 1.5);
  beam.position.set(2, 18, 4);
  beam.target.position.set(0, 0, 0);
  scene.add(beam);
  scene.add(beam.target);

  /* =========================================================
   * BACKGROUND (gradient back wall)
   * ========================================================= */
  const bgGeo = new THREE.PlaneGeometry(TANK.w * 1.6, TANK.h * 1.6);
  const bgMat = new THREE.ShaderMaterial({
    uniforms: { uTop: { value: new THREE.Color(0x0e4258) }, uBot: { value: new THREE.Color(0x041820) } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec2 vUv; uniform vec3 uTop; uniform vec3 uBot;
      void main(){ vec3 c = mix(uBot, uTop, smoothstep(0.0, 1.0, vUv.y));
        c += (fract(sin(vUv.x*900.0)*43758.0)-0.5)*0.01;
        gl_FragColor = vec4(c, 1.0); }`
  });
  const bg = new THREE.Mesh(bgGeo, bgMat);
  bg.position.set(0, TANK.h / 2, -TANK.d / 2 - 0.5);
  scene.add(bg);

  /* =========================================================
   * SAND / GRAVEL FLOOR with displacement bumps
   * ========================================================= */
  const floorGeo = new THREE.PlaneGeometry(TANK.w + 2, TANK.d + 2, 80, 48);
  {
    const p = floorGeo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i);
      const h =
        Math.sin(x * 0.6) * 0.18 +
        Math.cos(y * 0.7) * 0.14 +
        Math.sin(x * 1.4 + y * 0.9) * 0.08 +
        (Math.random() - 0.5) * 0.18;
      p.setZ(i, h);
    }
    floorGeo.computeVertexNormals();
  }
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x8a7858,
    roughness: 0.97,
    metalness: 0.0,
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  // pebbles scattered
  const pebbleGeo = new THREE.DodecahedronGeometry(0.18, 0);
  for (let i = 0; i < 80; i++) {
    const m = new THREE.Mesh(pebbleGeo, new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(0.08 + Math.random() * 0.05, 0.25, 0.32 + Math.random() * 0.18),
      roughness: 0.95,
    }));
    m.position.set(
      (Math.random() - 0.5) * (TANK.w - 1),
      0.1 + Math.random() * 0.12,
      (Math.random() - 0.5) * (TANK.d - 1)
    );
    m.scale.setScalar(0.5 + Math.random() * 0.9);
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    m.receiveShadow = true;
    scene.add(m);
  }

  /* =========================================================
   * GLASS PANES (subtle, only edges)
   * ========================================================= */
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0xaad8e8,
    transmission: 0.5,
    thickness: 0.5,
    roughness: 0.05,
    metalness: 0,
    transparent: true,
    opacity: 0.06,
    side: THREE.DoubleSide,
  });
  const sideGeo = new THREE.PlaneGeometry(TANK.d, TANK.h);
  const leftGlass = new THREE.Mesh(sideGeo, glassMat);
  leftGlass.rotation.y = Math.PI / 2;
  leftGlass.position.set(-TANK.w / 2, TANK.h / 2, 0);
  scene.add(leftGlass);
  const rightGlass = leftGlass.clone();
  rightGlass.position.x = TANK.w / 2;
  rightGlass.rotation.y = -Math.PI / 2;
  scene.add(rightGlass);

  /* =========================================================
   * CLICKABLE REGISTRY
   * ========================================================= */
  const clickables = [];

  /* =========================================================
   * ROCKS (irregular icosahedron clusters)
   * ========================================================= */
  function makeRock(x, y, z, scale, color = 0x7a6a55, tone = 1.0) {
    const geo = new THREE.IcosahedronGeometry(1, 1);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const v = new THREE.Vector3(p.getX(i), p.getY(i), p.getZ(i));
      v.multiplyScalar(1 + (Math.random() - 0.5) * 0.45);
      p.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color).multiplyScalar(tone),
      roughness: 0.96,
      flatShading: true,
    });
    const m = new THREE.Mesh(geo, mat);
    m.scale.set(scale * (1.1 + Math.random() * 0.3), scale * (0.9 + Math.random() * 0.2), scale * (1 + Math.random() * 0.2));
    m.position.set(x, y, z);
    m.rotation.set(Math.random() * 0.5, Math.random() * Math.PI, Math.random() * 0.5);
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData.kind = 'rock';
    scene.add(m);
    clickables.push(m);
    return m;
  }

  // arrange roughly like reference: cluster center-front
  makeRock(-3.6, 0.9, -1, 1.9, 0x8a7a5e, 1.05);
  makeRock(-1.2, 1.2, -1.4, 2.4, 0x756554, 0.95);
  makeRock(1.6, 1.0, -1.0, 2.1, 0x847256, 1.0);
  makeRock(4.2, 0.9, -0.4, 1.7, 0x8c7c5e, 1.08);
  makeRock(-6.5, 0.55, 1.2, 1.1, 0x7b6a52, 0.95);
  makeRock(7.0, 0.7, 0.6, 1.3, 0x8a7858, 1.02);
  makeRock(-0.5, 0.4, 3.0, 0.85, 0x756550, 0.95);
  makeRock(2.4, 0.4, 3.4, 0.7, 0x8a7858, 1.0);
  makeRock(-8.5, 0.4, -1.5, 0.9, 0x726248, 0.9);
  makeRock(8.8, 0.4, -1.8, 1.0, 0x7a6a52, 0.95);

  /* =========================================================
   * DRIFTWOOD — a few branches resting between rocks
   * ========================================================= */
  function makeBranch(x, y, z, len, rad, rot) {
    const geo = new THREE.CylinderGeometry(rad * 0.6, rad, len, 7, 4);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const v = new THREE.Vector3(p.getX(i), p.getY(i), p.getZ(i));
      v.x += (Math.random() - 0.5) * rad * 0.4;
      v.z += (Math.random() - 0.5) * rad * 0.4;
      p.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({
      color: 0x3a2818,
      roughness: 0.95,
      flatShading: true,
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.rotation.set(rot.x, rot.y, rot.z);
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData.kind = 'wood';
    scene.add(m);
    clickables.push(m);
    return m;
  }
  makeBranch(-4, 1.6, -0.4, 4.5, 0.22, { x: 0.4, y: 0.6, z: 0.85 });
  makeBranch(2.6, 2.0, -1.3, 3.5, 0.18, { x: -0.45, y: 1.1, z: -0.7 });
  makeBranch(5.2, 2.2, -2.0, 2.6, 0.14, { x: -0.3, y: 1.6, z: 0.4 });

  /* =========================================================
   * MOSS (small green spheres clustered on rocks)
   * ========================================================= */
  const mossGeo = new THREE.SphereGeometry(0.22, 7, 5);
  function moss(x, y, z, r, hue = 0.28) {
    const c = new THREE.Color().setHSL(hue, 0.65, 0.22 + Math.random() * 0.12);
    const m = new THREE.Mesh(
      mossGeo,
      new THREE.MeshStandardMaterial({ color: c, roughness: 0.97, flatShading: true })
    );
    m.position.set(x, y, z);
    m.scale.set(r * (1 + Math.random() * 0.4), r * 0.7, r * (1 + Math.random() * 0.4));
    m.castShadow = true;
    m.receiveShadow = true;
    m.userData.kind = 'plant';
    m.userData.subKind = 'moss';
    scene.add(m);
    clickables.push(m);
  }
  for (let i = 0; i < 90; i++) {
    const ang = Math.random() * Math.PI * 2;
    const r = 0.5 + Math.random() * 4.2;
    moss(Math.cos(ang) * r * (0.8 + Math.random() * 0.4),
         0.4 + Math.random() * 1.8,
         Math.sin(ang) * r * 0.6 - 0.2,
         0.6 + Math.random() * 1.2);
  }

  /* =========================================================
   * PLANTS — three layers (carpet / mid / tall)
   * ========================================================= */
  const plants = [];

  function plantBlade(x, y, z, height, hueShift = 0, narrow = 0.05, sat = 0.7) {
    const geo = new THREE.ConeGeometry(narrow, height, 4, 1, true);
    const c = new THREE.Color().setHSL(0.27 + hueShift, sat, 0.22 + Math.random() * 0.18);
    const mat = new THREE.MeshStandardMaterial({
      color: c,
      side: THREE.DoubleSide,
      roughness: 0.78,
      flatShading: true,
    });
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y + height / 2, z);
    m.userData.baseY = y + height / 2;
    m.userData.swayPhase = Math.random() * Math.PI * 2;
    m.userData.swayAmp = 0.04 + Math.random() * 0.08;
    m.userData.kind = 'plant';
    m.userData.subKind = height > 2 ? 'tall' : height > 1 ? 'mid' : 'carpet';
    m.castShadow = true;
    scene.add(m);
    plants.push(m);
    clickables.push(m);
    return m;
  }

  // Foreground / carpet: covers floor between rocks
  for (let i = 0; i < 220; i++) {
    const x = (Math.random() - 0.5) * (TANK.w - 1.5);
    const z = (Math.random() - 0.4) * (TANK.d - 1) - 0.5;
    // skip too close to rocks (rough no-go zone)
    const inRockZone =
      (Math.abs(x) < 5.5 && z < 0 && z > -2.5) && Math.random() < 0.55;
    if (inRockZone) continue;
    const h = 0.25 + Math.random() * 0.45;
    plantBlade(x, 0.08, z, h, -0.02 + Math.random() * 0.05, 0.04 + Math.random() * 0.04, 0.7);
  }

  // Mid: clumps on the sides of rocks
  for (let i = 0; i < 100; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const cx = side * (4 + Math.random() * 5.5);
    const cz = (Math.random() - 0.5) * 5 - 1;
    // offsets clumped
    for (let k = 0; k < 4; k++) {
      const x = cx + (Math.random() - 0.5) * 1.0;
      const z = cz + (Math.random() - 0.5) * 0.8;
      const h = 0.9 + Math.random() * 1.4;
      plantBlade(x, 0.08, z, h, -0.01 + Math.random() * 0.05, 0.05 + Math.random() * 0.05, 0.65);
    }
  }

  // Tall background plants — like stargrass forest
  for (let i = 0; i < 70; i++) {
    const x = (Math.random() - 0.5) * (TANK.w * 0.9);
    const z = -TANK.d / 2 + 0.4 + Math.random() * 2.6;
    const h = 2.4 + Math.random() * 4.0;
    plantBlade(x, 0.08, z, h, -0.04 + Math.random() * 0.04, 0.06 + Math.random() * 0.04, 0.55);
  }

  // Reddish background accent plants (to echo warm reds in reference)
  for (let i = 0; i < 18; i++) {
    const x = -3 + (Math.random() - 0.5) * 8;
    const z = -TANK.d / 2 + 1.5 + Math.random() * 2;
    const h = 1.8 + Math.random() * 2.6;
    plantBlade(x, 0.08, z, h, 0.66 + Math.random() * 0.04, 0.05, 0.7);
  }

  /* =========================================================
   * FISH (Boids-like flocking, 4 species)
   * ========================================================= */
  class Fish {
    constructor(opts) {
      this.opts = opts;
      this.group = new THREE.Group();

      // Body
      const bodyGeo = new THREE.SphereGeometry(opts.size, 14, 10);
      bodyGeo.scale(opts.bodyStretch || 2.2, opts.bodyHeight || 1, opts.bodyWidth || 0.55);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: opts.color,
        roughness: 0.4,
        metalness: 0.25,
        emissive: opts.color,
        emissiveIntensity: 0.08,
      });
      this.body = new THREE.Mesh(bodyGeo, bodyMat);
      this.body.castShadow = true;
      this.group.add(this.body);

      // Stripe (thin band) for tetras
      if (opts.stripeColor !== undefined) {
        const stripeGeo = new THREE.SphereGeometry(opts.size * 1.005, 14, 10);
        stripeGeo.scale(opts.bodyStretch || 2.2, 0.18, (opts.bodyWidth || 0.55) + 0.005);
        const stripe = new THREE.Mesh(
          stripeGeo,
          new THREE.MeshStandardMaterial({ color: opts.stripeColor, emissive: opts.stripeColor, emissiveIntensity: 0.6, roughness: 0.3 })
        );
        this.group.add(stripe);
      }

      // Tail
      const tailGeo = new THREE.ConeGeometry(opts.size * 0.85, opts.size * 1.4, 4);
      tailGeo.rotateZ(Math.PI / 2);
      tailGeo.scale(1, 1, 0.25);
      const tailMat = new THREE.MeshStandardMaterial({
        color: opts.tailColor || opts.color,
        transparent: true,
        opacity: 0.85,
        side: THREE.DoubleSide,
      });
      this.tail = new THREE.Mesh(tailGeo, tailMat);
      this.tail.position.x = -opts.size * 2.0;
      this.group.add(this.tail);

      // Optional dorsal/ventral fins (angel, guppy)
      if (opts.fins) {
        const finGeo = new THREE.ConeGeometry(opts.size * 0.8, opts.size * 1.6, 3);
        finGeo.rotateX(Math.PI / 2);
        finGeo.scale(1, 0.25, 1);
        const fin = new THREE.Mesh(finGeo, tailMat.clone());
        fin.position.set(opts.size * 0.1, opts.size * 0.7, 0);
        this.group.add(fin);

        const ventral = fin.clone();
        ventral.position.set(opts.size * 0.1, -opts.size * 0.7, 0);
        ventral.rotation.x = Math.PI;
        this.group.add(ventral);
      }

      this.position = this.group.position;
      this.velocity = new THREE.Vector3(
        Math.random() - 0.5,
        (Math.random() - 0.5) * 0.2,
        Math.random() - 0.5
      ).normalize().multiplyScalar(opts.speed * 0.7);

      this.position.set(
        (Math.random() - 0.5) * TANK.w * 0.7,
        2 + Math.random() * (TANK.h - 4),
        (Math.random() - 0.5) * TANK.d * 0.6
      );

      this.group.userData.kind = 'fish';
      this.group.userData.species = opts.species;

      // wire pickability through body
      this.body.userData = this.group.userData;

      scene.add(this.group);
      clickables.push(this.body);
    }

    update(dt, t, allFish) {
      const o = this.opts;
      const steer = new THREE.Vector3();

      // Boundary repulsion
      const margin = 1.6;
      if (this.position.x > TANK.w / 2 - margin) steer.x -= 1.5;
      if (this.position.x < -TANK.w / 2 + margin) steer.x += 1.5;
      if (this.position.y > TANK.h - margin) steer.y -= 1.5;
      if (this.position.y < 1.4) steer.y += 1.5;
      if (this.position.z > TANK.d / 2 - margin) steer.z -= 1.5;
      if (this.position.z < -TANK.d / 2 + margin) steer.z += 1.5;

      // Boids — only same species
      const sep = new THREE.Vector3();
      const ali = new THREE.Vector3();
      const coh = new THREE.Vector3();
      let count = 0;
      for (const other of allFish) {
        if (other === this || other.opts.species !== o.species) continue;
        const d = this.position.distanceTo(other.position);
        if (d < o.neighborRadius && d > 0.001) {
          if (d < o.separationRadius) {
            const diff = new THREE.Vector3().subVectors(this.position, other.position);
            diff.divideScalar(d * d);
            sep.add(diff);
          }
          ali.add(other.velocity);
          coh.add(other.position);
          count++;
        }
      }
      if (count > 0) {
        ali.divideScalar(count).setLength(o.speed).sub(this.velocity);
        coh.divideScalar(count).sub(this.position).setLength(o.speed).sub(this.velocity);
        steer.addScaledVector(sep, o.sepWeight);
        steer.addScaledVector(ali, o.aliWeight);
        steer.addScaledVector(coh, o.cohWeight);
      }

      // Wandering
      steer.x += (Math.random() - 0.5) * 1.0;
      steer.y += (Math.random() - 0.5) * 0.4;
      steer.z += (Math.random() - 0.5) * 1.0;

      // gentle pull to mid water depending on species
      const desiredY = o.preferredY != null ? o.preferredY : 5;
      steer.y += (desiredY - this.position.y) * 0.06;

      // Avoid rock zone aggressively when low
      if (this.position.y < 2.5 && Math.abs(this.position.x) < 6 && this.position.z < 1) {
        steer.y += 1.2;
      }

      this.velocity.addScaledVector(steer, dt * 1.4);
      const maxS = o.speed;
      if (this.velocity.length() > maxS) this.velocity.setLength(maxS);
      // slight floor on speed so they keep moving
      if (this.velocity.length() < maxS * 0.4) this.velocity.setLength(maxS * 0.4);

      this.position.addScaledVector(this.velocity, dt);

      // Orient
      const lookTarget = this.position.clone().add(this.velocity);
      this.group.lookAt(lookTarget);

      // Tail wag + body undulation
      this.tail.rotation.y = Math.sin(t * o.wagSpeed + o.phase) * 0.55;
      this.body.rotation.y = Math.sin(t * o.wagSpeed * 0.5 + o.phase) * 0.12;
    }
  }

  const fishes = [];

  // Cardinal tetras (small, red-orange, tight school) — like the reference
  for (let i = 0; i < 22; i++) {
    fishes.push(new Fish({
      species: 'cardinal',
      size: 0.18,
      bodyStretch: 2.4, bodyHeight: 1, bodyWidth: 0.45,
      color: 0xe23a2a,
      stripeColor: 0x66e0ff,
      tailColor: 0xff7755,
      speed: 3.6,
      wagSpeed: 14,
      phase: Math.random() * Math.PI * 2,
      neighborRadius: 2.6,
      separationRadius: 0.55,
      sepWeight: 1.6, aliWeight: 1.1, cohWeight: 1.0,
      preferredY: 7.5,
    }));
  }

  // Neon tetras (small, blue/silver schoolers)
  for (let i = 0; i < 16; i++) {
    fishes.push(new Fish({
      species: 'neon',
      size: 0.16,
      bodyStretch: 2.3, bodyHeight: 0.95, bodyWidth: 0.42,
      color: 0xc8d8e0,
      stripeColor: 0x3aa8ff,
      tailColor: 0xa8e8ff,
      speed: 3.0,
      wagSpeed: 16,
      phase: Math.random() * Math.PI * 2,
      neighborRadius: 2.4,
      separationRadius: 0.45,
      sepWeight: 1.5, aliWeight: 1.0, cohWeight: 0.95,
      preferredY: 5.5,
    }));
  }

  // Angelfish (large, slow, tall body, solo-ish)
  for (let i = 0; i < 3; i++) {
    fishes.push(new Fish({
      species: 'angel',
      size: 0.55,
      bodyStretch: 1.6, bodyHeight: 1.7, bodyWidth: 0.35,
      color: 0xeaeaea,
      tailColor: 0xffe8a0,
      fins: true,
      speed: 1.3,
      wagSpeed: 5,
      phase: Math.random() * Math.PI * 2,
      neighborRadius: 5,
      separationRadius: 2.5,
      sepWeight: 2.2, aliWeight: 0.4, cohWeight: 0.2,
      preferredY: 6,
    }));
  }

  // Guppies (medium, vivid colors, fancy fins)
  for (let i = 0; i < 9; i++) {
    const hue = Math.random();
    fishes.push(new Fish({
      species: 'guppy',
      size: 0.22,
      bodyStretch: 2.0, bodyHeight: 1, bodyWidth: 0.55,
      color: new THREE.Color().setHSL(hue, 0.85, 0.55).getHex(),
      tailColor: new THREE.Color().setHSL((hue + 0.1) % 1, 0.9, 0.6).getHex(),
      fins: true,
      speed: 2.0,
      wagSpeed: 9,
      phase: Math.random() * Math.PI * 2,
      neighborRadius: 3,
      separationRadius: 0.9,
      sepWeight: 1.3, aliWeight: 0.6, cohWeight: 0.5,
      preferredY: 4.5,
    }));
  }

  /* =========================================================
   * BUBBLES
   * ========================================================= */
  const bubbleGeo = new THREE.SphereGeometry(0.07, 8, 6);
  const bubbleMat = new THREE.MeshStandardMaterial({
    color: 0xeaf8ff,
    transparent: true,
    opacity: 0.55,
    roughness: 0.05,
    metalness: 0.4,
    emissive: 0xaad8e8,
    emissiveIntensity: 0.15,
  });
  const bubbles = [];
  for (let i = 0; i < 70; i++) {
    const b = new THREE.Mesh(bubbleGeo, bubbleMat);
    b.position.set(
      (Math.random() - 0.5) * TANK.w * 0.9,
      Math.random() * TANK.h,
      (Math.random() - 0.5) * TANK.d * 0.9
    );
    b.userData.speed = 0.5 + Math.random() * 1.6;
    b.userData.wobble = Math.random() * Math.PI * 2;
    b.userData.s = 0.3 + Math.random() * 0.9;
    b.scale.setScalar(b.userData.s);
    scene.add(b);
    bubbles.push(b);
  }

  /* =========================================================
   * CAUSTICS — soft point lights flicker on the floor
   * ========================================================= */
  const causticLights = [];
  for (let i = 0; i < 5; i++) {
    const l = new THREE.PointLight(0xb0e8ff, 0.4, 14, 2);
    l.position.set((Math.random() - 0.5) * TANK.w, 1.0, (Math.random() - 0.5) * TANK.d);
    l.userData.phase = Math.random() * Math.PI * 2;
    l.userData.speed = 0.3 + Math.random() * 0.6;
    l.userData.baseIntensity = 0.4;
    scene.add(l);
    causticLights.push(l);
  }

  /* =========================================================
   * QUOTES
   * ========================================================= */
  const QUOTES = {
    rock: [
      { t: '강물이 바위를 뚫는 것은 그 힘이 아니라, 끊임없음 때문이다.', f: '오비디우스' },
      { t: '바위처럼 단단한 것도, 시간 앞에서는 물결의 친구가 된다.', f: '자연의 노래' },
      { t: '움직이지 않는 바위가 강의 흐름을 만든다.', f: '동양 격언' },
      { t: '단단한 것이 부드러운 것에 길을 내어준다.', f: '노자' },
      { t: '산은 자랑하지 않아도 그 자리에 있다.', f: '도덕경' },
    ],
    wood: [
      { t: '자연은 결코 서두르지 않지만, 모든 것을 이루어낸다.', f: '노자' },
      { t: '뿌리 없는 나무는 자라지 못하고, 흐름 없는 물은 살지 못한다.', f: '동양 격언' },
      { t: '오래 가라앉은 나무가 가장 깊은 이야기를 품는다.', f: '자연의 노래' },
      { t: '쓰러진 나무도 누군가의 길이 된다.', f: '동양 격언' },
    ],
    plant: {
      carpet: [
        { t: '바닥에 가까울수록 더 푸르게 자란다.', f: '정원사의 지혜' },
        { t: '낮은 곳의 풀들이 가장 먼저 봄을 안다.', f: '한국 속담' },
        { t: '눈에 띄지 않는 곳에서도 생명은 빛난다.', f: '자연의 노래' },
      ],
      mid: [
        { t: '풀잎은 바람에 흔들리지만 꺾이지 않는다. 흔들림이 곧 살아 있다는 증거이니.', f: '한국 속담' },
        { t: '한 줄기 풀에도 우주가 깃들어 있다.', f: '윌리엄 블레이크' },
        { t: '뿌리는 어둠 속에서 빛을 길러낸다.', f: '동양 격언' },
      ],
      tall: [
        { t: '높이 자라려는 풀은 먼저 깊이 뿌리내린다.', f: '동양 격언' },
        { t: '키 큰 식물도 처음엔 한 알의 씨앗이었다.', f: '랄프 왈도 에머슨' },
        { t: '하늘을 향해 자라되, 흙을 잊지 마라.', f: '정원사의 지혜' },
      ],
      moss: [
        { t: '이끼는 다투지 않고, 그저 천천히 모든 것을 덮는다.', f: '자연의 노래' },
        { t: '오래된 것 위에 새로운 것이 자란다.', f: '동양 격언' },
      ],
    },
    fish: {
      cardinal: [
        { t: '함께 헤엄치면 두려움도 색깔이 된다.', f: '카디널 테트라의 노래' },
        { t: '작은 빛도 모이면 별자리가 된다.', f: '무리의 노래' },
        { t: '혼자였다면 닿지 못했을 곳에, 우리는 함께 닿는다.', f: '동양 격언' },
      ],
      neon: [
        { t: '깊은 물 속에서도 자신만의 빛을 잃지 마라.', f: '네온 테트라의 노래' },
        { t: '눈에 띄지 않아도, 빛은 항상 존재한다.', f: '어둠 속의 빛' },
        { t: '작은 푸른 빛 하나가 깊은 바다를 살린다.', f: '자연의 노래' },
      ],
      angel: [
        { t: '천천히 헤엄쳐도, 결국 같은 바다에 닿는다.', f: '엔젤피쉬의 지혜' },
        { t: '우아함은 속도가 아니라 자세에서 나온다.', f: '오드리 헵번' },
        { t: '고요한 자가 깊은 곳을 본다.', f: '동양 격언' },
      ],
      guppy: [
        { t: '작다는 것은 약하다는 뜻이 아니라, 자유롭다는 뜻이다.', f: '구피의 속삭임' },
        { t: '색을 두려워 마라. 너의 색이 누군가에게는 빛이 된다.', f: '무지개의 노래' },
        { t: '작은 지느러미도 먼 바다를 가른다.', f: '자연의 노래' },
      ],
    },
  };

  function pickQuote(obj) {
    const ud = obj.userData;
    if (ud.kind === 'fish') {
      const arr = QUOTES.fish[ud.species] || QUOTES.fish.cardinal;
      return { q: arr[Math.floor(Math.random() * arr.length)], tag: speciesLabel(ud.species) };
    }
    if (ud.kind === 'plant') {
      const arr = QUOTES.plant[ud.subKind] || QUOTES.plant.mid;
      return { q: arr[Math.floor(Math.random() * arr.length)], tag: plantLabel(ud.subKind) };
    }
    const arr = QUOTES[ud.kind] || QUOTES.plant.mid;
    return { q: arr[Math.floor(Math.random() * arr.length)], tag: ud.kind === 'rock' ? 'STONE' : 'DRIFTWOOD' };
  }

  function speciesLabel(s) {
    return ({
      cardinal: 'CARDINAL TETRA',
      neon: 'NEON TETRA',
      angel: 'ANGELFISH',
      guppy: 'GUPPY',
    })[s] || 'FISH';
  }
  function plantLabel(s) {
    return ({
      carpet: 'CARPET',
      mid: 'MIDGROUND',
      tall: 'STEM PLANT',
      moss: 'MOSS',
    })[s] || 'PLANT';
  }

  /* =========================================================
   * INTERACTION (raycast click → quote)
   * ========================================================= */
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const quoteEl = document.getElementById('quote');
  const quoteText = quoteEl.querySelector('.text');
  const quoteFrom = quoteEl.querySelector('.from');
  const quoteTag = document.getElementById('quoteTag');
  let quoteTimer = null;
  let downAt = 0, downX = 0, downY = 0;

  renderer.domElement.addEventListener('pointerdown', (e) => {
    downAt = performance.now(); downX = e.clientX; downY = e.clientY;
  });
  renderer.domElement.addEventListener('pointerup', (e) => {
    const dx = Math.abs(e.clientX - downX), dy = Math.abs(e.clientY - downY);
    if (performance.now() - downAt > 500 || dx > 6 || dy > 6) return;
    handleClick(e);
  });

  function handleClick(e) {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickables, false);
    if (hits.length === 0) return;
    const obj = hits[0].object;
    const { q, tag } = pickQuote(obj);
    if (!q) return;
    quoteTag.textContent = `— ${tag}`;
    quoteText.textContent = `“${q.t}”`;
    quoteFrom.textContent = q.f;
    quoteEl.classList.add('show');
    clearTimeout(quoteTimer);
    quoteTimer = setTimeout(() => quoteEl.classList.remove('show'), 6000);
  }

  /* =========================================================
   * UI CONTROLS
   * ========================================================= */
  const slider = document.getElementById('brightness');
  const sliderVal = document.getElementById('brightnessVal');
  const warmthSlider = document.getElementById('warmth');
  const warmthVal = document.getElementById('warmthVal');

  let brightness = 1.0;
  let warmth = 0.55;

  function applyLights() {
    sun.intensity = 1.5 * brightness;
    ambient.intensity = 0.55 * brightness;
    rim.intensity = 0.5 * brightness;
    fill.intensity = 0.45 * brightness;
    beam.intensity = 0.7 * brightness;
    causticLights.forEach(l => l.userData.baseIntensity = 0.4 * brightness);
    renderer.toneMappingExposure = 0.35 + brightness * 0.65;

    // warmth: blend sun color
    const cool = new THREE.Color(0xc8e6ff);
    const warm = new THREE.Color(0xfff0c8);
    sun.color.copy(cool).lerp(warm, warmth);
    beam.color.copy(cool).lerp(warm, warmth * 0.8);
    const bgWarmTop = new THREE.Color(0x0a3a48).lerp(new THREE.Color(0x205060), warmth * 0.5);
    bgMat.uniforms.uTop.value.copy(bgWarmTop);
  }

  slider.addEventListener('input', () => {
    brightness = slider.value / 100;
    sliderVal.textContent = slider.value + '%';
    applyLights();
  });
  warmthSlider.addEventListener('input', () => {
    warmth = warmthSlider.value / 100;
    warmthVal.textContent = warmthSlider.value + '%';
    applyLights();
  });
  applyLights();

  /* =========================================================
   * ANIMATE
   * ========================================================= */
  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Camera gentle drift
    camera.position.x = Math.sin(t * 0.07) * 1.6;
    camera.position.y = 5.2 + Math.sin(t * 0.11) * 0.35;
    camera.position.z = 20 + Math.cos(t * 0.05) * 0.6;
    camera.lookAt(0, 3.2 + Math.sin(t * 0.08) * 0.15, 0);

    // Plant sway
    for (const p of plants) {
      p.rotation.z = Math.sin(t * 1.3 + p.userData.swayPhase) * p.userData.swayAmp;
      p.rotation.x = Math.cos(t * 0.95 + p.userData.swayPhase) * p.userData.swayAmp * 0.7;
    }

    // Fish
    for (const f of fishes) f.update(dt, t, fishes);

    // Bubbles
    for (const b of bubbles) {
      b.position.y += b.userData.speed * dt;
      b.position.x += Math.sin(t * 2 + b.userData.wobble) * 0.012;
      b.position.z += Math.cos(t * 1.6 + b.userData.wobble) * 0.008;
      if (b.position.y > TANK.h) {
        b.position.y = 0.2;
        b.position.x = (Math.random() - 0.5) * TANK.w * 0.9;
        b.position.z = (Math.random() - 0.5) * TANK.d * 0.9;
      }
    }

    // Caustics
    for (const l of causticLights) {
      l.intensity = (l.userData.baseIntensity || 0.4)
        * (0.55 + Math.sin(t * l.userData.speed + l.userData.phase) * 0.45);
      l.position.x += Math.sin(t * 0.4 + l.userData.phase) * 0.008;
      l.position.z += Math.cos(t * 0.3 + l.userData.phase) * 0.008;
      // wrap
      if (l.position.x > TANK.w / 2) l.position.x = -TANK.w / 2;
      if (l.position.x < -TANK.w / 2) l.position.x = TANK.w / 2;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // hide loader
  setTimeout(() => document.getElementById('loading').classList.add('hide'), 200);
  </script>
