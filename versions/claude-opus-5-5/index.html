<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AquaGarden 3D 수족관</title>
<link rel="icon" href="data:,">
<style>
:root{
  --glass: rgba(12,24,22,.66);
  --glass2: rgba(20,38,34,.72);
  --line: rgba(190,235,215,.16);
  --ink:#eaf6f0; --muted:#9fbdb1; --accent:#86e3b6; --warm:#ffd59a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1110;color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;outline:none}
button{font:inherit;color:inherit}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#brand{position:fixed;left:16px;top:16px;padding:12px 16px;max-width:min(420px,calc(100vw - 32px));pointer-events:none}
#brand h1{margin:0;font-size:18px;letter-spacing:.02em;font-weight:700}
#brand h1 span{color:var(--accent)}
#brand p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
#panel{position:fixed;right:16px;top:16px;width:min(296px,calc(100vw - 32px));padding:14px 16px 12px;font-size:13px;max-height:calc(100vh - 32px);overflow:auto}
#panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#panel header b{font-size:14px;letter-spacing:.02em}
#panel.collapsed .body{display:none}
#panel.collapsed header{margin-bottom:0}
.iconbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12px}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.presets button{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:7px 0;cursor:pointer;font-size:12.5px}
.presets button:hover{background:rgba(255,255,255,.12)}
.presets button.on{background:rgba(134,227,182,.22);border-color:rgba(134,227,182,.6)}
.row{margin:9px 0}
.row label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:4px}
.row label output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#86e3b6;margin:0}
#kelvin{background:linear-gradient(90deg,#ffb466,#fff1dc,#dfeeff,#a9c8ff);border-radius:6px;height:6px;appearance:none;-webkit-appearance:none}
#kelvin::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #2b4a40;cursor:pointer}
#kelvin::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #2b4a40}
.toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.toggles button{flex:1 1 auto;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:6px 8px;cursor:pointer;font-size:12px}
.toggles button.on{background:rgba(134,227,182,.2);border-color:rgba(134,227,182,.55)}
.species{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12px;color:var(--muted);line-height:1.7}
.species i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
#quote{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);width:min(620px,calc(100vw - 32px));padding:16px 20px 14px;opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease}
#quote.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#quote .kind{font-size:12px;color:var(--accent);letter-spacing:.04em;margin-bottom:6px}
#quote blockquote{margin:0;font-size:16.5px;line-height:1.65;word-break:keep-all}
#quote cite{display:block;margin-top:8px;font-style:normal;color:var(--warm);font-size:13px}
#quote .acts{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#tip{position:fixed;pointer-events:none;padding:4px 9px;border-radius:7px;font-size:12px;background:rgba(8,18,16,.82);border:1px solid var(--line);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0a1110;color:var(--muted);font-size:14px;z-index:10;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
@media (max-width:640px){
  #brand{padding:10px 12px}
  #brand p{display:none}
  #panel{top:auto;bottom:16px;max-height:55vh}
  #quote{bottom:auto;top:76px}
  #quote blockquote{font-size:15px}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="loading">수족관에 물을 채우는 중…</div>

<div id="brand" class="panel">
  <h1>Aqua<span>Garden</span> · 네이처 아쿠아리움</h1>
  <p>드래그로 회전, 휠로 확대, 오른쪽 드래그로 이동합니다.<br>바위·유목·수초·물고기·기포를 클릭하면 관련된 명언이 나타납니다.</p>
</div>

<aside id="panel" class="panel">
  <header><b>조명 조절</b><button class="iconbtn" id="fold" aria-expanded="true">접기</button></header>
  <div class="body">
    <div class="presets" role="group" aria-label="조명 프리셋">
      <button data-p="morning">아침</button>
      <button data-p="noon" class="on">한낮</button>
      <button data-p="sunset">석양</button>
      <button data-p="moon">달빛</button>
    </div>
    <div class="row"><label for="bright">밝기 <output id="vBright">100%</output></label><input id="bright" type="range" min="0" max="200" value="100"></div>
    <div class="row"><label for="kelvin">색온도 <output id="vKelvin">6800K</output></label><input id="kelvin" type="range" min="2800" max="12000" step="100" value="6800"></div>
    <div class="row"><label for="angle">광원 방향 <output id="vAngle">0°</output></label><input id="angle" type="range" min="-60" max="60" value="0"></div>
    <div class="row"><label for="caustic">물결 빛 무늬 <output id="vCaustic">80%</output></label><input id="caustic" type="range" min="0" max="100" value="80"></div>
    <div class="row"><label for="rays">빛줄기 <output id="vRays">70%</output></label><input id="rays" type="range" min="0" max="100" value="70"></div>
    <div class="toggles">
      <button id="tLight" class="on">조명 켜짐</button>
      <button id="tBubble" class="on">기포</button>
      <button id="tRotate">자동 회전</button>
    </div>
    <div class="species" id="species"></div>
  </div>
</aside>

<div id="quote" class="panel" role="dialog" aria-live="polite">
  <div class="kind" id="qKind"></div>
  <blockquote id="qText"></blockquote>
  <cite id="qAuthor"></cite>
  <div class="acts"><button class="iconbtn" id="qNext">다른 명언</button><button class="iconbtn" id="qClose">닫기</button></div>
</div>
<div id="tip"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  유틸리티: 시드 난수, 값 노이즈, fbm
 * ------------------------------------------------------------------ */
const TAU = Math.PI * 2;
let _seed = 20260517;
function rand() { _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rand();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function sstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function hash3(x, y, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 1440662683); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = lerp(lerp(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u), lerp(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u), v);
  const b = lerp(lerp(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u), lerp(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u), v);
  return lerp(a, b, w);
}
function fbm(x, y, z, oct = 4) { let a = 0.5, f = 1, s = 0, n = 0; for (let i = 0; i < oct; i++) { s += a * (noise3(x * f, y * f, z * f) * 2 - 1); n += a; f *= 2.03; a *= 0.5; } return s / n; }
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

/* ------------------------------------------------------------------ *
 *  수조 치수
 * ------------------------------------------------------------------ */
const TX = 5.95, TZ = 2.45, WATER_Y = 5.6, TANK_H = 6.2;
function groundH(x, z) {
  let h = 0.55 + 0.85 * sstep(2.4, -2.4, z);
  h += 0.5 * Math.exp(-((x + 3.3) ** 2 / 3.5 + (z + 0.5) ** 2 / 1.6));
  h += 0.25 * Math.exp(-((x - 2.7) ** 2 / 3 + (z + 0.2) ** 2 / 1.5));
  h += 0.12 * fbm(x * 0.45 + 3.1, 1.7, z * 0.6, 3);
  return h;
}

/* ------------------------------------------------------------------ *
 *  렌더러 / 씬 / 카메라
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const ROOM_BG = srgb(0.05, 0.08, 0.075);
scene.background = ROOM_BG.clone();
const FOG_BASE = srgb(0.62, 0.74, 0.70);
scene.fog = new THREE.FogExp2(FOG_BASE.clone(), 0.028);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.3, 3.4, 12.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 4.5;
controls.maxDistance = 19;
controls.minPolarAngle = 0.28;
controls.maxPolarAngle = 1.66;
controls.autoRotateSpeed = 0.5;
controls.update();

/* ------------------------------------------------------------------ *
 *  조명
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xdff3ff, 0x2b2418, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(1.5, 14, 4);
sun.target.position.set(0, 1, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 2, far: 30 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0xbfe6ff, 0.35);
fill.position.set(-4, 3, 9);
scene.add(fill);

/* ------------------------------------------------------------------ *
 *  셰이더 주입: 코스틱(물결 빛 무늬) + 수초 흔들림
 * ------------------------------------------------------------------ */
const U = { uTime: { value: 0 }, uCaustic: { value: 0.8 }, uCausticColor: { value: new THREE.Color(1, 1, 1) } };

const CAUSTIC_FN = /* glsl */`
uniform float uTime; uniform float uCaustic; uniform vec3 uCausticColor;
varying vec3 vCWorld; varying float vCUp;
float causticPat(vec2 q){
  vec2 p = q * 1.55 - 250.0; vec2 i = p; float c = 1.0; float inten = 0.005; float t = uTime * 0.45 + 23.0;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}`;

function patchEnv(mat, swayAmp = 0) {
  const sway = swayAmp > 0;
  const uAmp = { value: swayAmp };
  mat.userData.swayAmp = uAmp;
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uCaustic = U.uCaustic; sh.uniforms.uCausticColor = U.uCausticColor;
    sh.uniforms.uSwayAmp = uAmp;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
uniform float uTime; varying vec3 vCWorld; varying float vCUp;
${sway ? 'attribute vec2 aSway; uniform float uSwayAmp;' : ''}`)
      .replace('#include <project_vertex>', `
vec4 mvPosition = vec4(transformed, 1.0);
#ifdef USE_INSTANCING
  mvPosition = instanceMatrix * mvPosition;
#endif
${sway ? `
  float swW = aSway.x * aSway.x;
  float swH = 1.0; vec3 swB = vec3(0.0);
  #ifdef USE_INSTANCING
    swB = instanceMatrix[3].xyz; swH = length(instanceMatrix[1].xyz);
  #endif
  float ph = uTime * 1.05 + aSway.y * 6.2831 + swB.x * 0.55 + swB.z * 0.35;
  mvPosition.x += (sin(ph) + 0.35 * sin(ph * 2.7 + 1.3)) * uSwayAmp * swW * swH;
  mvPosition.z += cos(ph * 0.83 + 0.5) * 0.6 * uSwayAmp * swW * swH;
  mvPosition.y -= 0.12 * uSwayAmp * swW * swH * (0.5 + 0.5 * sin(ph));
` : ''}
vec3 cN = objectNormal;
#ifdef USE_INSTANCING
  cN = mat3(instanceMatrix) * cN;
#endif
vCUp = normalize(mat3(modelMatrix) * cN).y;
vCWorld = (modelMatrix * mvPosition).xyz;
mvPosition = modelViewMatrix * mvPosition;
gl_Position = projectionMatrix * mvPosition;
`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\n' + CAUSTIC_FN)
      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
{
  float cz = causticPat(vCWorld.xz + vec2(vCWorld.y * 0.18, vCWorld.y * 0.07));
  float upf = clamp(vCUp * 0.75 + 0.3, 0.12, 1.0);
  float depthF = clamp(1.0 - (${WATER_Y.toFixed(2)} - vCWorld.y) * 0.07, 0.5, 1.0);
  reflectedLight.directDiffuse += diffuseColor.rgb * uCausticColor * (cz * uCaustic * upf * depthF * 2.4);
}`);
  };
  mat.customProgramCacheKey = () => sway ? 'env-sway' : 'env';
  return mat;
}

/* ------------------------------------------------------------------ *
 *  클릭 가능한 오브젝트 목록
 * ------------------------------------------------------------------ */
const clickables = [];
function tag(obj, kind) { obj.userData.kind = kind; clickables.push(obj); return obj; }

/* ------------------------------------------------------------------ *
 *  수조: 배경판, 유리, 받침, 조명등
 * ------------------------------------------------------------------ */
const tank = new THREE.Group(); scene.add(tank);
// 뒷배경 (참고 이미지의 밝은 백스크린)
const backGeo = new THREE.PlaneGeometry(TX * 2, TANK_H, 1, 24);
{
  const c = [], p = backGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = (p.getY(i) + TANK_H / 2) / TANK_H;
    const col = srgb(0.70, 0.78, 0.75).lerp(srgb(0.93, 0.96, 0.95), Math.pow(t, 0.8));
    c.push(col.r, col.g, col.b);
  }
  backGeo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
}
const backMat = new THREE.MeshBasicMaterial({ vertexColors: true, color: 0xffffff });
const backdrop = new THREE.Mesh(backGeo, backMat);
backdrop.position.set(0, TANK_H / 2, -TZ - 0.04);
tank.add(backdrop);

// 유리 모서리와 측면 유리
const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(TX * 2 + 0.1, TANK_H, TZ * 2 + 0.1)),
  new THREE.LineBasicMaterial({ color: 0xcdeee4, transparent: true, opacity: 0.32 }));
edge.position.y = TANK_H / 2; tank.add(edge);
const sideGlassMat = new THREE.MeshBasicMaterial({ color: 0xa9dccb, transparent: true, opacity: 0.07, depthWrite: false, side: THREE.DoubleSide });
for (const s of [-1, 1]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(TZ * 2 + 0.1, TANK_H), sideGlassMat);
  g.rotation.y = Math.PI / 2; g.position.set(s * (TX + 0.05), TANK_H / 2, 0); tank.add(g);
}
// 받침대
const cabinet = new THREE.Mesh(new THREE.BoxGeometry(TX * 2 + 0.7, 1.4, TZ * 2 + 0.9), new THREE.MeshStandardMaterial({ color: 0x15130f, roughness: 0.6 }));
cabinet.position.y = -0.72; cabinet.receiveShadow = true; tank.add(cabinet);
// 조명등
const lampGroup = new THREE.Group();
const lampBody = new THREE.Mesh(new THREE.BoxGeometry(TX * 2 - 0.6, 0.14, 1.0), new THREE.MeshStandardMaterial({ color: 0x1b1f1e, roughness: 0.35, metalness: 0.6 }));
const lampMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const lampFace = new THREE.Mesh(new THREE.PlaneGeometry(TX * 2 - 0.8, 0.8), lampMat);
lampFace.rotation.x = Math.PI / 2; lampFace.position.y = -0.075;
lampGroup.add(lampBody, lampFace);
for (const s of [-1, 1]) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.75, 0.06), lampBody.material);
  leg.position.set(s * (TX - 0.6), -0.4, 0); lampGroup.add(leg);
}
lampGroup.position.set(0, TANK_H + 0.75, 0);
tank.add(lampGroup);
tag(lampBody, 'light'); tag(lampFace, 'light');

/* ------------------------------------------------------------------ *
 *  바닥재 (소일 + 모래) 와 단면
 * ------------------------------------------------------------------ */
function sandiness(x, z) { return sstep(0.12, 0.32, fbm(x * 0.42 + 7.3, 2.2, z * 0.75 - 1.1, 3)) * (1 - sstep(-0.6, -1.4, z)); }
const soilA = srgb(0.075, 0.06, 0.045), soilB = srgb(0.17, 0.13, 0.09), sandA = srgb(0.46, 0.37, 0.25), sandB = srgb(0.62, 0.52, 0.38);
{
  const g = new THREE.PlaneGeometry(TX * 2, TZ * 2, 200, 84);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, c = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const n = noise3(x * 9, 0, z * 9);
    p.setY(i, groundH(x, z) + (n - 0.5) * 0.025);
    const s = sandiness(x, z);
    const soil = soilA.clone().lerp(soilB, Math.pow(n, 3));
    const sand = sandA.clone().lerp(sandB, n);
    const col = soil.lerp(sand, s);
    c.push(col.r, col.g, col.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, patchEnv(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95 })));
  m.receiveShadow = true;
  tank.add(tag(m, 'substrate'));
}
// 바닥재 단면(앞/옆 유리에 비치는 층)
function crossSection(axis, fixed, from, to, n) {
  const P = [], C = [], I = [];
  const rows = 26;
  for (let i = 0; i <= n; i++) {
    const s = lerp(from, to, i / n);
    const x = axis === 'x' ? s : fixed, z = axis === 'x' ? fixed : s;
    const top = groundH(x, z);
    for (let j = 0; j <= rows; j++) {
      const t = j / rows, y = top * t;
      P.push(x, y, z);
      const sp = noise3(x * 14, y * 14, z * 14);
      let col = soilA.clone().lerp(soilB, sp * sp * 1.4);
      if (t > 0.8) col.lerp(sandA, sstep(0.8, 0.97, t) * 0.75);
      if (t < 0.25) col.lerp(srgb(0.03, 0.025, 0.02), 0.6 * (1 - t / 0.25));
      C.push(col.r, col.g, col.b);
    }
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < rows; j++) {
    const a = i * (rows + 1) + j, b = a + rows + 1;
    I.push(a, b, a + 1, b, b + 1, a + 1);

    tip.style.left = Math.min(lastMove.clientX + 14, window.innerWidth - 220) + 'px'; tip.style.top = (lastMove.clientY + 16) + 'px';
    tip.style.opacity = 1; renderer.domElement.style.cursor = 'pointer';
  } else { tip.style.opacity = 0; renderer.domElement.style.cursor = 'grab'; }
  lastMove = null;
}

/* ------------------------------------------------------------------ *
 *  조명 컨트롤
 * ------------------------------------------------------------------ */
function kelvinColor(k) {
  const t = k / 100; let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661; b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307; }
  else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); b = 255; }
  return srgb(clamp(r, 0, 255) / 255, clamp(g, 0, 255) / 255, clamp(b, 0, 255) / 255);
}
const state = { bright: 1, kelvin: 6800, angle: 0, caustic: 0.8, rays: 0.7, on: true };
const PRESETS = {
  morning: { bright: 0.85, kelvin: 5200, angle: -35, caustic: 0.6, rays: 0.8 },
  noon: { bright: 1.0, kelvin: 6800, angle: 0, caustic: 0.8, rays: 0.7 },
  sunset: { bright: 0.62, kelvin: 3100, angle: 48, caustic: 0.45, rays: 0.9 },
  moon: { bright: 0.28, kelvin: 11500, angle: -18, caustic: 0.3, rays: 0.35 },
};
const ui = {
  bright: document.getElementById('bright'), kelvin: document.getElementById('kelvin'), angle: document.getElementById('angle'),
  caustic: document.getElementById('caustic'), rays: document.getElementById('rays'),
};
function applyLighting() {
  const s = state.on ? state.bright : 0.04;
  const c = kelvinColor(state.kelvin);
  const a = THREE.MathUtils.degToRad(state.angle);
  sunTilt = a;
  sun.color.copy(c); sun.intensity = 3.1 * s;
  sun.position.set(Math.sin(a) * 12, Math.cos(a) * 14, 4);
  hemi.color.copy(c).lerp(new THREE.Color(0xdff3ff), 0.4); hemi.intensity = 0.85 * s + 0.05;
  fill.intensity = 0.35 * s + 0.03;
  U.uCaustic.value = state.caustic * Math.min(s, 1.4);
  U.uCausticColor.value.copy(c);
  rayMat.uniforms.uI.value = state.rays * Math.min(s, 1.5);
  rayMat.uniforms.uColor.value.copy(c);
  lampMat.color.copy(c).multiplyScalar(state.on ? 0.6 + 0.6 * Math.min(state.bright, 1.5) : 0.05);
  const bd = clamp(0.12 + 0.88 * s, 0.06, 1.25);
  backMat.color.copy(c).lerp(new THREE.Color(1, 1, 1), 0.55).multiplyScalar(bd);
  scene.fog.color.copy(FOG_BASE).multiply(c.clone().lerp(new THREE.Color(1, 1, 1), 0.5)).multiplyScalar(clamp(0.1 + 0.9 * s, 0.05, 1.15));
  surfMat.color.copy(c).lerp(new THREE.Color(0xe8fff6), 0.5).multiplyScalar(clamp(s, 0.2, 1.2));
  bubbleMat.uniforms.uColor.value.setScalar(clamp(0.25 + 0.75 * s, 0.2, 1.2));
  motes.material.opacity = 0.2 + 0.35 * Math.min(s, 1);
  document.getElementById('vBright').textContent = Math.round(state.bright * 100) + '%';
  document.getElementById('vKelvin').textContent = state.kelvin + 'K';
  document.getElementById('vAngle').textContent = state.angle + '°';
  document.getElementById('vCaustic').textContent = Math.round(state.caustic * 100) + '%';
  document.getElementById('vRays').textContent = Math.round(state.rays * 100) + '%';
}
function syncUI() {
  ui.bright.value = Math.round(state.bright * 100); ui.kelvin.value = state.kelvin; ui.angle.value = state.angle;
  ui.caustic.value = Math.round(state.caustic * 100); ui.rays.value = Math.round(state.rays * 100);
}
const presetBtns = [...document.querySelectorAll('.presets button')];
function clearPreset() { presetBtns.forEach(b => b.classList.remove('on')); }
ui.bright.oninput = () => { state.bright = ui.bright.value / 100; clearPreset(); applyLighting(); };
ui.kelvin.oninput = () => { state.kelvin = +ui.kelvin.value; clearPreset(); applyLighting(); };
ui.angle.oninput = () => { state.angle = +ui.angle.value; clearPreset(); applyLighting(); };
ui.caustic.oninput = () => { state.caustic = ui.caustic.value / 100; clearPreset(); applyLighting(); };
ui.rays.oninput = () => { state.rays = ui.rays.value / 100; clearPreset(); applyLighting(); };
let tween = null;
presetBtns.forEach(b => b.onclick = () => {
  clearPreset(); b.classList.add('on');
  const from = { ...state }, to = PRESETS[b.dataset.p];
  state.on = true; document.getElementById('tLight').classList.add('on'); document.getElementById('tLight').textContent = '조명 켜짐';
  tween = { from, to, t: 0 };
});
function updateTween(dt) {
  if (!tween) return;
  tween.t = Math.min(1, tween.t + dt / 1.2);
  const k = sstep(0, 1, tween.t);
  for (const key of ['bright', 'kelvin', 'angle', 'caustic', 'rays']) state[key] = lerp(tween.from[key], tween.to[key], k);
  state.kelvin = Math.round(state.kelvin / 100) * 100; state.angle = Math.round(state.angle);
  syncUI(); applyLighting();
  if (tween.t >= 1) tween = null;
}
const tLight = document.getElementById('tLight');
tLight.onclick = () => { state.on = !state.on; tLight.classList.toggle('on', state.on); tLight.textContent = state.on ? '조명 켜짐' : '조명 꺼짐'; applyLighting(); };
const tBubble = document.getElementById('tBubble');
tBubble.onclick = () => { bubblesOn = !bubblesOn; tBubble.classList.toggle('on', bubblesOn); if (bubblesOn) for (let i = 0; i < NB; i++) if (B.pos[i].y < -10) spawnBubble(i, true); };
const tRotate = document.getElementById('tRotate');
tRotate.onclick = () => { controls.autoRotate = !controls.autoRotate; tRotate.classList.toggle('on', controls.autoRotate); };
const panel = document.getElementById('panel'), fold = document.getElementById('fold');
fold.onclick = () => { const c = panel.classList.toggle('collapsed'); fold.textContent = c ? '펼치기' : '접기'; fold.setAttribute('aria-expanded', String(!c)); };
if (window.innerWidth < 640) fold.onclick();
document.getElementById('species').innerHTML = '물고기 ' + Object.keys(SPECIES).length + '종 · ' + fishes.length + '마리<br>' +
  Object.values(SPECIES).map(s => `<span><i style="background:${s.swatch}"></i>${s.name} ${s.count}</span>`).join('<br>');
applyLighting();

/* ------------------------------------------------------------------ *
 *  루프
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
const clock = new THREE.Clock();
let elapsed = 0, first = true;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  U.uTime.value = elapsed;
  updateTween(dt);
  updateFish(dt, elapsed);
  updateBubbles(dt, elapsed);
  updateSurface(elapsed);
  updateRays(elapsed);
  updateMotes(dt, elapsed);
  updateHover(performance.now());
  controls.update();
  controls.target.x = clamp(controls.target.x, -4, 4); controls.target.y = clamp(controls.target.y, 0.8, 5); controls.target.z = clamp(controls.target.z, -2, 2);
  renderer.render(scene, camera);
  if (first) { first = false; document.getElementById('loading').classList.add('done'); }
}
renderer.setAnimationLoop(frame);
window.__aqua = { fishes, SPECIES, QUOTES, clickables, state, camera, pick, showQuote };
</script>
