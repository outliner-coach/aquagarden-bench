<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AquaGarden 3D · 디지털 수족관</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
  :root{
    --glass: rgba(255,255,255,.10);
    --glass-strong: rgba(255,255,255,.16);
    --line: rgba(255,255,255,.20);
    --txt: rgba(255,255,255,.94);
    --txt-dim: rgba(255,255,255,.58);
    --accent: #7fe3d4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a1114}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo",Segoe UI,sans-serif;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  /* soft vignette over the render */
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(0,0,0,.42) 100%);}

  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,.28);
  }

  /* ---------- title ---------- */
  #title{position:fixed;top:20px;left:20px;padding:14px 18px 13px;z-index:10;user-select:none}
  #title h1{font-size:19px;font-weight:650;letter-spacing:-.2px;line-height:1.1}
  #title h1 span{color:var(--accent)}
  #title p{margin-top:4px;font-size:11.5px;color:var(--txt-dim);letter-spacing:.06em}

  /* ---------- light panel ---------- */
  #panel{position:fixed;top:20px;right:20px;width:246px;padding:14px 16px 15px;z-index:10;user-select:none}
  #panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  #panel .ph b{font-size:13px;font-weight:600;letter-spacing:.02em}
  #fold{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--txt-dim);font-size:14px;line-height:1;cursor:pointer;transition:.18s}
  #fold:hover{background:var(--glass-strong);color:var(--txt)}
  #pbody{display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:max-height .34s ease,opacity .24s ease;max-height:520px;opacity:1}
  #panel.folded #pbody{max-height:0;opacity:0}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin:9px 0 5px}
  .row label{font-size:11.5px;color:var(--txt-dim);letter-spacing:.02em}
  .row .val{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:rgba(255,255,255,.20)}
  input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.20)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#fff;margin-top:-5px;box-shadow:0 1px 5px rgba(0,0,0,.45);transition:transform .12s}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:13px}
  .btns.tg{grid-template-columns:1fr 1fr;margin-top:8px}
  .btns button{
    padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;
    color:var(--txt-dim);font-size:11.5px;font-family:inherit;cursor:pointer;transition:.18s;letter-spacing:.02em}
  .btns button:hover{background:var(--glass-strong);color:var(--txt)}
  .btns button.on{background:rgba(127,227,212,.18);border-color:rgba(127,227,212,.55);color:#d7fff7}
  .sep{height:1px;background:var(--line);margin:14px 0 2px;opacity:.7}

  /* ---------- quote card ---------- */
  #quote{
    position:fixed;left:50%;bottom:44px;transform:translate(-50%,26px);
    width:min(560px,calc(100vw - 48px));padding:20px 24px 21px;z-index:12;
    opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1);
    cursor:pointer;text-align:center}
  #quote.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #qKind{display:inline-block;font-size:10.5px;letter-spacing:.14em;color:var(--accent);
    text-transform:uppercase;margin-bottom:11px;padding:3px 10px;border:1px solid rgba(127,227,212,.35);border-radius:20px}
  #qText{font-size:17px;line-height:1.62;font-weight:450;letter-spacing:-.1px;word-break:keep-all}
  #qAuthor{margin-top:11px;font-size:12.5px;color:var(--txt-dim);letter-spacing:.02em}

  /* ---------- hint ---------- */
  #hint{position:fixed;left:20px;bottom:22px;z-index:10;font-size:11.5px;color:var(--txt-dim);
    padding:9px 14px;opacity:0;transition:opacity .9s ease;user-select:none;pointer-events:none}
  #hint.show{opacity:1}

  /* ---------- loading ---------- */
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;background:#0a1114;z-index:50;transition:opacity .7s ease}
  #load.gone{opacity:0;pointer-events:none}
  #load .ring{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.14);
    border-top-color:var(--accent);animation:spin .9s linear infinite}
  #load p{font-size:12px;color:var(--txt-dim);letter-spacing:.1em}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{position:fixed;inset:auto 20px 20px 20px;padding:14px 16px;border-radius:12px;
    background:rgba(120,20,20,.9);font-size:12px;z-index:99;display:none;white-space:pre-wrap}

  @media (max-width:760px){
    #panel{width:200px;top:14px;right:14px;padding:12px 13px 13px}
    #title{top:14px;left:14px;padding:11px 14px 10px}
    #title h1{font-size:16px}
    #panel.folded{width:auto}
    #qText{font-size:15px}
    #quote{bottom:26px;padding:16px 18px 17px}
    #hint{bottom:14px;left:14px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>

<div id="title" class="glass">
  <h1>Aqua<span>Garden</span> 3D</h1>
  <p>디지털 수족관</p>
</div>

<div id="panel" class="glass">
  <div class="ph"><b>조명</b><button id="fold" title="접기/펼치기">−</button></div>
  <div id="pbody">
    <div class="row"><label>밝기</label><span class="val" id="vBright">100%</span></div>
    <input type="range" id="sBright" min="0" max="200" step="1" value="100">

    <div class="row"><label>색온도</label><span class="val" id="vKelvin">6300K</span></div>
    <input type="range" id="sKelvin" min="2700" max="9000" step="50" value="6300">

    <div class="row"><label>물 색조</label><span class="val" id="vTint">균형</span></div>
    <input type="range" id="sTint" min="0" max="100" step="1" value="45">

    <div class="sep"></div>
    <div class="btns" id="presets">
      <button data-p="day" class="on">주광</button>
      <button data-p="sunset">석양</button>
      <button data-p="moon">달빛</button>
      <button data-p="rgb">RGB</button>
    </div>
    <div class="btns tg">
      <button id="tRays" class="on">광선</button>
      <button id="tShadow" class="on">그림자</button>
    </div>
  </div>
</div>

<div id="quote" class="glass">
  <div id="qKind">유목</div>
  <div id="qText"></div>
  <div id="qAuthor"></div>
</div>

<div id="hint" class="glass">오브젝트를 클릭하면 명언이 나타납니다 · 드래그로 회전</div>

<div id="load"><div class="ring"></div><p>AQUAGARDEN</p></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   1. CONFIG
   ===================================================================== */
const TANK   = { w: 12, h: 5.6, d: 5.4 };            // ~2.2 : 1 : 1
const HX = TANK.w / 2, HZ = TANK.d / 2;
const WATER_Y = 5.02;                                 // water line
const GLASS_T = 0.055;                                // glass thickness

const QUALITY = {
  grass       : 11000,
  mossWood    : 520,
  mossRock    : 330,
  bubbles     : 190,
  shadowMap   : 1024,
  ripplePool  : 10,
};

/* =====================================================================
   2. UTILS / NOISE
   ===================================================================== */
const clamp  = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp   = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rnd    = (a, b) => a + Math.random() * (b - a);
const rndi   = (a, b) => Math.floor(rnd(a, b + 1));
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
const TAU    = Math.PI * 2;

function fract(x){ return x - Math.floor(x); }
function hash2(x, y){ return fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123); }
function hash3(x, y, z){ return fract(Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453123); }

function noise2(x, y){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi),     b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function noise3(x, y, z){
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smooth(xf), v = smooth(yf), w = smooth(zf);
  const c000 = hash3(xi,   yi,   zi  ), c100 = hash3(xi+1, yi,   zi  );
  const c010 = hash3(xi,   yi+1, zi  ), c110 = hash3(xi+1, yi+1, zi  );
  const c001 = hash3(xi,   yi,   zi+1), c101 = hash3(xi+1, yi,   zi+1);
  const c011 = hash3(xi,   yi+1, zi+1), c111 = hash3(xi+1, yi+1, zi+1);
  const x00 = lerp(c000, c100, u), x10 = lerp(c010, c110, u);
  const x01 = lerp(c001, c101, u), x11 = lerp(c011, c111, u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm2(x, y, oct = 4){
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += a * (noise2(x * f, y * f) * 2 - 1); f *= 2.03; a *= 0.5; }
  return s;
}
function fbm3(x, y, z, oct = 4){
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += a * (noise3(x * f, y * f, z * f) * 2 - 1); f *= 2.03; a *= 0.5; }
  return s;
}

/** Kelvin -> linear-ish RGB (Tanner Helland approximation, 0..1) */
function kelvinToRGB(k){
  const t = clamp(k, 1000, 40000) / 100;
  let r, g, b;
  if (t <= 66){ r = 255; }
  else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); }
  if (t <= 66){ g = 99.4708025861 * Math.log(t) - 161.1195681661; }
  else { g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); }
  if (t >= 66){ b = 255; }
  else if (t <= 19){ b = 0; }
  else { b = 138.5177312231 * Math.log(t - 10) - 305.0447927307; }
  return [clamp(r, 0, 255) / 255, clamp(g, 0, 255) / 255, clamp(b, 0, 255) / 255];
}

/** Substrate height at a world (x,z) — slopes up toward the back with mounds. */
function subH(x, z){
  const tBack = clamp((HZ - z) / TANK.d, 0, 1);           // 0 front .. 1 back
  let h = 0.40 + 1.00 * Math.pow(tBack, 1.35);
  h += 0.15 * fbm2(x * 0.38 + 11.2, z * 0.38 - 4.7, 3);
  h += 0.46 * Math.exp(-(((x - 2.2) / 2.7) ** 2 + ((z + 0.6) / 1.9) ** 2));   // rock mound
  h += 0.26 * Math.exp(-(((x + 2.6) / 2.5) ** 2 + ((z + 0.4) / 1.8) ** 2));   // wood mound
  return h;
}

/* time uniforms bumped once per frame */
const TICK_U = [];
/* materials that can be highlighted on hover */
const HL_MATS = [];
function registerHL(mat){
  if (mat.userData.baseEI === undefined){
    mat.userData.baseEI = mat.emissiveIntensity ?? 1;
    mat.userData.hlA = 0;
    HL_MATS.push(mat);
  }
  return mat;
}

/* =====================================================================
   3. PROCEDURAL TEXTURES (canvas)
   ===================================================================== */
function cv(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function finishTex(c, repX = 1, repY = 1, srgb = true){
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.anisotropy = 4;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function soilTexture(){
  const S = 256, c = cv(S, S), g = c.getContext('2d');
  g.fillStyle = '#15110f'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 9000; i++){
    const x = Math.random() * S, y = Math.random() * S;
    const r = Math.random() * 2.1 + 0.5;
    const v = Math.random();
    if (v < 0.55)      g.fillStyle = 'rgba(38,31,26,' + (0.35 + Math.random() * 0.5) + ')';
    else if (v < 0.85) g.fillStyle = 'rgba(58,48,40,' + (0.25 + Math.random() * 0.4) + ')';
    else if (v < 0.96) g.fillStyle = 'rgba(12,10,9,'  + (0.4 + Math.random() * 0.5) + ')';
    else               g.fillStyle = 'rgba(96,86,74,' + (0.18 + Math.random() * 0.3) + ')';
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  return finishTex(c, 7, 4);
}

function soilRough(){
  const S = 128, c = cv(S, S), g = c.getContext('2d');
  g.fillStyle = '#d0d0d0'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 2500; i++){
    g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.5) + ')';
    g.beginPath(); g.arc(Math.random() * S, Math.random() * S, Math.random() * 2, 0, TAU); g.fill();
  }
  return finishTex(c, 7, 4, false);
}

function backWallTexture(){
  const W = 128, H = 256, c = cv(W, H), g = c.getContext('2d');
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0.00, '#eef2f1');
  lg.addColorStop(0.50, '#e3e9e8');
  lg.addColorStop(1.00, '#d2dbd9');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  // frosted grain
  for (let i = 0; i < 5000; i++){
    g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.05) + ')';
    g.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6);
  }
  return finishTex(c, 1, 1);
}

function rayTexture(){
  const W = 64, H = 256, c = cv(W, H), g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  const lg = g.createLinearGradient(0, 0, W, 0);
  lg.addColorStop(0.00, 'rgba(255,255,255,0)');
  lg.addColorStop(0.42, 'rgba(255,255,255,.62)');
  lg.addColorStop(0.55, 'rgba(255,255,255,.95)');
  lg.addColorStop(0.70, 'rgba(255,255,255,.45)');
  lg.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const vg = g.createLinearGradient(0, 0, 0, H);
  vg.addColorStop(0.00, 'rgba(0,0,0,0)');
  vg.addColorStop(0.10, 'rgba(0,0,0,.25)');
  vg.addColorStop(0.75, 'rgba(0,0,0,.85)');
  vg.addColorStop(1.00, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const TEX = {
  soil : soilTexture(),
  soilR: soilRough(),
  wall : backWallTexture(),
  ray  : rayTexture(),
};

/* =====================================================================
   4. RENDERER / SCENE / CAMERA / CONTROLS
   ===================================================================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1215);
scene.fog = new THREE.FogExp2(0x8fc0ba, 0.030);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
camera.position.set(0.22, 3.20, 10.35);

// Pointer capture can throw NotFoundError when a pointer is released or cancelled
// between pointerdown and capture (synthetic events, lost focus, multi-touch).
// OrbitControls does not guard this, so make it a no-op instead of a hard error.
{
  const el = renderer.domElement;
  const setPC = el.setPointerCapture.bind(el);
  const relPC = el.releasePointerCapture.bind(el);
  el.setPointerCapture = id => { try { setPC(id); } catch (e) { /* pointer already gone */ } };
  el.releasePointerCapture = id => { try { relPC(id); } catch (e) { /* pointer already gone */ } };
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.68, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.7;
controls.minDistance = 6.4;
controls.maxDistance = 17.0;
controls.minPolarAngle = 0.52;                 // never look straight down
controls.maxPolarAngle = 1.63;                 // never go under the tank
controls.minAzimuthAngle = -Math.PI / 3;       // ±60° from the front
controls.maxAzimuthAngle =  Math.PI / 3;

/* Distance at which the whole tank sits inside the viewport with a little air.
   Recomputed on resize so a narrow/portrait window pulls back instead of cropping. */
function fitDistance(){
  // a hidden/zero-size viewport gives a non-finite aspect; fall back to 16:9
  const aspect = (isFinite(camera.aspect) && camera.aspect > 0.05) ? camera.aspect : 16 / 9;
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * aspect);
  const dW = ((TANK.w + 0.5) / 0.86) / 2 / Math.tan(hFov / 2);
  const dH = ((TANK.h + 1.1) / 0.92) / 2 / Math.tan(vFov / 2);
  const d = Math.max(dW, dH);
  return isFinite(d) ? clamp(d, 6.4, 30) : 10.4;
}
let userZoomed = false;
const _fitDir = new THREE.Vector3();
function frameTank(){
  const d = fitDistance();
  controls.maxDistance = Math.max(17.0, d + 3.0);
  _fitDir.copy(camera.position).sub(controls.target);
  // recover from any degenerate/NaN camera state instead of staying broken
  if (!isFinite(_fitDir.x) || !isFinite(_fitDir.y) || !isFinite(_fitDir.z) || _fitDir.lengthSq() < 1e-8){
    _fitDir.set(0.021, 0.050, 1);                 // default: front, slightly above centre
  }
  _fitDir.normalize();
  camera.position.copy(controls.target).addScaledVector(_fitDir, d);
}
renderer.domElement.addEventListener('wheel', () => { userZoomed = true; }, { passive: true });
renderer.domElement.addEventListener('touchstart', e => {
  if (e.touches && e.touches.length > 1) userZoomed = true;
}, { passive: true });

frameTank();
controls.update();

/* =====================================================================
   5. SHADER INJECTIONS (shared onBeforeCompile hooks -> one program each)
   ===================================================================== */

/* ---- 5a. caustics + world-space light veins (substrate / rocks / wood) ---- */
const CAUSTIC_FN = `
float aqCw(vec2 p, float t){
  return sin(p.x*1.70 + t*0.75) + sin(p.y*1.93 - t*0.62)
       + sin((p.x+p.y)*1.31 + t*0.51) + sin(length(p)*2.15 - t*0.90);
}
float aqCaustic(vec2 p, float t){
  float a = aqCw(p*1.10, t);
  float b = aqCw(p*2.30 + vec2(3.1,1.7), t*1.29);
  float q = abs(a*0.5 + b*0.26);
  return pow(smoothstep(0.16, 0.0, q), 1.6);              // fine network of veins
}`;

function causticOBC(shader){
  Object.assign(shader.uniforms, this.userData.u);
  shader.vertexShader = 'varying vec3 vAqWP;\nvarying vec3 vAqWN;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     vAqWP = (modelMatrix * vec4(transformed, 1.0)).xyz;
     vAqWN = normalize(mat3(modelMatrix) * normal);`);
  shader.fragmentShader =
    'varying vec3 vAqWP;\nvarying vec3 vAqWN;\nuniform float uTime;\nuniform float uCaustic;\nuniform vec3 uCausticCol;\n'
    + CAUSTIC_FN + '\n' + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>',
    `#include <emissivemap_fragment>
     {
       float cv = aqCaustic(vAqWP.xz * 2.60, uTime * 0.62);
       float up = clamp(vAqWN.y * 0.7 + 0.38, 0.0, 1.0);
       float dp = smoothstep(0.0, 3.2, ${WATER_Y.toFixed(2)} - vAqWP.y);
       totalEmissiveRadiance += diffuseColor.rgb * uCausticCol * (cv * uCaustic * up * (1.0 - dp * 0.28) * 3.6);
     }`);
}

function makeCausticMat(params, causticAmt){
  const m = new THREE.MeshStandardMaterial(params);
  m.userData.u = {
    uTime      : { value: 0 },
    uCaustic   : { value: causticAmt },
    uCausticCol: { value: new THREE.Color(0.55, 0.92, 0.86) },
  };
  m.onBeforeCompile = causticOBC;
  TICK_U.push(m.userData.u.uTime);
  CAUSTIC_U.push({ u: m.userData.u, base: causticAmt });
  return registerHL(m);
}
const CAUSTIC_U = [];

/* ---- 5b. plant sway (base fixed, tips move; 2 sines, per-instance phase) ---- */
function plantOBC(shader){
  Object.assign(shader.uniforms, this.userData.u);
  shader.vertexShader =
    'uniform float uTime;\nuniform float uSwayAmp;\nuniform float uSwayFreq;\nuniform float uSwayH;\nattribute float aPhase;\n'
    + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     {
       float hh = clamp(transformed.y / uSwayH, 0.0, 1.0);
       float f  = hh * hh * (3.0 - 2.0 * hh);
       float p  = uTime * uSwayFreq + aPhase;
       float s  = sin(p) * 0.68 + sin(p * 1.83 + 1.1) * 0.32;
       float c  = cos(p * 0.71 + aPhase * 0.37);
       transformed.x += uSwayAmp * f * s;
       transformed.z += uSwayAmp * 0.42 * f * c;
       transformed.y -= uSwayAmp * 0.10 * f * abs(s);
     }`);
}

function makePlantMat(params, sway){
  const m = new THREE.MeshStandardMaterial(params);
  m.userData.u = {
    uTime    : { value: 0 },
    uSwayAmp : { value: sway.amp },
    uSwayFreq: { value: sway.freq },
    uSwayH   : { value: sway.h },
  };
  m.onBeforeCompile = plantOBC;
  TICK_U.push(m.userData.u.uTime);
  return registerHL(m);
}

/* ---- 5c. fish undulation + per-vertex glow ---- */
function fishOBC(shader){
  Object.assign(shader.uniforms, this.userData.u);
  shader.vertexShader =
    'uniform float uTime;\nuniform float uFreq;\nuniform float uAmp;\nuniform float uHalf;\nuniform float uLen;\n'
    + 'uniform float uPhase;\nuniform float uK;\nattribute float aAmp;\nattribute float aPhase;\nattribute float aGlow;\nvarying float vAqGlow;\n'
    + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     {
       float tz = (uHalf - transformed.z) / uLen;
       float w  = smoothstep(0.0, 1.0, clamp(tz, 0.0, 1.0));
       float ph = uTime * uFreq + uPhase + aPhase - tz * uK;
       float s  = sin(ph) * 0.78 + sin(ph * 1.9 + 1.3) * 0.22;
       transformed.x += uAmp * aAmp * w * s;
       transformed.y += uAmp * aAmp * w * 0.10 * cos(ph * 0.7);
       vAqGlow = aGlow;
     }`);
  shader.fragmentShader = 'varying float vAqGlow;\n' + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>',
    `#include <emissivemap_fragment>
     totalEmissiveRadiance += diffuseColor.rgb * vAqGlow * 1.35;`);
}

/* ---- 5d. water surface (vertex waves + analytic normals) ---- */
const WAVE_FN = `
float aqWav(vec2 p, float t){
  return sin(p.x*0.95 + t*0.85) * 0.055
       + sin(p.y*1.28 - t*0.71) * 0.042
       + sin((p.x + p.y)*0.74 + t*0.53) * 0.032;
}`;
function waterOBC(shader){
  Object.assign(shader.uniforms, this.userData.u);
  shader.vertexShader = 'uniform float uTime;\n' + WAVE_FN + '\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <beginnormal_vertex>',
    `#include <beginnormal_vertex>
     {
       float e  = 0.20;
       float h0 = aqWav(position.xy, uTime);
       float hx = aqWav(position.xy + vec2(e, 0.0), uTime) - h0;
       float hy = aqWav(position.xy + vec2(0.0, e), uTime) - h0;
       objectNormal = normalize(vec3(-hx / e * 0.45, -hy / e * 0.45, 1.0));
     }`);
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>',
    `#include <begin_vertex>
     transformed.z += aqWav(position.xy, uTime);`);
  // Fresnel-ish alpha: near-invisible head-on, a soft sheen at grazing angles
  shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>',
    `#include <emissivemap_fragment>
     {
       float fres = pow(1.0 - clamp(dot(normalize(vViewPosition), normal), 0.0, 1.0), 2.6);
       diffuseColor.a *= mix(0.34, 1.05, fres);
     }`);
}

function recomputeLightTargets(){
  const p = PRESETS[LS.preset];
  LT.bright = LS.bright;
  LT.hemi   = p.hemi;
  LT.amb    = p.amb;
  LT.fogD   = p.fogD;
  LT.rays   = p.rays;
  LT.rimI   = p.rimI;
  LT.caustic= p.caustic;
  LT.exp    = p.exp;
  LT.keyPos.set(p.keyPos[0], p.keyPos[1], p.keyPos[2]);
  const k = kelvinToRGB(LS.kelvin);
  LT.keyCol.setRGB(k[0], k[1], k[2], THREE.SRGBColorSpace);
  LT.ambCol.set(p.ambCol);
  LT.rayCol.set(p.rayCol);
  // water tint: blue <-> green, tempered by colour temperature
  LT.fogCol.copy(TINT_BLUE).lerp(TINT_GREEN, LS.tint);
  LT.fogCol.lerp(_tmpCol.setRGB(k[0], k[1], k[2], THREE.SRGBColorSpace), 0.42);
  LS.rgbOn = p.rgb;
}

function applyLighting(dt){
  const a = 1 - Math.exp(-dt / 0.26);                     // ~0.8 s settle
  LS.hemi    = lerp(LS.hemi, LT.hemi, a);
  LS.amb     = lerp(LS.amb, LT.amb, a);
  LS.fogD    = lerp(LS.fogD, LT.fogD, a);
  LS.rays    = lerp(LS.rays, LT.rays, a);
  LS.rimI    = lerp(LS.rimI, LT.rimI, a);
  LS.caustic = lerp(LS.caustic, LT.caustic, a);
  LS.exp     = lerp(LS.exp, LT.exp, a);
  LS.keyCol.lerp(LT.keyCol, a);
  LS.ambCol.lerp(LT.ambCol, a);
  LS.fogCol.lerp(LT.fogCol, a);
  LS.rayCol.lerp(LT.rayCol, a);
  LS.keyPos.lerp(LT.keyPos, a);
  const b = lerp(LS.bright, LT.bright, a); LS.bright = b;

  let kc = LS.keyCol;
  if (LS.rgbOn){
    LS.rgbHue = (LS.rgbHue + dt * 0.045) % 1;
    kc = _tmpCol.setHSL(LS.rgbHue, 0.55, 0.62);
  }
  keyLight.color.copy(kc);
  keyLight.intensity = 2.05 * b;
  keyLight.position.copy(LS.keyPos);
  fillLight.color.copy(kc).lerp(_FILL_C, 0.55);
  fillLight.intensity = 0.40 * b;
  rimLight.intensity = LS.rimI * b;
  hemi.intensity = LS.hemi * (0.10 + 0.90 * b);
  hemi.color.copy(LS.ambCol).lerp(_WHITE_C, 0.35);
  ambient.color.copy(LS.ambCol);
  ambient.intensity = LS.amb * (0.08 + 0.92 * b);
  scene.fog.color.copy(LS.fogCol);
  scene.fog.density = LS.fogD;
  scene.background.copy(LS.fogCol).multiplyScalar(0.13);
  renderer.toneMappingExposure = LS.exp;
  keyLight.castShadow = LS.showShadow;

  LS.emScale = 0.18 + 0.82 * b;
  const cAmt = LS.caustic * (0.07 + 0.93 * b);
  for (const e of CAUSTIC_U){
    e.u.uCaustic.value = cAmt * e.base;
    e.u.uCausticCol.value.copy(kc).lerp(_CAUS_C, 0.5);
  }
  if (raysGroup){
    raysGroup.visible = LS.showRays && LS.rays * b > 0.005;
    rayMat.opacity = LS.rays * (0.35 + 0.65 * b);
    rayMat.color.copy(LS.rayCol);
  }
}

function buildBranch(spec){
  const pts = spec.pts.map(p => new THREE.Vector3(p[0], p[1], p[2]));

  const p = g.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const centre = new THREE.Vector3(), v = new THREE.Vector3();
  const base = new THREE.Color(0x3d2a1a), dark = new THREE.Color(0x190f08), light = new THREE.Color(0x5e462d);
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const ring = Math.floor(i / (RS + 1));
    const t = ring / TS;
    curve.getPointAt(Math.min(t, 1), centre);
    v.set(p.getX(i), p.getY(i), p.getZ(i)).sub(centre);       // unit radial offset
    const ang = Math.atan2(v.z, v.x);
    // bark noise stretched ALONG the branch axis -> vertical streaks, not blotches
    const bark = 1
      + 0.115 * fbm2(t * 5.0 + spec.pts[0][0] * 3, ang * 5.8, 3)
      + 0.045 * fbm2(t * 21.0, ang * 1.5, 2)
      + 0.030 * Math.sin(ang * 9 + t * 5.5);
    const taper = lerp(spec.r0, spec.r1, Math.pow(t, spec.tp)) * (1 + 0.055 * Math.sin(t * 9.0));
    v.multiplyScalar(taper * bark);
    p.setXYZ(i, centre.x + v.x, centre.y + v.y, centre.z + v.z);
    const n = fbm2(t * 2.8 + 3.3, ang * 4.6 - 2.1, 3);      // lengthwise colour streaks
    const g = fbm2(t * 17.0, ang * 2.2, 2);
    c.copy(base).lerp(dark, clamp(0.52 - n * 1.05 + g * 0.18, 0, 1)).lerp(light, clamp(n * 0.75, 0, 0.40));
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}

const rockBase  = new THREE.Color(0xb9b0a0);
const rockLight = new THREE.Color(0xd8d2c4);
const rockDark  = new THREE.Color(0x413c34);
const rockRust  = new THREE.Color(0x8a6b4f);

function buildRock(spec, idx, detail){
  // merge the icosahedron's duplicated verts so computeVertexNormals gives a
  // smooth surface (no visible facets); uv is dropped since no map is used
  let g = new THREE.IcosahedronGeometry(1, detail);
  g.deleteAttribute('uv');
  g = mergeVertices(g);
  const p = g.attributes.position;
  const cols = new Float32Array(p.count * 3);
  const c = new THREE.Color();
  const seed = idx * 17.3;
  for (let i = 0; i < p.count; i++){
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const shape  = fbm3(x * 1.35 + seed, y * 1.35, z * 1.35 - seed, 3);          // big lumpy form
    const strata = fbm3(x * 1.70 - seed, y * 7.20, z * 1.70 + seed, 2);          // anisotropic: stacked beds
    const grain  = fbm3(x * 12.0 + seed, y * 12.0, z * 12.0, 2);                 // fine surface grain
    const fissure = Math.pow(clamp(1 - Math.abs(strata * 2.30), 0, 1), 3);       // crack band
    const d = 1 + shape * 0.34 + strata * 0.115 + grain * 0.030 - fissure * 0.26;
    x *= d; y *= d; z *= d;
    p.setXYZ(i, x, y, z);
    const ny = y / Math.max(0.001, Math.hypot(x, y, z));
    const lit = clamp(0.34 + 0.66 * smooth(clamp(shape * 1.5 + 0.5, 0, 1)), 0, 1)
              * clamp(0.44 + 0.56 * (ny * 0.5 + 0.5), 0, 1);
    c.copy(rockDark).lerp(rockBase, lit).lerp(rockLight, clamp(lit - 0.55, 0, 1) * 0.62);
    c.lerp(rockDark, fissure * 0.80);                                            // dark crevices
    if (ny < 0) c.multiplyScalar(lerp(1.0, 0.62, clamp(-ny, 0, 1)));             // shaded undersides
    const speck = clamp((grain - 0.30) * 3.0, 0, 1) * clamp(shape + 0.4, 0, 1);
    c.lerp(rockRust, speck * 0.22);                                              // reddish-brown speckle
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  g.computeVertexNormals();
  return g;
}

/** attach a flat vertex colour + a per-vertex sway phase to a sub-geometry */
function prep(g, col, phase){
  const n = g.attributes.position.count;
  const c = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++){ c[i * 3] = col.r; c[i * 3 + 1] = col.g; c[i * 3 + 2] = col.b; ph[i] = phase; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1));
  return g;
}
function instPhases(geo, count){
  const a = new Float32Array(count);
  for (let i = 0; i < count; i++) a[i] = Math.random() * TAU;
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(a, 1));
  return a;
}

{

    if (Math.hypot(x - 3.55, z + 0.55) < 1.15) return true;
    if (Math.hypot(x + 1.38, z - 0.48) < 0.78) return true;      // thick trunk base
    if (Math.hypot(x + 0.25, z - 1.55) < 0.42) return true;      // front root
    if (x > 3.30 && z < -0.90) return true;                      // red stem bed
    for (const b of BARE) if (Math.hypot(x - b.x, z - b.z) < b.r) return true;
    return false;
  };

  /* sample TUFT CENTRES, not a uniform grid — sparse and clumped in front */
  const tufts = [];
  for (let i = 0; i < 9000 && tufts.length < 1180; i++){
    const x = rnd(-HX + 0.14, HX - 0.14);
    const z = rnd(-HZ + 0.16, HZ - 0.12);

    const dens = 0.80 + 0.20 * smooth(clamp((zn - 0.02) / 0.52, 0, 1));
    if (Math.random() > dens) continue;
    if (z > HZ - 0.20 && Math.random() > 0.50) continue;         // bare strip at the front edge
    if (blocked(x, z)) continue;
    tufts.push({ x, z, zn, r: rnd(0.13, 0.30) });
  }

  let n = 0;
  for (const T of tufts){
    if (n >= QUALITY.grass) break;
    const per = Math.max(6, Math.round(lerp(11, 18, T.zn) * rnd(0.70, 1.35)));
    for (let k = 0; k < per && n < QUALITY.grass; k++){
      const a  = Math.random() * TAU;
      const rr = T.r * Math.sqrt(Math.random());                 // dense core, loose edge
      const x  = T.x + Math.cos(a) * rr;
      const z  = T.z + Math.sin(a) * rr * 0.85;
      if (Math.abs(x) > HX - 0.09 || Math.abs(z) > HZ - 0.08) continue;
      const zn = clamp((HZ - z) / TANK.d, 0, 1);
      const y  = subH(x, z) - 0.025;

      const hgt = (0.215 + 0.360 * smooth(clamp((zn - 0.03) / 0.80, 0, 1))) * rnd(0.82, 1.22);
      const out = (rr / T.r) * 0.30;                             // outer blades splay outward
      e.set(Math.cos(a) * out + rnd(-0.10, 0.10), Math.random() * TAU, Math.sin(a) * out + rnd(-0.10, 0.10));
      q.setFromEuler(e);
      pos.set(x, y, z);
      scl.set(rnd(0.82, 1.20), hgt, 1);
      m.compose(pos, q, scl);

}

/* ---- 9b. leaf + stem builders ------------------------------------ */
function leafGeo(w, l, curl, pointy){
  const g = new THREE.PlaneGeometry(w, l, 2, 4);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y = p.getY(i);
    const t = clamp((y + l / 2) / l, 0, 1);
    const shape = pointy ? Math.sin(Math.PI * Math.pow(t, 0.62)) * (1 - t * 0.35)
                         : Math.sin(Math.PI * Math.pow(t, 0.80));
    p.setX(i, x * shape);
    p.setY(i, clamp(y + l / 2, 0, l));
    p.setZ(i, p.getZ(i) + Math.sin(t * Math.PI) * curl);
  }
  g.computeVertexNormals();
  return g;
}

/** multi-stop colour ramp helper */
function gradAt(stops, u){
  u = clamp(u, 0, 1);
  const seg = (stops.length - 1);
  const f = u * seg, i = Math.min(Math.floor(f), seg - 1);
  return stops[i].clone().lerp(stops[i + 1], f - i);
}

/** leafy whorled stem plant (Rotala / Ludwigia style) */
function makeStemClump(o){
  const parts = [];
  for (let si = 0; si < o.stems; si++){
    const h = rnd(o.h[0], o.h[1]);
    const ox = rnd(-o.spread, o.spread), oz = rnd(-o.spread, o.spread);
    const tilt = rnd(-0.19, 0.19), tiltZ = rnd(-0.19, 0.19);
    const sph = Math.random() * TAU;
    const stem = new THREE.CylinderGeometry(o.rTop, o.rBot, h, 5, 6, true);
    stem.translate(0, h / 2, 0);
    stem.rotateX(tilt); stem.rotateZ(tiltZ); stem.translate(ox, 0, oz);
    parts.push(prep(stem, o.stemCol, sph));

    const whorls = Math.max(4, Math.round(h / o.gap));
    for (let w = 0; w < whorls; w++){
      const t = (w + 0.62) / whorls;
      const y = t * h;
      const per = rndi(o.perWhorl[0], o.perWhorl[1]);
      const yaw = Math.random() * TAU;                       // random yaw per whorl
      const grow = o.growA + o.growB * t;                    // leaves grow toward the tip
      for (let k = 0; k < per; k++){
        const ang = yaw + (k / per) * TAU + rnd(-0.22, 0.22);
        const lw = o.leaf[0] * grow * rnd(0.82, 1.18);
        const ll = o.leaf[1] * grow * rnd(0.82, 1.18);
        const lg = leafGeo(lw, ll, rnd(-0.03, 0.06), o.pointy);
        lg.rotateZ(rnd(o.leafTilt[0], o.leafTilt[1]));       // angled upward off the stem
        lg.rotateY(ang);
        lg.translate(0, y, 0);
        lg.rotateX(tilt); lg.rotateZ(tiltZ); lg.translate(ox, 0, oz);
        parts.push(prep(lg, gradAt(o.leafCol, t * rnd(0.78, 1.22)), sph));
      }
    }
  }
  const merged = mergeGeometries(parts, false);
  parts.forEach(g => g.dispose());
  return merged;
}

/** ribbon leaves (Vallisneria) */
function makeRibbonClump(o){
  const parts = [];
  for (let i = 0; i < o.blades; i++){
    const L = rnd(o.h[0], o.h[1]);
    const g = new THREE.PlaneGeometry(o.w, L, 1, 18);
    const p = g.attributes.position;
    const twist = rnd(-2.4, 2.4), bend = rnd(-0.55, 0.55), bendZ = rnd(-0.35, 0.35);
    for (let v = 0; v < p.count; v++){
      const x = p.getX(v), y = p.getY(v);
      const t = clamp((y + L / 2) / L, 0, 1);
      const a = t * twist;
      const wsc = 1 - t * 0.42;
      const xx = x * wsc * Math.cos(a);
      const zz = x * wsc * Math.sin(a);
      p.setXYZ(v, xx + bend * t * t, t * L, zz + bendZ * t * t);
    }
    g.computeVertexNormals();
    g.rotateY(Math.random() * TAU);
    g.translate(rnd(-o.spread, o.spread), 0, rnd(-o.spread, o.spread));
    parts.push(prep(g, o.col[0].clone().lerp(o.col[1], Math.random()), Math.random() * TAU));
  }
  const merged = mergeGeometries(parts, false);
  parts.forEach(g => g.dispose());
  return merged;
}

function addPlantMesh(geo, x, z, kind, mat, yOff){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, subH(x, z) + (yOff || -0.05), z);
  m.castShadow = true; m.receiveShadow = true;
  plants.add(m);
  pickable(m, kind);
  return m;
}

{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const pos = new THREE.Vector3(), scl = new THREE.Vector3(), col = new THREE.Color();
  const tan = new THREE.Vector3(), pt = new THREE.Vector3();
  const b1 = new THREE.Vector3(), b2 = new THREE.Vector3(), upv = new THREE.Vector3();
  const mossCol = (dst) => {
    const t = Math.random();
    return dst.setRGB(lerp(0.11, 0.24, t), lerp(0.30, 0.48, t), lerp(0.19, 0.29, t), THREE.SRGBColorSpace);
  };
  let n = 0;
  const weight = MOSS_ANCHORS.reduce((acc, x) => acc + x.n, 0);
  const perUnit = QUALITY.mossWood / weight;

  for (const A of MOSS_ANCHORS){
    const curve = woodCurves[A.c];
    if (!curve) continue;
    curve.getPointAt(clamp(A.t, 0, 1), pt);
    curve.getTangentAt(clamp(A.t, 0, 1), tan);
    upv.set(0, 1, 0);
    if (Math.abs(tan.y) > 0.92) upv.set(1, 0, 0);
    b1.crossVectors(tan, upv).normalize();
    b2.crossVectors(tan, b1).normalize();
    const cnt = Math.max(15, Math.min(40, Math.round(A.n * perUnit)));
    for (let i = 0; i < cnt && n < MOSS_TOTAL; i++){
      const along = ((Math.random() + Math.random() + Math.random()) / 3 * 2 - 1) * A.r * 1.7;
      const ang = Math.random() * TAU;
      const rr  = A.r * Math.sqrt(Math.random()) * 0.85;
      pos.copy(pt)
         .addScaledVector(tan, along)
         .addScaledVector(b1, Math.cos(ang) * rr)
         .addScaledVector(b2, Math.sin(ang) * rr);
      pos.y += A.r * 0.26 * (1 - rr / A.r) + rnd(-0.01, 0.03);   // heaped on the upper surface
      e.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
      q.setFromEuler(e);
      const sz = clamp(A.r * rnd(0.20, 0.48), 0.030, 0.135);      // varied, overlapping blobs
      scl.set(sz, sz * rnd(0.68, 1.0), sz * rnd(0.85, 1.1));
      m.compose(pos, q, scl);
      moss.setMatrixAt(n, m);
      moss.setColorAt(n, mossCol(col));
      n++;
    }
  }

  /* a few cushions on the UPPER rocks only */
  const HIGH_ROCKS = [3, 7, 1, 5];
  const perRock = Math.floor(QUALITY.mossRock / HIGH_ROCKS.length);
  for (const ri of HIGH_ROCKS){
    const top = rockTops[ri];
    if (!top) continue;
    const cx = top.x + rnd(-0.16, 0.16), cz = top.z + rnd(-0.14, 0.14);
    for (let i = 0; i < perRock && n < MOSS_TOTAL; i++){
      const ang = Math.random() * TAU, rr = Math.sqrt(Math.random()) * 0.30;
      pos.set(cx + Math.cos(ang) * rr, top.y + rnd(-0.09, 0.02) + (1 - rr / 0.30) * 0.05,
              cz + Math.sin(ang) * rr * 0.8);
      e.set(Math.random() * TAU, Math.random() * TAU, Math.random() * TAU);
      q.setFromEuler(e);
      const sz = rnd(0.038, 0.088);
      scl.set(sz, sz * 0.66, sz);
      m.compose(pos, q, scl);
      moss.setMatrixAt(n, m);
      moss.setColorAt(n, mossCol(col));
      n++;
    }
  }
  moss.count = n;
  moss.instanceMatrix.needsUpdate = true;
  if (moss.instanceColor) moss.instanceColor.needsUpdate = true;
  moss.computeBoundingSphere();
}

/* pop ripple rings at the water line */
const ringMat = new THREE.MeshBasicMaterial({

const RINGS = [];

  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  m.renderOrder = 5;
  bubbleGrp.add(m);
  RINGS.push({ mesh: m, t: 0 });
}
function popRing(x, z){
  for (const r of RINGS){
    if (r.mesh.visible) continue;
    r.mesh.position.set(x, WATER_Y - 0.012, z);
    r.mesh.visible = true; r.t = 0;
    return;
  }
}

const _bm = new THREE.Matrix4(), _bq = new THREE.Quaternion(), _bp = new THREE.Vector3(), _bs = new THREE.Vector3();
function updateBubbles(dt, t){
  bubTimer -= dt;
  if (bubTimer <= 0){ spawnBubble(false); if (Math.random() < 0.5) spawnBubble(false); bubTimer = rnd(0.035, 0.085); }
  strayTimer -= dt;
  if (strayTimer <= 0){ spawnBubble(true); strayTimer = rnd(1.6, 5.0); }

  let n = 0;
  for (const b of BUB){
    if (!b.live) continue;
    b.v += dt * 0.32;                                   // slight acceleration
    b.y += b.v * dt;
    const wx = Math.sin(t * 2.6 + b.ph) * b.wob;
    const wz = Math.cos(t * 2.1 + b.ph * 1.4) * b.wob;
    if (b.y > WATER_Y - 0.03){
      b.live = false;
      if (Math.random() < 0.22) popRing(b.x + wx, b.z + wz);
      continue;
    }
    _bp.set(b.x + wx, b.y, b.z + wz);
    _bs.setScalar(b.r);
    _bm.compose(_bp, _bq, _bs);
    if (n < QUALITY.bubbles) bubbles.setMatrixAt(n++, _bm);
  }
  // park unused instances far away (scale 0)
  _bs.setScalar(0); _bp.set(0, -50, 0); _bm.compose(_bp, _bq, _bs);
  for (let i = n; i < QUALITY.bubbles; i++) bubbles.setMatrixAt(i, _bm);
  bubbles.instanceMatrix.needsUpdate = true;

  for (const r of RINGS){
    if (!r.mesh.visible) continue;
    r.t += dt;
    const k = r.t / 0.85;
    if (k >= 1){ r.mesh.visible = false; continue; }
    const s = 0.10 + k * 0.34;
    r.mesh.scale.setScalar(s);
    r.mesh.material.opacity = (1 - k) * 0.45;
  }
}
bubbles.computeBoundingSphere();

/* =====================================================================
   11. FISH — procedural bodies + fins, shader undulation, steering
   ===================================================================== */
const fishGrp = new THREE.Group();
tank.add(fishGrp);

const invisibleMat = new THREE.MeshBasicMaterial({ visible: false });
const FISH = [];
const SCHOOL = [];

function setFishAttrs(g, ampArr, phArr, glowArr, colArr){
  g.setAttribute('aAmp',  new THREE.BufferAttribute(new Float32Array(ampArr), 1));
  g.setAttribute('aPhase',new THREE.BufferAttribute(new Float32Array(phArr), 1));
  g.setAttribute('aGlow', new THREE.BufferAttribute(new Float32Array(glowArr), 1));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colArr), 3));
  return g;
}

/* ---- body -------------------------------------------------------- */
function buildBody(cfg){
  const g = new THREE.SphereGeometry(1, 22, 14);
  const p = g.attributes.position;
  const amps = [], phs = [], glows = [], cols = [];
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i++){
    const x0 = p.getX(i), y0 = p.getY(i), z0 = p.getZ(i);
    const t = clamp((1 - z0) / 2, 0, 1);                       // 0 head .. 1 tail
    const ang = Math.atan2(y0, x0);
    const r = Math.pow(Math.sin(Math.PI * Math.pow(t, cfg.headBias)), cfg.plump) + 0.012;
    let X = Math.cos(ang) * r * cfg.w;
    let Y = Math.sin(ang) * r * cfg.h;
    if (Y < 0) Y *= cfg.belly;
    else       Y *= (1 + cfg.arch * Math.sin(Math.PI * Math.pow(t, 0.8)));
    const Z = (0.5 - t) * cfg.len;
    p.setXYZ(i, X, Y, Z);
    const yn = Math.sin(ang);
    cfg.color(t, yn, c);
    cols.push(c.r, c.g, c.b);
    glows.push(cfg.glow ? cfg.glow(t, yn) : 0);
    amps.push(1); phs.push(0);
  }
  g.computeVertexNormals();
  return setFishAttrs(g, amps, phs, glows, cols);
}

/* ---- fins -------------------------------------------------------- */
function shapeFin(shape, seg, attachZ, extraAmp, phaseLag, col, glow, xOff, yBase){
  const g = new THREE.ShapeGeometry(shape, seg);
  const p = g.attributes.position;
  let maxX = 1e-5;
  for (let i = 0; i < p.count; i++) maxX = Math.max(maxX, p.getX(i));
  const amps = [], phs = [], glows = [], cols = [];
  for (let i = 0; i < p.count; i++){
    const sx = p.getX(i), sy = p.getY(i);
    p.setXYZ(i, xOff || 0, sy + (yBase || 0), attachZ - sx);
    const k = clamp(sx / maxX, 0, 1);
    amps.push(1 + k * extraAmp);
    phs.push(phaseLag * k);
    glows.push(glow || 0);
    cols.push(col.r, col.g, col.b);
  }
  g.computeVertexNormals();
  return setFishAttrs(g, amps, phs, glows, cols);
}

function tailShape(L, H, fork){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(L * 0.34, H * 0.55, L, H);
  s.quadraticCurveTo(L * fork, 0, L, -H);
  s.quadraticCurveTo(L * 0.34, -H * 0.55, 0, 0);
  return s;
}
function veilShape(L, H){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(L * 0.30, H * 0.95, L * 0.80, H * 1.10, L * 1.00, H * 0.34);
  s.bezierCurveTo(L * 1.12, -H * 0.22, L * 0.82, -H * 1.05, L * 0.34, -H * 0.98);
  s.quadraticCurveTo(L * 0.10, -H * 0.52, 0, 0);
  return s;
}
function finFold(L, H, round, sign){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(L * 0.30, sign * H, L * 0.70, sign * H * round);
  s.quadraticCurveTo(L * 0.90, sign * H * 0.22, L, 0);
  s.lineTo(0, 0);
  return s;
}
function pectoralGeo(L, W, col){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.quadraticCurveTo(L * 0.55, W * 1.0, L, W * 0.18);
  s.quadraticCurveTo(L * 0.5, -W * 0.30, 0, 0);
  const g = new THREE.ShapeGeometry(s, 8);
  const p = g.attributes.position;
  const amps = [], phs = [], glows = [], cols = [];
  for (let i = 0; i < p.count; i++){
    const sx = p.getX(i), sy = p.getY(i);
    p.setXYZ(i, sy, 0, -sx);
    amps.push(0); phs.push(0); glows.push(0);
    cols.push(col.r, col.g, col.b);
  }
  g.computeVertexNormals();
  return setFishAttrs(g, amps, phs, glows, cols);
}

function makeFishMat(cfg, u, isFin){
  const m = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true,
    roughness: isFin ? 0.48 : cfg.rough, metalness: isFin ? 0.05 : cfg.metal,
    side: isFin ? THREE.DoubleSide : THREE.FrontSide,
    transparent: !!isFin, opacity: isFin ? cfg.finOpacity : 1,
    emissive: new THREE.Color(cfg.emissive), emissiveIntensity: 1,
  });
  m.userData.u = u;
  m.onBeforeCompile = fishOBC;
  TICK_U.push(u.uTime);
  return registerHL(m);
}

/* ---- steering base class ----------------------------------------- */
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _up = new THREE.Vector3(), _mm = new THREE.Matrix4(), _qq = new THREE.Quaternion();

class Fish {
  constructor(cfg){
    this.cfg = cfg;
    this.root = new THREE.Object3D();
    fishGrp.add(this.root);

    const ub = { uTime:{value:0}, uFreq:{value:cfg.freq}, uAmp:{value:cfg.len*cfg.amp},
                 uHalf:{value:cfg.len*0.5}, uLen:{value:cfg.len}, uPhase:{value:Math.random()*TAU}, uK:{value:cfg.k} };
    const uf = { uTime:{value:0}, uFreq:{value:cfg.finFreq}, uAmp:{value:cfg.len*cfg.finAmp},
                 uHalf:{value:cfg.len*0.5}, uLen:{value:cfg.len}, uPhase:{value:ub.uPhase.value}, uK:{value:cfg.finK} };
    this.ub = ub; this.uf = uf;
    this.bodyMat = makeFishMat(cfg, ub, false);
    this.finMat  = makeFishMat(cfg, uf, true);

    const body = new THREE.Mesh(buildBody(cfg), this.bodyMat);
    body.castShadow = cfg.shadow;
    this.root.add(body);

    for (const f of cfg.fins){
      const m = new THREE.Mesh(
        shapeFin(f.shape, f.seg || 10, f.z, f.extra, f.lag, f.col, f.glow || 0, f.x || 0, f.y || 0),
        this.finMat);
      this.root.add(m);
    }

    // pectorals on pivots (flap independently)
    if (cfg.pect){
      const pg = pectoralGeo(cfg.pect.l, cfg.pect.w, new THREE.Color(cfg.pect.col));
      this.pecL = new THREE.Object3D(); this.pecR = new THREE.Object3D();
      this.pecL.position.set( cfg.pect.at[0], cfg.pect.at[1], cfg.pect.at[2]);
      this.pecR.position.set(-cfg.pect.at[0], cfg.pect.at[1], cfg.pect.at[2]);
      const ml = new THREE.Mesh(pg, this.finMat);
      const mr = new THREE.Mesh(pg.clone().scale(-1, 1, 1), this.finMat);
      this.pecL.add(ml); this.pecR.add(mr);
      this.root.add(this.pecL, this.pecR);
    }

    // invisible pick proxy (small fish are hard to hit otherwise)
    const proxy = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), invisibleMat);
    proxy.scale.set(cfg.len * 0.55, cfg.len * 0.5, cfg.len * 0.72);
    this.root.add(proxy);
    proxy.userData.kind = cfg.kind;
    proxy.userData.hl = [this.bodyMat, this.finMat];
    PICKABLES.push(proxy);

    // motion state
    this.pos = new THREE.Vector3(rnd(-HX + 1.4, HX - 1.4), rnd(cfg.band[0], cfg.band[1]), rnd(-HZ + 1, HZ - 1));
    this.dir = new THREE.Vector3(rnd(-1, 1), rnd(-0.1, 0.1), rnd(-1, 1)).normalize();
    this.speed = cfg.speed; this.baseSpeed = cfg.speed; this.speedMul = 1;
    this.bank = 0; this.tt = 0; this.pauseT = 0;
    this.target = new THREE.Vector3();
    this.phase = Math.random() * TAU;
    this.newTarget();
    this.root.position.copy(this.pos);
  }

  newTarget(){
    const c = this.cfg;
    this.target.set(
      rnd(-HX + c.pad, HX - c.pad),
      rnd(c.band[0], c.band[1]),
      rnd(-HZ + c.pad, HZ - c.pad));
    const floor = subH(this.target.x, this.target.z) + c.clear;
    if (this.target.y < floor) this.target.y = floor;
    if (this.target.y > WATER_Y - 0.30) this.target.y = WATER_Y - 0.30;
    this.tt = rnd(2.4, 6.5);
    this.speedMul = rnd(0.65, 1.45);
    if (c.pauses && Math.random() < 0.30) this.pauseT = rnd(0.7, 2.2);
  }

  steerExtra(){ /* overridden by species */ }

  update(dt, t){
    const c = this.cfg;
    this.tt -= dt;
    if (this.tt <= 0 || this.pos.distanceTo(this.target) < 0.55) this.newTarget();

    const steer = _v2.copy(this.target).sub(this.pos).normalize();

    // walls
    const pad = c.pad;
    if (this.pos.x >  HX - pad) steer.x -= (this.pos.x - (HX - pad)) * 2.4;
    if (this.pos.x < -HX + pad) steer.x += ((-HX + pad) - this.pos.x) * 2.4;
    if (this.pos.z >  HZ - pad) steer.z -= (this.pos.z - (HZ - pad)) * 2.4;
    if (this.pos.z < -HZ + pad) steer.z += ((-HZ + pad) - this.pos.z) * 2.4;

    // substrate + water surface
    const floor = subH(this.pos.x, this.pos.z) + c.clear;
    if (this.pos.y < floor + 0.30) steer.y += (floor + 0.30 - this.pos.y) * 3.2;
    if (this.pos.y > WATER_Y - 0.32) steer.y -= (this.pos.y - (WATER_Y - 0.32)) * 3.2;

    // depth preference band
    const mid = (c.band[0] + c.band[1]) * 0.5;
    steer.y += (mid - this.pos.y) * c.bandK;

    // hardscape obstacles
    for (const ob of OBSTACLES){
      _v3.copy(this.pos).sub(ob.p);
      const d = _v3.length();
      const rr = ob.r + c.clear + 0.12;
      if (d < rr && d > 0.0001) steer.addScaledVector(_v3.divideScalar(d), (rr - d) * 2.6);
    }

    this.steerExtra(steer, dt, t);
    if (steer.lengthSq() < 1e-6) steer.copy(this.dir);
    steer.normalize();

    const prevX = this.dir.x, prevZ = this.dir.z;
    const k = 1 - Math.exp(-c.turn * dt);
    this.dir.lerp(steer, k).normalize();
    if (Math.abs(this.dir.y) > c.pitch){
      this.dir.y = Math.sign(this.dir.y) * c.pitch;
      this.dir.normalize();
    }

    // banking into the turn
    const cross = prevX * this.dir.z - prevZ * this.dir.x;
    this.bank += (clamp(cross * 30, -0.75, 0.75) - this.bank) * Math.min(1, dt * 6);

    // speed (pauses for the betta / cories)
    let want = this.baseSpeed * this.speedMul;
    if (this.pauseT > 0){ this.pauseT -= dt; want *= 0.10; }
    this.speed += (want - this.speed) * Math.min(1, dt * 1.6);
    this.pos.addScaledVector(this.dir, this.speed * dt);

    // hard containment — never leave the water
    this.pos.x = clamp(this.pos.x, -HX + 0.22, HX - 0.22);
    this.pos.z = clamp(this.pos.z, -HZ + 0.22, HZ - 0.22);
    this.pos.y = clamp(this.pos.y, subH(this.pos.x, this.pos.z) + c.clear, WATER_Y - 0.16);

    // orientation
    _up.set(0, 1, 0).applyAxisAngle(this.dir, this.bank);
    _v1.copy(this.pos).add(this.dir);
    _mm.lookAt(_v1, this.pos, _up);
    _qq.setFromRotationMatrix(_mm);
    this.root.quaternion.slerp(_qq, 1 - Math.exp(-9 * dt));
    this.root.position.copy(this.pos);

    // shader: tail beat scales with speed
    const sp = clamp(this.speed / this.baseSpeed, 0.1, 2.2);
    this.ub.uTime.value = t;
    this.ub.uFreq.value = c.freq * (0.55 + 0.85 * sp);
    this.uf.uTime.value = t;
    this.uf.uFreq.value = c.finFreq * (0.55 + 0.85 * sp);

    if (this.pecL){
      const f = Math.sin(t * c.pectFreq * (0.6 + 0.6 * sp) + this.phase) * 0.5;
      this.pecL.rotation.z =  0.30 + f;
      this.pecR.rotation.z = -0.30 - f;
    }
  }
}

const _tc = new THREE.Color();
const srgb = (c, r, g, b) => c.setRGB(r, g, b, THREE.SRGBColorSpace);
const C = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);

class Tetra extends Fish {
  steerExtra(steer, dt, t){
    let cx = 0, cy = 0, cz = 0, ax = 0, ay = 0, az = 0, n = 0;
    for (const o of SCHOOL){
      if (o === this) continue;
      const dx = o.pos.x - this.pos.x, dy = o.pos.y - this.pos.y, dz = o.pos.z - this.pos.z;
      const d2 = dx * dx + dy * dy + dz * dz;
      if (d2 > 5.5) continue;
      n++;
      cx += o.pos.x; cy += o.pos.y; cz += o.pos.z;
      ax += o.dir.x; ay += o.dir.y; az += o.dir.z;
      if (d2 < 0.13 && d2 > 1e-6){
        const d = Math.sqrt(d2);
        steer.x -= dx / d * 1.9; steer.y -= dy / d * 1.9; steer.z -= dz / d * 1.9;
      }
    }
    if (n > 0){
      steer.x += (cx / n - this.pos.x) * 0.60;
      steer.y += (cy / n - this.pos.y) * 0.60;
      steer.z += (cz / n - this.pos.z) * 0.60;
      steer.x += ax / n * 0.90; steer.y += ay / n * 0.90; steer.z += az / n * 0.90;
    }
    // wander
    steer.x += Math.sin(t * 0.9 + this.phase) * 0.22;
    steer.z += Math.cos(t * 0.7 + this.phase * 1.7) * 0.22;
  }
}

class Cory extends Fish {
  newTarget(){
    super.newTarget();
    this.target.y = subH(this.target.x, this.target.z) + rnd(0.10, 0.30);
    this.tt = rnd(1.4, 3.6);
    if (Math.random() < 0.42) this.pauseT = rnd(0.5, 1.9);
  }
  steerExtra(steer){
    const floor = subH(this.pos.x, this.pos.z) + 0.16;
    steer.y += (floor - this.pos.y) * 2.0;
  }
}

/* =====================================================================
   13. UI
   ===================================================================== */
const $ = id => document.getElementById(id);
const elPanel = $('panel'), elFold = $('fold');
const sBright = $('sBright'), sKelvin = $('sKelvin'), sTint = $('sTint');
const vBright = $('vBright'), vKelvin = $('vKelvin'), vTint = $('vTint');
const elQuote = $('quote'), qKind = $('qKind'), qText = $('qText'), qAuthor = $('qAuthor');

function tintLabel(v){ return v < 33 ? '푸른빛' : (v > 66 ? '초록빛' : '균형'); }
function syncLabels(){
  vBright.textContent = Math.round(LS.bright * 100) + '%';
  vKelvin.textContent = Math.round(LS.kelvin) + 'K';
  vTint.textContent   = tintLabel(LS.tint * 100);
}
function readSliders(){
  LS.bright = +sBright.value / 100;
  LS.kelvin = +sKelvin.value;
  LS.tint   = +sTint.value / 100;
  syncLabels();
  recomputeLightTargets();
}
[sBright, sKelvin, sTint].forEach(s => s.addEventListener('input', readSliders));

elFold.addEventListener('click', () => {
  elPanel.classList.toggle('folded');
  elFold.textContent = elPanel.classList.contains('folded') ? '+' : '−';
});
if (window.innerWidth > 0 && window.innerWidth < 620){ elPanel.classList.add('folded'); elFold.textContent = '+'; }

const presetBtns = Array.from(document.querySelectorAll('#presets button'));
presetBtns.forEach(b => b.addEventListener('click', () => {
  presetBtns.forEach(o => o.classList.toggle('on', o === b));
  const p = PRESETS[b.dataset.p];
  LS.preset = b.dataset.p;
  sBright.value = p.bright; sKelvin.value = p.kelvin; sTint.value = p.tint;
  readSliders();
}));

const tRays = $('tRays'), tShadow = $('tShadow');
tRays.addEventListener('click', () => { LS.showRays = !LS.showRays; tRays.classList.toggle('on', LS.showRays); });
tShadow.addEventListener('click', () => { LS.showShadow = !LS.showShadow; tShadow.classList.toggle('on', LS.showShadow); });

/* ---- quote card ---- */
let quoteTimer = null;
const lastIdx = {};
function showQuote(kind){
  const q = QUOTES[kind];
  if (!q) return;
  let i = Math.floor(Math.random() * q.list.length);
  if (q.list.length > 1 && i === lastIdx[kind]) i = (i + 1 + Math.floor(Math.random() * (q.list.length - 1))) % q.list.length;
  lastIdx[kind] = i;
  qKind.textContent   = q.label;
  qText.textContent   = '“' + q.list[i][0] + '”';
  qAuthor.textContent = '— ' + q.list[i][1];
  elQuote.classList.add('show');
  clearTimeout(quoteTimer);
  quoteTimer = setTimeout(hideQuote, 6000);
}
function hideQuote(){ elQuote.classList.remove('show'); clearTimeout(quoteTimer); }
elQuote.addEventListener('pointerdown', e => { e.stopPropagation(); hideQuote(); });

/* ---- first-load hint ---- */
const elHint = $('hint');
setTimeout(() => elHint.classList.add('show'), 900);
setTimeout(() => elHint.classList.remove('show'), 8500);

/* =====================================================================
   14. INTERACTION — raycast click + hover highlight
   ===================================================================== */
const raycaster = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const canvasEl = renderer.domElement;
let downX = 0, downY = 0, downT = 0, hoverKind = null, hoverMats = null, hoverAcc = 0, hoverDirty = true;

function toNDC(e){
  const r = canvasEl.getBoundingClientRect();
  ptr.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  ptr.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
function hit(){
  raycaster.setFromCamera(ptr, camera);
  const res = raycaster.intersectObjects(PICKABLES, false);
  return res.length ? res[0].object : null;
}

canvasEl.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY; downT = performance.now(); });
canvasEl.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 7) return;
  if (performance.now() - downT > 500) return;
  toNDC(e);
  const o = hit();
  if (o && o.userData.kind) showQuote(o.userData.kind);
  else hideQuote();
});
canvasEl.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  toNDC(e);
  hoverDirty = true;                   // request a hover test on the next frame
});

function updateHover(dt){
  hoverAcc -= dt;
  if (hoverDirty && hoverAcc <= 0){
    hoverDirty = false; hoverAcc = 0.09;
    const o = hit();
    const kind = o ? o.userData.kind : null;
    if (kind !== hoverKind || (o && o.userData.hl !== hoverMats)){
      hoverKind = kind;
      hoverMats = o ? o.userData.hl : null;
      canvasEl.style.cursor = kind ? 'pointer' : 'default';
    }
  }
  const es = LS.emScale;
  for (const m of HL_MATS){
    const want = (hoverMats && hoverMats.indexOf(m) !== -1) ? 1 : 0;
    let a = m.userData.hlA;
    if (a !== want){
      a += (want - a) * Math.min(1, dt * 8);
      if (Math.abs(a - want) < 0.004) a = want;
      m.userData.hlA = a;
    }
    m.emissiveIntensity = m.userData.baseEI * es + a * 1.7;
  }
}

/* =====================================================================
   15. RESIZE / MAIN LOOP
   ===================================================================== */
function onResize(){
  const w = window.innerWidth, h = window.innerHeight;
  if (w < 1 || h < 1) return;                     // hidden tab / zero-size layout
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (!userZoomed) frameTank();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

const clock = new THREE.Clock();
let elapsed = 0;

readSliders();
recomputeLightTargets();
Object.assign(LS, {
  hemi: LT.hemi, amb: LT.amb, fogD: LT.fogD, rays: LT.rays, rimI: LT.rimI, caustic: LT.caustic, exp: LT.exp,
});
LS.keyCol.copy(LT.keyCol); LS.ambCol.copy(LT.ambCol);
LS.fogCol.copy(LT.fogCol); LS.rayCol.copy(LT.rayCol); LS.keyPos.copy(LT.keyPos);

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  for (const u of TICK_U) u.value = elapsed;
  applyLighting(dt);

  for (const f of FISH) f.update(dt, elapsed);
  updateBubbles(dt, elapsed);

  // drifting light rays
  if (raysGroup.visible){
    for (const m of raysGroup.children){
      m.position.x = m.userData.baseX + Math.sin(elapsed * m.userData.spd + m.userData.ph) * 0.35;
      m.rotation.z = Math.sin(elapsed * m.userData.spd * 0.7 + m.userData.ph) * 0.06;
    }
  }

  updateHover(dt);
  controls.update();
  renderer.render(scene, camera);
}

window.__aqua = { scene, camera, renderer, FISH, controls };
/* kick off */
renderer.compile(scene, camera);
animate();
setTimeout(() => $('load').classList.add('gone'), 260);
setTimeout(() => { const l = $('load'); if (l && l.parentNode) l.parentNode.removeChild(l); }, 1200);

window.addEventListener('error', ev => {
  const box = $('err');
  box.style.display = 'block';
  box.textContent = '오류: ' + (ev.message || ev.error);
});
</script>
