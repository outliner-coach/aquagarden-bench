<!doctype html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102d29">
  <meta name="description" content="빛과 물결, 작은 생명들이 머무는 3D 수초 수족관. GPT-6 Astra로 만든 AquaGarden.">
  <title>AquaGarden — GPT-6 Astra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23102d29'/%3E%3Cpath d='M9 24Q7 9 24 7Q24 22 9 24M9 24L21 10' fill='none' stroke='%23d7eab1' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {color-scheme:dark;--ink:#edf3dc;--muted:#c0d0bd;--accent:#d7eab1;--glass:rgba(15,39,35,.88);--line:rgba(219,237,204,.2)}
    * {box-sizing:border-box} [hidden] {display:none!important}
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#102d29}
    body {font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
    button,input,select {font:inherit} button,select {color:inherit}
    button {cursor:pointer} button:focus-visible,select:focus-visible,canvas:focus-visible {outline:2px solid var(--accent);outline-offset:5px}
    button {border:0} canvas {display:block;width:100%;height:100%;touch-action:none;outline:none}
    #scene {position:absolute;inset:0}
    .header {position:absolute;top:clamp(22px,4.2vh,42px);left:clamp(22px,4vw,56px);right:clamp(22px,4vw,56px);display:flex;justify-content:space-between;align-items:start;pointer-events:none}
    .eyebrow {display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.25em;color:#dce8ce}
    .mark {width:14px;height:19px;border:1px solid #c1d7a1;border-radius:12px 1px 12px 1px;transform:rotate(24deg)}
    h1 {font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,3.9vw,49px);font-weight:400;letter-spacing:-.055em;margin:8px 0 6px}
    .subtitle {font-size:12px;letter-spacing:.065em;color:var(--muted);margin:0}
    .edition {font-size:10px;letter-spacing:.15em;line-height:1.8;text-align:right;color:#ccdbbd}
    .edition strong {font-weight:500;color:var(--ink)}
    .bottom {position:absolute;left:24px;right:24px;bottom:max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:13px;pointer-events:none}
    .instruction {font-size:11px;color:#d0dcc5;letter-spacing:.025em;margin:0;text-shadow:0 1px 6px #10231d;transition:opacity .3s}
    .dock {display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(22px);box-shadow:0 12px 35px #001a1a38;pointer-events:auto}
    .dock button {height:40px;padding:0 14px;border-radius:11px;background:transparent;display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;white-space:nowrap}
    .dock button:hover {background:#ffffff0e}.dock button[aria-expanded="true"] {background:var(--accent);color:#213e28}
    .dock svg {width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .divider {height:23px;width:1px;background:var(--line);margin:0 2px}
    .status {display:flex;align-items:center;gap:7px;padding:0 12px;font-size:10px;color:var(--muted);white-space:nowrap}
    .dot {width:5px;height:5px;border-radius:50%;background:#c7e8a2;box-shadow:0 0 8px #b7ed7950}
    .panel {width:318px;padding:21px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px);box-shadow:0 18px 60px #00191635;pointer-events:auto}
    .panel-head {display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;font-size:13px}
    .close {background:transparent;color:var(--muted);font-size:22px;line-height:1;padding:4px 7px;border-radius:6px}
    .presets {display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:20px}
    .presets button {border:1px solid var(--line);border-radius:11px;background:#ffffff05;font-size:11px;padding:12px 4px}
    .presets button[aria-pressed="true"] {border-color:#c8dda2;background:#d7eab112;color:#dfedc6}
    .preset-orb {display:block;width:19px;height:19px;border-radius:50%;margin:0 auto 7px;background:linear-gradient(145deg,#f9ffd9,#aedcc1)}
    .sunset {background:linear-gradient(145deg,#ffe9ac,#d78373)} .moon {background:linear-gradient(145deg,#d2e7fa,#5a86b4)}
    label.range-label {display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:16px 0 7px}
    output {font-variant-numeric:tabular-nums;color:var(--ink)}
    input[type="range"] {display:block;width:100%;height:24px;margin:0;accent-color:var(--accent);cursor:pointer}
    .small-note {font-size:10px;color:#aabeb1;line-height:1.6;margin:15px 0 0}
    #quote {position:absolute;right:clamp(18px,4vw,56px);top:27%;width:290px;padding:24px;z-index:2}
    .quote-top {display:flex;align-items:center;justify-content:space-between}
    #quote-kind {font-size:10px;letter-spacing:.08em;color:var(--accent)}
    #quote-text {font-family:Georgia,"Apple SD Gothic Neo",serif;font-size:20px;line-height:1.7;letter-spacing:-.025em;margin:17px 0}
    .quote-by {font-size:10px;color:#b4c5b7;letter-spacing:.03em}
    .explore {position:absolute;left:clamp(22px,4vw,56px);bottom:35px;display:flex;align-items:center;gap:7px;font-size:10px;color:#c6d6c2}
    .explore select {max-width:112px;background:#102c29aa;border:1px solid var(--line);padding:8px;border-radius:8px;font-size:11px}
    #loading {position:absolute;inset:0;display:grid;place-items:center;background:#102d29;z-index:5;text-align:center}
    .loader-leaf {width:24px;height:40px;margin:0 auto 22px;border:1px solid #c9deb0;border-radius:30px 2px 30px 2px;animation:breathe 2s ease-in-out infinite}
    #loading p {font-size:12px;color:var(--muted);line-height:1.9;margin:10px 25px}
    #retry {background:var(--accent);color:#20382a;padding:10px 18px;border-radius:9px;margin-top:10px}
    @keyframes breathe {50%{opacity:.3;transform:translateY(-5px) rotate(8deg)}}
    @media(prefers-reduced-motion:reduce) {.loader-leaf{animation:none}}
    @media(max-width:720px) {.explore{bottom:152px;left:20px}.status{display:none}.edition{font-size:8px}.dock{gap:3px}.dock button{padding:0 12px}.bottom{left:12px;right:12px;bottom:max(18px,env(safe-area-inset-bottom))}.instruction{font-size:10px}#quote{top:22%;right:16px;width:260px}h1{margin-top:9px}.header{top:25px}.panel{width:min(318px,calc(100vw - 32px))}}
    @media(max-height:550px) {.header{top:18px}h1{font-size:28px}.subtitle,.edition,.instruction,.explore{display:none}.bottom{bottom:12px;gap:6px}.panel{padding:13px}.panel-head{margin-bottom:9px}.presets{margin-bottom:9px}.presets button{padding:6px}.preset-orb{display:none}.range-label{margin:9px 0 1px!important}.small-note{display:none}#quote{top:18px;padding:17px}#quote-text{font-size:17px;margin:10px 0}}
  </style>
</head>
<body>
  <main id="scene" aria-label="살아 움직이는 3D 수초 수족관"></main>
  <header class="header">
    <div><div class="eyebrow"><span class="mark" aria-hidden="true"></span>A LIVING STILLNESS</div><h1>AquaGarden</h1><p class="subtitle">작은 세계에 머무는, 느린 시간.</p></div>
    <div class="edition">AQUASCAPE No. 10<br><strong>GPT–6 ASTRA</strong></div>
  </header>
  <aside id="quote" class="panel" role="status" aria-live="polite" hidden>
    <div class="quote-top"><span id="quote-kind"></span><button class="close" id="close-quote" aria-label="문장 닫기">×</button></div>
    <p id="quote-text"></p><span class="quote-by">AquaGarden · 창작 문장</span>
  </aside>
  <div class="explore"><label for="object-picker">수조의 문장</label><select id="object-picker"><option value="">대상 선택</option><option value="betta">베타</option><option value="neon">네온테트라</option><option value="ember">엠버테트라</option><option value="honey">허니구라미</option><option value="cory">코리도라스</option><option value="wood">유목</option><option value="rock">바위</option><option value="green">녹색 수초</option><option value="red">붉은 수초</option></select></div>
  <div class="bottom">
    <section id="light-panel" class="panel" aria-label="조명 설정" hidden>
      <div class="panel-head"><span>물속에 빛을 더하다</span><button id="close-light" class="close" aria-label="조명 설정 닫기">×</button></div>
      <div class="presets" role="group" aria-label="조명 프리셋">
        <button data-preset="day" aria-pressed="true"><span class="preset-orb"></span>오후의 정원</button>
        <button data-preset="sunset" aria-pressed="false"><span class="preset-orb sunset"></span>노을의 물결</button>
        <button data-preset="moon" aria-pressed="false"><span class="preset-orb moon"></span>푸른 달빛</button>
      </div>
      <label class="range-label" for="brightness">밝기 <output id="brightness-value">85%</output></label><input id="brightness" type="range" min="10" max="120" value="85">
      <label class="range-label" for="warmth">색온도 <output id="warmth-value">5,600 K</output></label><input id="warmth" type="range" min="2700" max="9000" step="100" value="5600">
      <p class="small-note">빛이 바뀌면, 같은 풍경도 새로운 표정을 보여요.</p>
    </section>
    <p class="instruction" id="instruction">드래그해 둘러보기 · 스크롤로 가까이 · 물고기와 수초를 눌러보세요</p>
    <nav class="dock" aria-label="수족관 조작">
      <button id="light-toggle" aria-expanded="false" aria-controls="light-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>조명</button>
      <span class="divider"></span>
      <button id="pause" aria-label="유영 일시정지" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M8 5v14M16 5v14"/></svg><span id="pause-label">잠시 멈춤</span></button>
      <button id="reset" aria-label="시점 초기화" title="처음 시점으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
      <button id="fullscreen" aria-label="전체 화면" title="전체 화면 (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      <span class="divider desktop"></span><span class="status"><span class="dot"></span>5종 · 24마리</span>
    </nav>
  </div>
  <div id="loading"><div><div class="loader-leaf" aria-hidden="true"></div><p id="loading-message" role="status">작은 생명들의 정원을 준비하고 있어요.</p><button id="retry" hidden>다시 열기</button></div></div>
  <script type="module">
    const $ = id => document.getElementById(id);
    $('retry').onclick = () => location.reload();
    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
      startAquarium(THREE);
    } catch (error) {
      console.error('AquaGarden initialization failed:', error);
      $('loading').hidden = false;
      $('loading-message').textContent = '수족관을 열지 못했어요. 인터넷 연결과 브라우저의 3D 가속 설정을 확인해 주세요.';
      $('retry').hidden = false;
    }

    function startAquarium(T) {
      let seed = 6102026;
      const rand = () => {seed = (Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
      const range = (a,b) => a+(b-a)*rand();
      const clamp = T.MathUtils.clamp, TAU = Math.PI*2;
      const v3 = (x=0,y=0,z=0) => new T.Vector3(x,y,z);
      const time = {value:0}, lightStrength = {value:1};
      const scene = new T.Scene();
      scene.background = new T.Color('#173c37');
      scene.fog = new T.FogExp2('#173c37',.027);
      const camera = new T.PerspectiveCamera(38,innerWidth/innerHeight,.1,90);
      const renderer = new T.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));
      renderer.setSize(innerWidth,innerHeight);
      renderer.outputColorSpace = T.SRGBColorSpace;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      const canvas = renderer.domElement;
      canvas.tabIndex = 0;
      canvas.setAttribute('aria-label','3D 수족관. 드래그로 회전, 방향키로 시점 이동, 더하기와 빼기로 확대·축소. 수조의 문장 메뉴로 오브젝트를 선택할 수 있습니다.');
      $('scene').appendChild(canvas);
      canvas.addEventListener('webglcontextlost',event => {
        event.preventDefault(); $('loading').hidden=false;
        $('loading-message').textContent='3D 화면 연결이 중단되었어요. 다시 열면 수족관이 돌아옵니다.'; $('retry').hidden=false;
      });

      const hemi = new T.HemisphereLight('#deecd5','#49351d',2.1); scene.add(hemi);
      const sun = new T.DirectionalLight('#fff1cc',3.3); sun.position.set(-3,9,5); scene.add(sun);
      sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
      Object.assign(sun.shadow.camera,{left:-8,right:8,top:7,bottom:-7,near:.5,far:23});
      sun.shadow.bias=-.0007; sun.shadow.normalBias=.045;
      const fill = new T.DirectionalLight('#b9e3dd',1.25); fill.position.set(3,4,-5);scene.add(fill);
      const warmFill = new T.PointLight('#eebc8d',17,16,2);warmFill.position.set(5,5,0);scene.add(warmFill);

      // A real 3D aquascape: all visible scenery is generated geometry, never the reference photograph.
      const pickables=[], rocks=[], fish=[], animatedFins=[];
      const register=(obj,key)=>{obj.userData.kind=key;pickables.push(obj);return obj;};
      const groundY=(x,z)=>.23+.085*Math.sin(x*1.5+z)+.08*Math.cos(z*2-x*.6)+.34*Math.exp(-((x+3.1)**2+(z+.6)**2)/3.7)+.17*Math.exp(-((x-2.9)**2+(z+.8)**2)/3);
      const noiseGLSL = `
        float hash3(vec3 p){p=fract(p*.3183099+vec3(.1,.2,.3));p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
        float noise3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
          return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
          mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
      `;
      function earthMaterial(color,kind) {
        const mat = new T.MeshStandardMaterial({color,roughness:.94});
        mat.onBeforeCompile=shader=>{
          shader.uniforms.uTime=time;shader.uniforms.uLight=lightStrength;
          shader.vertexShader='varying vec3 vEarth;\n'+shader.vertexShader;
          shader.vertexShader=shader.vertexShader.replace('#include <worldpos_vertex>',`#include <worldpos_vertex>
            vec4 ep=vec4(transformed,1.0);
            #ifdef USE_INSTANCING
              ep=instanceMatrix*ep;
            #endif
            vEarth=(modelMatrix*ep).xyz;`);
          shader.fragmentShader='varying vec3 vEarth;uniform float uTime;uniform float uLight;\n'+noiseGLSL+shader.fragmentShader;
          const pattern = kind==='wood'
            ? 'float grain=noise3(vEarth*vec3(2.,17.,17.))*.5+noise3(vEarth*vec3(6.,49.,49.))*.25; diffuseColor.rgb*=.48+grain*1.15;'
            : kind==='soil'
            ? 'float grain=noise3(vEarth*35.);diffuseColor.rgb*=.55+grain*.9;'
            : 'float grain=noise3(vEarth*3.7)*.52+noise3(vEarth*15.)*.32+noise3(vEarth*48.)*.16; float strata=sin(vEarth.y*36.+noise3(vEarth*5.)*5.);diffuseColor.rgb*=.55+grain*.85;diffuseColor.rgb*=.88+.12*strata;diffuseColor.rgb=mix(diffuseColor.rgb,diffuseColor.rgb*vec3(.46,.66,.24),smoothstep(.56,.8,noise3(vEarth*4.))* .68);';
          shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n'+pattern);
          shader.fragmentShader=shader.fragmentShader.replace('#include <dithering_fragment>',`#include <dithering_fragment>
            vec2 cp=vEarth.xz*3.1;cp+=vec2(sin(cp.y*.8+uTime*.33),cos(cp.x*.7-uTime*.28))*.42;
            float net=abs(sin(cp.x+uTime*.24)+sin(cp.y-uTime*.19));
            float caustic=pow(max(0.,1.-net),18.)*.10*uLight;
            gl_FragColor.rgb+=vec3(.65,.85,.58)*caustic;`);
        };
        mat.customProgramCacheKey=()=>`earth-${kind}`;
        return mat;
      }
      const soilMat=earthMaterial('#4a3927','soil'), rockMat=earthMaterial('#8c8d75','rock'), woodMat=earthMaterial('#806040','wood');
      const soilGeo=new T.PlaneGeometry(11.6,5.1,100,48);soilGeo.rotateX(-Math.PI/2);
      const soilPos=soilGeo.attributes.position;
      for(let i=0;i<soilPos.count;i++) soilPos.setY(i,groundY(soilPos.getX(i),soilPos.getZ(i)));
      soilGeo.computeVertexNormals();
      const soil=new T.Mesh(soilGeo,soilMat);soil.receiveShadow=true;scene.add(soil);
      const base=new T.Mesh(new T.BoxGeometry(11.64,.5,5.14),new T.MeshStandardMaterial({color:'#1c221b',roughness:.85}));base.position.y=-.03;scene.add(base);
      const underbase=new T.Mesh(new T.BoxGeometry(11.85,.12,5.35),new T.MeshStandardMaterial({color:'#102825',metalness:.55,roughness:.4}));underbase.position.y=-.32;scene.add(underbase);
      const sandMat=earthMaterial('#a18a57','soil');
      const sandGeo=new T.PlaneGeometry(3.25,2.6,26,20);sandGeo.rotateX(-Math.PI/2);
      const sandPos=sandGeo.attributes.position;
      for(let i=0;i<sandPos.count;i++) {const x=sandPos.getX(i)-3.9,z=sandPos.getZ(i)+1.2;sandPos.setXYZ(i,x,groundY(x,z)+.014,z);}
      sandGeo.computeVertexNormals();const sand=new T.Mesh(sandGeo,sandMat);sand.receiveShadow=true;scene.add(sand);

      const dummy=new T.Object3D(), color=new T.Color();
      const pebbles=new T.InstancedMesh(new T.IcosahedronGeometry(1,0),new T.MeshStandardMaterial({roughness:1}),2300);
      for(let i=0;i<pebbles.count;i++) {
        const x=range(-5.73,5.73),z=range(-2.49,2.49),s=range(.017,.052);
        dummy.position.set(x,groundY(x,z)+.013,z);dummy.scale.set(s,s*.72,s*.8);dummy.rotation.set(rand()*3,rand()*3,rand()*3);dummy.updateMatrix();pebbles.setMatrixAt(i,dummy.matrix);
        color.setHSL(.095+rand()*.04,.19+rand()*.15,.07+rand()*.1);pebbles.setColorAt(i,color);
      }
      scene.add(pebbles);

      function rock(x,y,z,sx,sy,sz,angle=0) {
        const geo=new T.IcosahedronGeometry(1,3),p=geo.attributes.position;
        for(let i=0;i<p.count;i++) {
          const a=p.getX(i),b=p.getY(i),c=p.getZ(i);
          const n=1+.1*Math.sin(a*12+b*6)*Math.sin(c*11-b*8)+.055*Math.sin(a*29+c*18);
          p.setXYZ(i,a*n,b*n,c*n);
        }
        geo.computeVertexNormals();const mesh=new T.Mesh(geo,rockMat);
        mesh.position.set(x,y,z);mesh.scale.set(sx,sy,sz);mesh.rotation.set(.1,angle,-.08);mesh.castShadow=true;mesh.receiveShadow=true;
        scene.add(mesh);register(mesh,'rock');rocks.push({mesh,x,y,z,sx,sy,sz});return mesh;
      }
      // Pale, layered central ridge with a lower right shelf, as in the shared image.
      rock(-.75,.91,-.12,1.02,.97,.85,.25);
      rock(-.15,.72,.55,.76,.7,.62,-.5);
      rock(.95,.68,.3,1.23,.47,.76,.2);
      rock(1.75,1.08,-.12,1.2,.57,.82,-.25);
      rock(2.25,1.47,-.45,1.2,.46,.79,.16);
      rock(3.08,.63,.45,1.11,.39,.68,-.4);
      rock(3.7,.88,-.4,.7,.6,.72,.6);
      rock(-3.75,.59,.7,1.15,.49,.72,.35);
      rock(-2.65,.73,-.55,.8,.72,.71,-.2);
      for(let i=0;i<19;i++){const x=range(-4.9,4.9),z=range(.5,2.1),s=range(.09,.29);rock(x,groundY(x,z)+s*.34,z,s,s*.7,s*.78,rand()*4);}

      function branch(points,radius) {
        const curve=new T.CatmullRomCurve3(points.map(p=>v3(...p)));
        const geo=new T.TubeGeometry(curve,Math.max(12,points.length*7),radius,9,false);
        const p=geo.attributes.position;

      const target=v3(0,2.48,0);

      function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();const f=Math.tan(camera.fov*Math.PI/360);baseDistance=Math.max(12.7/(2*f*camera.aspect),7.6/(2*f));scene.fog.density=.027*Math.min(1,12/baseDistance);cameraUpdate();$('instruction').textContent=w<=720?'손가락으로 둘러보기 · 물고기와 수초를 눌러보세요':'드래그해 둘러보기 · 스크롤로 가까이 · 물고기와 수초를 눌러보세요';}
      function resetView(){yaw=0;pitch=.09;zoom=1;cameraUpdate();}
      $('reset').onclick=resetView;window.addEventListener('resize',resize);resize();
      const raycaster=new T.Raycaster(),pointer=new T.Vector2();
      function getHit(x,y) {
        const rect=canvas.getBoundingClientRect();pointer.set((x-rect.left)/rect.width*2-1,-(y-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);
        const intersections=raycaster.intersectObjects(pickables,true);if(!intersections.length)return null;
        let object=intersections[0].object;while(object&&!object.userData.kind)object=object.parent;return object?.userData.kind;
      }
      canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;down={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,id:e.pointerId};dragging=false;canvas.setPointerCapture(e.pointerId);});
      canvas.addEventListener('pointermove',e=>{
        if(!down||down.id!==e.pointerId)return;
        if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragging=true;
        if(dragging){yaw=clamp(yaw-(e.clientX-down.lastX)*.005,-.65,.65);pitch=clamp(pitch+(e.clientY-down.lastY)*.004,-.04,.48);cameraUpdate();}
        down.lastX=e.clientX;down.lastY=e.clientY;
      });
      canvas.addEventListener('pointerup',e=>{if(!down||down.id!==e.pointerId)return;if(!dragging){const hit=getHit(e.clientX,e.clientY);if(hit)showQuote(hit);else closeQuote();}down=null;dragging=false;});
      canvas.addEventListener('pointercancel',()=>{down=null;dragging=false;});
      canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom+e.deltaY*.00065,.64,1.3);cameraUpdate();},{passive:false});
      canvas.addEventListener('keydown',e=>{
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','0'].includes(e.key)){
          e.preventDefault();if(e.key==='ArrowLeft')yaw-=.08;if(e.key==='ArrowRight')yaw+=.08;if(e.key==='ArrowUp')pitch+=.04;if(e.key==='ArrowDown')pitch-=.04;
          if(e.key==='+'||e.key==='=')zoom-=.08;if(e.key==='-')zoom+=.08;if(e.key==='0')resetView();yaw=clamp(yaw,-.65,.65);pitch=clamp(pitch,-.04,.48);zoom=clamp(zoom,.64,1.3);cameraUpdate();
        }
      });
      async function fullscreen() {try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('instruction').textContent='이 브라우저에서는 새 탭으로 열어 큰 화면으로 감상할 수 있어요.';}}
      $('fullscreen').onclick=fullscreen;
      document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'전체 화면 종료':'전체 화면');resize();});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeQuote();toggleLights(false);}if(e.key.toLowerCase()==='f'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))fullscreen();});

      const desired=v3(),separation=v3(),alignment=v3(),center=v3(),diff=v3(),steering=v3();
      function update(dt) {
        time.value+=dt;const t=time.value;
        for(const f of fish) {
          const s=specs[f.kind],pos=f.group.position;
          if(t>f.goalAt){f.goal.set(range(-4.9,4.9),s.y+range(-.5,.5),range(.3,1.95));if(f.kind==='betta')f.goal.x=range(-1,4.4);f.goalAt=t+range(5,12);}
          desired.copy(f.goal).sub(pos).normalize().multiplyScalar(s.speed);
          if(f.kind==='neon'||f.kind==='ember') {
            separation.set(0,0,0);alignment.set(0,0,0);center.set(0,0,0);let neighbors=0;
            for(const other of fish) {if(other===f||other.kind!==f.kind)continue;const dist=pos.distanceTo(other.group.position);if(dist<2.3){center.add(other.group.position);alignment.add(other.velocity);neighbors++;if(dist<.55&&dist>.001)separation.add(diff.copy(pos).sub(other.group.position).divideScalar(dist*dist));}}
            if(neighbors){center.divideScalar(neighbors).sub(pos).multiplyScalar(.12);alignment.divideScalar(neighbors).sub(f.velocity).multiplyScalar(.25);desired.add(center).add(alignment).addScaledVector(separation,.14);}
          }
          if(pos.x>4.95)desired.x=-Math.abs(desired.x)-.2;if(pos.x< -4.95)desired.x=Math.abs(desired.x)+.2;
          if(pos.z>2.05)desired.z=-.35;if(pos.z<-.25)desired.z=.35;
          if(f.kind==='cory') {const floor=groundY(pos.x,pos.z)+.3;desired.y+=(floor-pos.y)*1.7;}
          // Avoid the rock volumes in the foreground, including when the camera moves.
          for(const r of rocks.slice(0,9)) {
            diff.set((pos.x-r.x)/(r.sx+.25),(pos.y-r.y)/(r.sy+.24),(pos.z-r.z)/(r.sz+.26));
            if(diff.lengthSq()<1.4){diff.normalize();desired.addScaledVector(diff,.55);}
          }
          if(pos.y<.55)desired.y+=.4;if(pos.y>4.85)desired.y-=.4;
          desired.clampLength(0,s.speed*1.45);f.velocity.lerp(desired,1-Math.exp(-dt*.85));pos.addScaledVector(f.velocity,dt);
          pos.x=clamp(pos.x,-5.2,5.2);pos.z=clamp(pos.z,-.45,2.15);pos.y=clamp(pos.y,.46,5);
          if(f.velocity.lengthSq()>.001) {
            const heading=Math.atan2(-f.velocity.z,f.velocity.x),dy=T.MathUtils.euclideanModulo(heading-f.group.rotation.y+Math.PI,TAU)-Math.PI;
            f.group.rotation.y+=dy*(1-Math.exp(-dt*2.4));f.group.rotation.z=clamp(Math.atan2(f.velocity.y,Math.hypot(f.velocity.x,f.velocity.z)),-.22,.22);
          }
          f.tailPivot.rotation.y=Math.sin(t*(f.kind==='betta'?5:11)+f.phase)*(f.kind==='betta'?.24:.32);
          f.group.rotation.x=Math.sin(t*1.5+f.phase)*.035;
        }
        for(const fin of animatedFins) {
          const attr=fin.mesh.geometry.attributes.position;
          for(let i=1;i<attr.count;i++){const x=fin.rest[i*3],y=fin.rest[i*3+1];attr.setZ(i,fin.rest[i*3+2]+Math.sin(t*6+x*13+y*9+fin.phase)*Math.hypot(x,y)*fin.ripple);}
          attr.needsUpdate=true;
          const ribs=fin.lines.geometry.attributes.position;
          for(let i=1;i<ribs.count;i+=2){const x=fin.ribRest[i*3],y=fin.ribRest[i*3+1];ribs.setZ(i,fin.ribRest[i*3+2]+Math.sin(t*6+x*13+y*9+fin.phase)*Math.hypot(x,y)*fin.ripple);}ribs.needsUpdate=true;
        }
        bubbleData.forEach((b,i)=>{const y=(b.offset+t*b.speed)%5.2;dummy.position.set(b.x+Math.sin(y*2+t+b.phase)*.075,y+.3,b.z+Math.cos(y*1.3+b.phase)*.08);dummy.rotation.set(0,0,0);const r=b.r*(1+y*.08);dummy.scale.set(r,r*1.06,r);dummy.updateMatrix();bubbles.setMatrixAt(i,dummy.matrix);});bubbles.instanceMatrix.needsUpdate=true;
        const dustAttr=dustGeo.attributes.position;
        dustRest.forEach((p,i)=>{dustAttr.setXYZ(i,p[0]+Math.sin(t*.2+i)*.06,p[1]+Math.sin(t*.17+i)*.06,p[2]);});dustAttr.needsUpdate=true;
      }
      let last=performance.now(),frameCount=0;
      function animate(now) {requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;if(document.hidden)return;if(!paused)update(dt);renderer.render(scene,camera);frameCount++;}
      update(0);renderer.render(scene,camera);$('loading').hidden=true;requestAnimationFrame(animate);
      document.addEventListener('visibilitychange',()=>{last=performance.now();});
      // Read-only diagnostics for reproducible browser checks. Coordinates are world x/right, y/up, z/toward viewer.
      window.aquarium={
        inspect:()=>({ready:true,model:'gpt-6-astra',time:Number(time.value.toFixed(3)),paused,preset:activePreset,brightness,kelvin,selected,fishCount:fish.length,species:Object.fromEntries(Object.entries(specs).map(([k,s])=>[k,s.count])),fish:fish.map(f=>({kind:f.kind,position:f.group.position.toArray().map(n=>+n.toFixed(3)),tail:+f.tailPivot.rotation.y.toFixed(3)})),plants:leaves.length+redLeaves.length+mossLeaves.length,bubbles:bubbleCount,frameCount,camera:{yaw,pitch,zoom},drawCalls:renderer.info.render.calls,triangles:renderer.info.render.triangles,programs:renderer.info.programs.map(p=>({runnable:p.diagnostics?.runnable??true}))}),
        projectObjects:()=>pickables.filter(o=>!o.isInstancedMesh).map(o=>{const p=(o.userData.anchor?o.userData.anchor.clone().applyMatrix4(o.matrixWorld):o.getWorldPosition(v3())).project(camera);return{kind:o.userData.kind,x:Math.round((p.x+1)*innerWidth/2),y:Math.round((-p.y+1)*innerHeight/2),visible:Math.abs(p.x)<1&&Math.abs(p.y)<1&&p.z<1};})
      };
    }
  </script>
