<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>수초 수족관 — 3D 디지털 아쿠아스케이프</title>
<style>
  :root{--bg:#070d10;--glass:rgba(10,24,28,.62);--line:rgba(160,220,225,.22);--tx:#e6f4f2;--dim:#9dbcbc;--ac:#7fe0c8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #title{position:fixed;left:20px;top:16px;pointer-events:none;text-shadow:0 1px 8px #000a}
  #title h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
  #title p{margin:4px 0 0;font-size:12.5px;color:var(--dim)}
  #panel{position:fixed;right:16px;top:16px;width:250px;background:var(--glass);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);padding:12px 14px 14px}
  #panel h2{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--ac)}
  #panel.min .body{display:none}
  .row{margin:9px 0}
  .row label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:3px}
  .row output{color:var(--tx);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--ac);height:18px;margin:0}
  .presets{display:flex;gap:6px;margin-top:10px}
  button{flex:1;font:inherit;font-size:12px;color:var(--tx);background:rgba(127,224,200,.12);border:1px solid var(--line);border-radius:8px;padding:6px 4px;cursor:pointer}
  button:hover{background:rgba(127,224,200,.28)}
  #legend{margin-top:10px;font-size:11.5px;color:var(--dim);line-height:1.55;border-top:1px solid var(--line);padding-top:8px}
  #quote{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);width:min(680px,calc(100vw - 32px));background:rgba(6,18,22,.8);border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:12px;backdrop-filter:blur(12px);padding:14px 20px 14px;opacity:0;pointer-events:none;transition:opacity .45s,transform .45s}
  #quote.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  #quote .tag{font-size:11.5px;color:var(--ac);letter-spacing:.05em;margin-bottom:6px}
  #quote .q{font-size:17px;line-height:1.6;font-weight:500}
  #quote .a{margin-top:8px;font-size:13px;color:var(--dim);text-align:right}
  #hint{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);font-size:12px;color:var(--dim);pointer-events:none;transition:opacity .6s;text-shadow:0 1px 6px #000}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:15px;color:#ffb4a8}
  @media(max-width:640px){#panel{width:200px;right:8px;top:8px}#title{display:none}#quote .q{font-size:15px}}
</style>
</head>
<body>
<div id="title"><h1>수초 수족관</h1><p>유목 · 바위 · 수초가 어우러진 3D 아쿠아스케이프</p></div>
<div id="panel">
  <h2 id="ptoggle"><span>조명 · 환경 조절</span><span id="pmark">−</span></h2>
  <div class="body">
    <div class="row"><label>조명 밝기 <output id="o_b"></output></label><input id="s_b" type="range" min="0" max="2.5" step="0.01" value="1.1"></div>
    <div class="row"><label>주변광 <output id="o_a"></output></label><input id="s_a" type="range" min="0" max="1.5" step="0.01" value="0.8"></div>
    <div class="row"><label>색온도 (차갑게 ↔ 따뜻하게) <output id="o_w"></output></label><input id="s_w" type="range" min="-1" max="1" step="0.01" value="0.2"></div>
    <div class="row"><label>조명 각도 <output id="o_x"></output></label><input id="s_x" type="range" min="-45" max="45" step="1" value="-10"></div>
    <div class="row"><label>물그림자(코스틱) <output id="o_c"></output></label><input id="s_c" type="range" min="0" max="2" step="0.01" value="1"></div>
    <div class="row"><label>물 탁도(안개) <output id="o_f"></output></label><input id="s_f" type="range" min="0" max="2.5" step="0.01" value="1"></div>
    <div class="presets"><button data-p="day">낮</button><button data-p="dusk">노을</button><button data-p="night">달밤</button></div>
    <div id="legend">물고기, 수초, 바위, 유목, 기포, 바닥을 클릭하면 명언이 나타납니다. 드래그로 시점 회전, 휠로 확대/축소.</div>
  </div>
</div>
<div id="quote"><div class="tag"></div><div class="q"></div><div class="a"></div></div>
<div id="hint">무엇이든 클릭해 보세요</div>
<div id="err"></div>

<script type="importmap">

<script type="module">

const hemi = new THREE.HemisphereLight(0xcfeff0, 0x2a3a2c, 0.7);

const fill = new THREE.DirectionalLight(0xbfe6ff, 0.5);

scene.add(fill);

/* ------------------------------------------------------------------ 셰이더 주입 (흔들림 + 코스틱) */
const CAUSTIC_GLSL = `

      .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform vec4 uSw;\nvarying vec3 vWPos;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\n' + (sw ? `

const sideMat = new THREE.MeshBasicMaterial({ color: 0x35595f, transparent: true, opacity: 0.55, side: THREE.DoubleSide, fog: false });

  m.rotation.y = Math.PI / 2; m.position.set(s * (TW + 0.05), TH / 2, 0); scene.add(m);
}
// 수면
const surf = new THREE.Mesh(new THREE.PlaneGeometry(TW * 2, TD * 2), new THREE.MeshBasicMaterial({ color: 0x9fe4e8, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false, fog: false }));

// 유리 모서리와 받침

const plinth = new THREE.Mesh(new THREE.BoxGeometry(TW * 2 + 5, 2.4, TD * 2 + 5), new THREE.MeshStandardMaterial({ color: 0x14191b, roughness: 0.6 }));
plinth.position.y = -1.25; plinth.receiveShadow = true; scene.add(plinth);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x0b0f11, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.5; scene.add(floor);

/* ------------------------------------------------------------------ 바닥(소일) */
const pickables = [];
{
  const NX = 150, NZ = 75;
  const g = new THREE.PlaneGeometry(TW * 2, TD * 2, NX, NZ);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; const col = new Float32Array(p.count * 3);

    tmp.copy(cA).lerp(cB, smooth(0.45, 0.8, n) * 0.55 + (sp > 0.82 ? 0.25 : 0));

  for (let z = TD; z >= -TD; z -= 1) per.push([TW, z]);
  const perL = []; for (let z = TD; z >= -TD; z -= 1) perL.push([-TW, z]);
  const mk = (pts) => {
    const pos = [], cl = [], idx = []; const sand = new THREE.Color(0x8d7650), sand2 = new THREE.Color(0x6a5638), dark = new THREE.Color(0x1d140e);
    pts.forEach(([x, z], i) => {

    });

  };

    const x = rnd(-27, 27), z = rnd(-10, 14); const s = rnd(0.12, 0.42);
    d.position.set(x, ground(x, z) + s * 0.1, z); d.rotation.set(rnd(0, 6), rnd(0, 6), rnd(0, 6)); d.scale.set(s * 1.2, s * 0.7, s); d.updateMatrix(); pe.setMatrixAt(i, d.matrix);

/* ------------------------------------------------------------------ 바위 */
const obstacles = []; // {c:Vector3, r}
const rockMeshes = [];
function makeRock(o) {

  const grey = new THREE.Color(0x4b4e46), light = new THREE.Color(0x8b8d80), dk = new THREE.Color(0x2b2e2a), moss = new THREE.Color(0x32561f), moss2 = new THREE.Color(0x5f8a30);

    const t = fbm(x * 0.7, y * 0.7, z * 0.7, 3);

  }

    ['그대는 물고기가 아닌데, 어찌 물고기의 즐거움을 안다고 하는가?', '혜시, 『장자』 「추수」'],

    ['인간은 파괴될 수는 있어도 패배할 수는 없다.', '어니스트 헤밍웨이, 『노인과 바다』'],

    ['사람은 살아 있을 때 부드럽고 연하나 죽으면 굳고 뻣뻣해진다. 초목도 그러하다.', '노자, 『도덕경』 76장'],
    ['꽃잎을 뜯는다고 해서 꽃의 아름다움을 얻을 수는 없다.', '라빈드라나트 타고르'],
    ['나무는 성소다. 그들과 이야기할 줄 아는 사람은 진리를 듣는다.', '헤르만 헤세, 『나무들』'],
  ],
  rock: [
    ['세상에 물보다 부드럽고 약한 것은 없지만, 단단하고 강한 것을 이기는 데 물보다 나은 것은 없다.', '노자, 『도덕경』 78장'],
    ['낙숫물이 바위를 뚫는다.', '한국 속담'],

const KIND = { fish: '물고기', plant: '수초', rock: '바위', moss: '이끼', wood: '유목', bubble: '공기 방울', sand: '바닥 모래', water: '물' };
const qEl = document.getElementById('quote'); let qTimer = 0; const lastQ = {};
function showQuote(kind, label) {
  const arr = Q[kind]; let i; do { i = Math.floor(Math.random() * arr.length); } while (arr.length > 1 && i === lastQ[kind]); lastQ[kind] = i;
  qEl.querySelector('.tag').textContent = (KIND[kind] || '') + (label ? ' · ' + label : '');
  qEl.querySelector('.q').textContent = '“' + arr[i][0] + '”';
  qEl.querySelector('.a').textContent = '— ' + arr[i][1];
  qEl.classList.add('show'); clearTimeout(qTimer); qTimer = setTimeout(() => qEl.classList.remove('show'), 10000);
  const h = document.getElementById('hint'); h.style.opacity = 0;
}
qEl.addEventListener('click', () => qEl.classList.remove('show'));
const ray = new THREE.Raycaster(); const ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  doPick(e.clientX, e.clientY);
});
function doPick(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const targets = [...pickables, back];
  const hits = ray.intersectObjects(targets, false);
  for (const h of hits) {
    const o = h.object; const k = o.userData.kind; if (!k) continue;
    if (k === 'fish') { o.userData.fish.pop = 1; showQuote('fish', o.userData.fish.sp.name); return k; }
    showQuote(k, o.userData.label); return k;
  }
  return null;
}
window.__pick = doPick; // 검증용

/* ------------------------------------------------------------------ 조명 UI */
const $ = (id) => document.getElementById(id);
const sl = { b: $('s_b'), a: $('s_a'), w: $('s_w'), x: $('s_x'), c: $('s_c'), f: $('s_f') };
const fmt = { b: (v) => Math.round(v * 100) + '%', a: (v) => Math.round(v * 100) + '%', w: (v) => (v > 0 ? '따뜻 +' : v < 0 ? '차가움 ' : '중립 ') + v.toFixed(2), x: (v) => v + '°', c: (v) => Math.round(v * 100) + '%', f: (v) => Math.round(v * 100) + '%' };
const cool = new THREE.Color(0xa9cdff), warm = new THREE.Color(0xffc690), neutral = new THREE.Color(0xfff4e6);
function applyLight() {
  const b = +sl.b.value, a = +sl.a.value, w = +sl.w.value, x = +sl.x.value, c = +sl.c.value, f = +sl.f.value;
  for (const k in sl) $('o_' + k).textContent = fmt[k](+sl[k].value);
  const col = w < 0 ? neutral.clone().lerp(cool, -w) : neutral.clone().lerp(warm, w);
  sun.color.copy(col); sun.intensity = 3.0 * b;
  const ang = THREE.MathUtils.degToRad(x); sun.position.set(Math.sin(ang) * 72, Math.cos(ang) * 72, 18);
  hemi.intensity = 0.9 * a; hemi.color.copy(col).lerp(new THREE.Color(0xcfeff0), 0.5);
  fill.intensity = 0.55 * a * (0.4 + 0.6 * Math.min(b, 1)); fill.color.copy(col);
  U.caust.value = c * Math.min(1.4, b);
  scene.fog.density = 0.010 * f; scene.fog.color.setHex(0x2f7078).multiplyScalar(0.25 + 0.75 * Math.min(1, 0.35 * b + 0.45 * a));
  const lum = clamp(0.2 + 0.55 * b + 0.25 * a, 0.12, 1.15); backMat.color.setScalar(lum).multiply(col.clone().lerp(new THREE.Color(1, 1, 1), 0.6));
  sideMat.color.setHex(0x35595f).multiplyScalar(0.4 + 0.6 * lum);
  shafts.forEach((m) => { m.material.opacity = 0.11 * Math.min(1.4, b) * (0.5 + 0.5 * c); m.material.color.copy(col); });
  motes.material.opacity = 0.15 + 0.3 * Math.min(1, b);
}
Object.values(sl).forEach((e) => e.addEventListener('input', applyLight));
const PRESETS = { day: { b: 1.3, a: 0.9, w: 0.1, x: -8, c: 1, f: 0.9 }, dusk: { b: 0.9, a: 0.5, w: 1, x: 38, c: 0.8, f: 1.3 }, night: { b: 0.2, a: 0.35, w: -1, x: 20, c: 0.5, f: 1.8 } };
document.querySelectorAll('button[data-p]').forEach((bt) => bt.addEventListener('click', () => { const p = PRESETS[bt.dataset.p]; for (const k in p) sl[k].value = p[k]; applyLight(); }));
$('ptoggle').addEventListener('click', () => { const p = $('panel'); p.classList.toggle('min'); $('pmark').textContent = p.classList.contains('min') ? '+' : '−'; });
applyLight();

/* ------------------------------------------------------------------ 루프 */
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
const clock = new THREE.Clock(); let T = 0;
const mp = motes.geometry.attributes.position;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); T += dt; U.time.value = T;
  updateFish(dt, T); updateBubbles(dt, T);
  for (let i = 0; i < mp.count; i++) {
    let y = mp.getY(i) + Math.sin(T * 0.4 + i) * dt * 0.4 - dt * 0.15; if (y < 3) y = TH - 1;
    mp.setXYZ(i, mp.getX(i) + Math.sin(T * 0.3 + i * 1.7) * dt * 0.5, y, mp.getZ(i) + Math.cos(T * 0.25 + i) * dt * 0.3);
  }
  mp.needsUpdate = true;
  shafts.forEach((m) => { m.position.x = m.userData.x0 + Math.sin(T * 0.15 + m.userData.p) * 3; m.rotation.z = 0.12 + Math.sin(T * 0.2 + m.userData.p) * 0.03; });
  controls.update(); renderer.render(scene, camera);
});
window.__stats = () => ({ fish: fishes.length, species: SPECIES.map((s) => s.name + '×' + s.count), bubbles: bubbles.length, pickables: pickables.length });
</script>
