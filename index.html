<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaGarden Bench</title>
<meta name="description" content="같은 프롬프트로 다섯 개의 AI 모델이 만든 브라우저 3D 수족관을 나란히 실행하고 비교합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── tokens ─────────────────────────────────────────────
   Palette sampled from the reference aquascape photo:
   near-black aquasoil, hairgrass yellow-green, rotala
   magenta, pale limestone, driftwood umber, frosted panel.
   Deliberately single-theme: this is a dark viewing room
   built around dark WebGL scenes. Every color is explicit. */
:root{
  --soil:#0c110e;        /* ground */
  --soil-2:#111814;      /* raised surface */
  --soil-3:#16201b;      /* hover surface */
  --glass:#243029;       /* hairline border */
  --glass-2:#33423a;     /* stronger border */
  --frost:#e8efe9;       /* primary text */
  --stone:#a3b0a6;       /* secondary text */
  --stone-dim:#6d7c72;   /* tertiary text */
  --grass:#a8d84a;       /* accent: hairgrass */
  --grass-dim:#7ba033;
  --rotala:#d4547c;      /* accent 2: red stem plant */
  --umber:#7a5638;       /* driftwood */

  --rail-w:19rem;
  --pad:clamp(1rem,2.4vw,1.75rem);
  --r:10px;

  --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box}
/* author `display` beats the UA [hidden] rule, so force it */
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  background:var(--soil);
  color:var(--frost);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
@media (max-width:900px){ body{overflow:auto} }

a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px;border-radius:4px}

/* ── shell ───────────────────────────────────────────── */
.shell{
  height:100dvh;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
}
@media (max-width:900px){ .shell{height:auto;min-height:100dvh} }

/* ── header ──────────────────────────────────────────── */
.head{
  display:flex;align-items:flex-end;gap:var(--pad);
  flex-wrap:wrap;
  padding:calc(var(--pad) * .85) var(--pad);
  border-bottom:1px solid var(--glass);
  background:var(--soil-2);
}
.brand{display:flex;flex-direction:column;gap:.15rem;margin-right:auto}
.brand h1{
  margin:0;
  font-family:var(--f-disp);
  font-optical-sizing:auto;
  font-weight:600;
  font-size:clamp(1.35rem,2.6vw,1.75rem);
  letter-spacing:-.015em;
  line-height:1.1;
}
.brand h1 em{font-style:normal;color:var(--grass)}
.brand p{margin:0;color:var(--stone);font-size:.85rem}
.tally{
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;
  color:var(--stone-dim);text-transform:uppercase;
}
.tally b{color:var(--stone);font-weight:500}

.seg{display:flex;gap:2px;padding:3px;background:var(--soil);border:1px solid var(--glass);border-radius:8px}
.seg button{
  padding:.4rem .85rem;border-radius:5px;font-size:.82rem;
  color:var(--stone);transition:background .15s,color .15s;
}
.seg button:hover{color:var(--frost)}
.seg button[aria-selected="true"]{background:var(--glass);color:var(--frost)}

/* ── body split ──────────────────────────────────────── */
.split{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:0}
@media (max-width:900px){ .split{grid-template-columns:1fr} }

/* ── rail ────────────────────────────────────────────── */
.rail{
  border-right:1px solid var(--glass);
  background:var(--soil-2);
  overflow-y:auto;
  padding:.75rem;
  display:flex;flex-direction:column;gap:.4rem;
}
@media (max-width:900px){
  .rail{
    border-right:none;border-bottom:1px solid var(--glass);
    flex-direction:row;overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x mandatory;
  }
  .card{min-width:15rem;scroll-snap-align:start}
}

.card{
  position:relative;text-align:left;width:100%;
  padding:.7rem .8rem .75rem 1rem;
  border:1px solid transparent;border-radius:var(--r);
  background:transparent;
  transition:background .16s,border-color .16s;
}
.card::before{
  content:"";position:absolute;left:0;top:.7rem;bottom:.7rem;width:2px;
  border-radius:2px;background:var(--glass-2);
  transition:background .16s,top .16s,bottom .16s;
}
.card:hover{background:var(--soil-3)}
.card[aria-current="true"]{background:var(--soil-3);border-color:var(--glass-2)}
.card[aria-current="true"]::before{background:var(--grass);top:.45rem;bottom:.45rem}

.card .row1{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.card .name,.card .tool{display:block}
.card .idx{
  font-family:var(--f-mono);font-size:.68rem;color:var(--stone-dim);
  letter-spacing:.08em;
}
.card[aria-current="true"] .idx{color:var(--grass)}
.card .date{font-family:var(--f-mono);font-size:.68rem;color:var(--stone-dim)}
.card .name{
  font-family:var(--f-disp);font-optical-sizing:auto;font-weight:600;
  font-size:1.02rem;letter-spacing:-.01em;margin:.15rem 0 0;line-height:1.25;
}
.card .tool{font-size:.76rem;color:var(--stone);margin:0}
.card .chips{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.45rem}
.chip{
  font-family:var(--f-mono);font-size:.65rem;color:var(--stone-dim);
  border:1px solid var(--glass);border-radius:4px;padding:.05rem .35rem;
  white-space:nowrap;
}

/* ── stage ───────────────────────────────────────────── */
.stage{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--soil)}
@media (max-width:900px){ .stage{min-height:80vh} }

.bar{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  padding:.6rem var(--pad);
  border-bottom:1px solid var(--glass);
}
.bar .now{font-family:var(--f-disp);font-weight:600;font-size:.98rem;letter-spacing:-.01em}
.bar .sep{width:1px;height:1rem;background:var(--glass-2)}
.bar .meta{font-family:var(--f-mono);font-size:.7rem;color:var(--stone-dim)}
.bar .acts{margin-left:auto;display:flex;gap:.35rem}
.act{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.32rem .7rem;border:1px solid var(--glass);border-radius:6px;
  font-size:.78rem;color:var(--stone);text-decoration:none;
  transition:border-color .15s,color .15s,background .15s;
}
.act:hover{border-color:var(--glass-2);color:var(--frost);background:var(--soil-2)}
.act svg{width:12px;height:12px;flex:none}

.tank{position:relative;margin:var(--pad);border:1px solid var(--glass-2);border-radius:var(--r);overflow:hidden;background:#000}
.tank iframe{display:block;width:100%;height:100%;border:0;background:#000}
.tank::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--r);
  box-shadow:inset 0 0 0 1px rgba(232,239,233,.05), inset 0 18px 40px -24px rgba(232,239,233,.14);
}
@media (max-width:900px){ .tank{height:78vh} }

.loading{
  position:absolute;inset:0;display:grid;place-content:center;gap:.6rem;justify-items:center;
  background:var(--soil);color:var(--stone-dim);
  font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  transition:opacity .35s;
}
.loading[hidden]{display:none}
.drop{width:6px;height:6px;border-radius:50%;background:var(--grass);animation:rise 1.6s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(6px);opacity:.25}50%{transform:translateY(-6px);opacity:1}100%{transform:translateY(6px);opacity:.25}}
@media (prefers-reduced-motion:reduce){ .drop{animation:none} *{transition:none!important} }

/* ── compare ─────────────────────────────────────────── */
.compare{overflow:auto;padding:var(--pad)}
.compare h2{
  font-family:var(--f-disp);font-weight:600;font-size:1.05rem;letter-spacing:-.01em;
  margin:0 0 .15rem;
}
.compare h2:not(:first-of-type){margin-top:2.25rem}
.compare .sub{margin:0 0 .9rem;color:var(--stone);font-size:.83rem;max-width:62ch}
.twrap{overflow-x:auto;border:1px solid var(--glass);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:44rem;font-size:.83rem}
th,td{padding:.6rem .8rem;text-align:left;border-bottom:1px solid var(--glass);white-space:nowrap}
thead th{
  font-family:var(--f-mono);font-size:.66rem;font-weight:500;letter-spacing:.07em;
  text-transform:uppercase;color:var(--stone-dim);background:var(--soil-2);
  position:sticky;top:0;
}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--soil-2)}
td.model{font-family:var(--f-disp);font-weight:600;letter-spacing:-.01em}
td.model span{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--stone-dim);letter-spacing:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--stone)}
td.mark{text-align:center}
.yes{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--grass)}
.no{display:inline-block;width:9px;height:1px;background:var(--stone-dim);vertical-align:middle}
.note{margin:.7rem 0 0;font-size:.75rem;color:var(--stone-dim);max-width:70ch}
.bar-cell{display:flex;align-items:center;gap:.5rem}
.bar-cell .track{width:5.5rem;height:4px;border-radius:2px;background:var(--glass);overflow:hidden;flex:none}
.bar-cell .fill{display:block;height:100%;border-radius:2px;background:var(--umber)}
.compare tr:hover .fill{background:var(--grass-dim)}
</style>
</head>
<body>
<div class="shell">

  <header class="head">
    <div class="brand">
      <h1>AquaGarden <em>Bench</em></h1>
      <p>같은 프롬프트, 다섯 개의 모델. 브라우저만으로 도는 3D 수족관.</p>
    </div>
    <p class="tally"><b id="tallyN">5</b> builds &nbsp;·&nbsp; <b id="tallySpan">13</b> months &nbsp;·&nbsp; <b>1</b> prompt</p>
    <div class="seg" role="tablist" aria-label="보기 전환">
      <button role="tab" id="tabTank" aria-selected="true" aria-controls="paneTank">수조</button>
      <button role="tab" id="tabCmp" aria-selected="false" aria-controls="paneCmp">비교표</button>
    </div>
  </header>

  <div class="split">
    <nav class="rail" id="rail" aria-label="버전 선택"></nav>

    <section class="stage" id="paneTank" role="tabpanel" aria-labelledby="tabTank">
      <div class="bar">
        <span class="now" id="nowName">—</span>
        <span class="sep" aria-hidden="true"></span>
        <span class="meta" id="nowMeta"></span>
        <span class="acts">
          <button class="act" id="btnReload" type="button" title="이 수조를 다시 불러옵니다">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M13.5 1.5V4H11"/></svg>
            다시 불러오기
          </button>
          <a class="act" id="btnOpen" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2h5v5"/><path d="M14 2 7.5 8.5"/><path d="M12 10v3.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5H6"/></svg>
            새 탭
          </a>
          <a class="act" id="btnSrc" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 11 2.5 8l3-3"/><path d="M10.5 5l3 3-3 3"/></svg>
            소스
          </a>
        </span>
      </div>
      <div class="tank" id="tank">
        <div class="loading" id="loading"><span class="drop"></span><span>수조를 채우는 중</span></div>
        <iframe id="frame" title="선택한 버전의 3D 수족관" allow="autoplay; fullscreen"></iframe>
      </div>
    </section>

    <section class="compare" id="paneCmp" role="tabpanel" aria-labelledby="tabCmp" hidden></section>
  </div>
</div>

<script>
/* ── data ────────────────────────────────────────────────
   Every number below is measured from the shipped file
   (byte size, line count, pinned three.js version) or read
   from the source repository's commit date. Technique flags
   come from static analysis of each file — see the note
   under the technique table. */
const VERSIONS = [
  {
    slug:"gpt-canvas", name:"GPT-5", tool:"ChatGPT Canvas", date:"2025-08-09",
    repo:"https://github.com/outliner-coach/aquagarden",
    bytes:25009, lines:345, three:"0.161.0", cdn:"unpkg",
    note:"가장 이른 버전이자 가장 작은 파일. 보이드 군영과 코스틱을 최소 코드로 구현했습니다.",
    f:{shader:1,instancing:1,caustics:1,shadow:0,aces:1,fog:1,tube:1,boids:1}
  },
  {
    slug:"codex", name:"Codex", tool:"OpenAI Codex CLI", date:"2026-03-05",
    repo:"https://github.com/outliner-coach/aquagarden_codex",
    bytes:100129, lines:3116, three:"0.161.0", cdn:"jsDelivr",
    note:"가장 큰 파일. 셰이더 주입 대신 지오메트리와 CPU 애니메이션으로 밀어붙인 접근입니다.",
    f:{shader:0,instancing:1,caustics:0,shadow:0,aces:1,fog:1,tube:0,boids:0}
  },
  {
    slug:"gemini-flash-3-5", name:"Gemini Flash 3.5", tool:"단일 파일 프로토타입", date:"2026-05-20",
    repo:"https://github.com/outliner-coach/aquagarden_gemini_flash_3.5",
    bytes:49785, lines:1066, three:"0.128.0", cdn:"jsDelivr · cdnjs",
    note:"유일하게 구형 three.js(0.128)에 고정. 커스텀 셰이더 없이 표준 머티리얼과 그림자로 구성했습니다.",
    f:{shader:0,instancing:0,caustics:0,shadow:1,aces:0,fog:1,tube:0,boids:0}
  },
  {
    slug:"opencode", name:"OpenCode", tool:"오픈코드 에이전트", date:"2026-08-23",
    repo:"https://github.com/outliner-coach/aquagarden_omo",
    bytes:48336, lines:1153, three:"0.185.1", cdn:"jsDelivr",
    note:"가장 최신 three.js를 쓰면서도 파일은 작은 편. 물리 기반 조명과 코스틱을 함께 넣었습니다.",
    f:{shader:1,instancing:1,caustics:1,shadow:1,aces:1,fog:1,tube:1,boids:0}
  },
  {
    slug:"claude-fable-5-1", name:"Claude Fable 5.1", tool:"Claude Code", date:"2026-09-02",
    repo:"https://github.com/outliner-coach/aquagarden-bench/blob/main/versions/claude-fable-5-1/index.html",
    bytes:102423, lines:2301, three:"0.170.0", cdn:"jsDelivr",
    note:"참고 사진의 배치를 3D로 옮기는 데 집중했습니다. 5종 20마리의 물고기가 종별 수심대를 지킵니다.",
    f:{shader:1,instancing:1,caustics:1,shadow:1,aces:1,fog:1,tube:1,boids:1}
  }
];

const FEATURES = [
  ["shader",    "셰이더 주입",   "onBeforeCompile 로 표준 머티리얼의 버텍스 단계를 수정"],
  ["instancing","인스턴싱",     "InstancedMesh 로 수초·기포를 한 번의 드로우콜에 묶음"],
  ["caustics",  "코스틱",       "수면 굴절광 패턴을 바닥과 하드스케이프에 투사"],
  ["shadow",    "그림자",       "shadowMap 활성화"],
  ["aces",      "ACES 톤매핑",  "ACESFilmicToneMapping 사용"],
  ["fog",       "수중 안개",    "Fog 또는 FogExp2 로 깊이감 표현"],
  ["tube",      "튜브 유목",    "TubeGeometry 로 유목 가지를 생성"],
  ["boids",     "보이드 군영",  "결속·분리·정렬 규칙으로 무리 유영"]
];

/* ── build rail ─────────────────────────────────────── */
const rail = document.getElementById("rail");
const frame = document.getElementById("frame");
const loading = document.getElementById("loading");
const nowName = document.getElementById("nowName");
const nowMeta = document.getElementById("nowMeta");
const btnOpen = document.getElementById("btnOpen");
const btnSrc = document.getElementById("btnSrc");

const kb = n => n >= 1000 ? Math.round(n/1024) + " KB" : n + " B";
const ko = d => d.slice(0,4) + "." + d.slice(5,7) + "." + d.slice(8,10);

VERSIONS.forEach((v, i) => {
  const b = document.createElement("button");
  b.className = "card";
  b.type = "button";
  b.dataset.slug = v.slug;
  b.setAttribute("aria-current", "false");
  b.innerHTML =
    '<span class="row1"><span class="idx">' + String(i+1).padStart(2,"0") + '</span>' +
    '<span class="date">' + ko(v.date) + '</span></span>' +
    '<span class="name">' + v.name + '</span>' +
    '<span class="tool">' + v.tool + '</span>' +
    '<span class="chips">' +
      (v.bytes ? '<span class="chip">' + kb(v.bytes) + '</span>' : '') +
      (v.lines ? '<span class="chip">' + v.lines.toLocaleString() + '줄</span>' : '') +
      '<span class="chip">three ' + v.three + '</span>' +
    '</span>';
  b.addEventListener("click", () => select(v.slug));
  rail.appendChild(b);
});

/* span of the collection, in months */
(function(){
  const a = new Date(VERSIONS[0].date), z = new Date(VERSIONS[VERSIONS.length-1].date);
  const m = Math.round((z - a) / (1000*60*60*24*30.44));
  document.getElementById("tallyN").textContent = VERSIONS.length;
  document.getElementById("tallySpan").textContent = m;
})();

/* ── selection ──────────────────────────────────────── */
let current = null;

function select(slug, push){
  const v = VERSIONS.find(x => x.slug === slug) || VERSIONS[VERSIONS.length-1];
  current = v;

  rail.querySelectorAll(".card").forEach(c =>
    c.setAttribute("aria-current", String(c.dataset.slug === v.slug)));

  nowName.textContent = v.name;
  nowMeta.textContent = ko(v.date) + "  ·  three " + v.three + (v.bytes ? "  ·  " + kb(v.bytes) : "");
  const url = "versions/" + v.slug + "/index.html";
  btnOpen.href = url;
  btnSrc.href = v.repo;

  loading.hidden = false;
  frame.src = url;

  if (push !== false && location.hash.slice(1) !== v.slug) {
    history.replaceState(null, "", "#" + v.slug);
  }
}

frame.addEventListener("load", () => { loading.hidden = true; });
document.getElementById("btnReload").addEventListener("click", () => {
  loading.hidden = false;
  frame.src = frame.src;
});

/* arrow-key navigation across the rail */
rail.addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const cards = [...rail.querySelectorAll(".card")];
  const at = cards.findIndex(c => c === document.activeElement);
  if (at < 0) return;
  e.preventDefault();
  const dir = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1 : -1;
  const next = cards[(at + dir + cards.length) % cards.length];
  next.focus(); next.click();
});

/* ── compare pane ───────────────────────────────────── */
const maxBytes = Math.max(...VERSIONS.map(v => v.bytes));
const cmp = document.getElementById("paneCmp");
cmp.innerHTML =
  '<h2>규모</h2>' +
  '<p class="sub">파일 크기와 줄 수는 배포된 파일에서 직접 잰 값이고, 날짜는 원본 저장소의 커밋 날짜입니다.</p>' +
  '<div class="twrap"><table><thead><tr>' +
    '<th>모델</th><th>날짜</th><th>파일 크기</th><th>줄 수</th><th>three.js</th><th>CDN</th>' +
  '</tr></thead><tbody>' +
  VERSIONS.map(v =>
    '<tr><td class="model">' + v.name + '<span>' + v.tool + '</span></td>' +
    '<td class="num">' + ko(v.date) + '</td>' +
    '<td class="num"><span class="bar-cell"><span class="track"><span class="fill" style="width:' +
      (v.bytes ? Math.round(v.bytes / maxBytes * 100) : 0) + '%"></span></span>' +
      (v.bytes ? kb(v.bytes) : "—") + '</span></td>' +
    '<td class="num">' + (v.lines ? v.lines.toLocaleString() : "—") + '</td>' +
    '<td class="num">' + v.three + '</td>' +
    '<td class="num">' + v.cdn + '</td></tr>'
  ).join("") +
  '</tbody></table></div>' +

  '<h2>기법</h2>' +
  '<p class="sub">각 파일을 정적 분석해 확인한 렌더링 기법입니다. 같은 효과를 다른 이름으로 직접 구현한 경우는 잡히지 않을 수 있으니, 없다는 표시가 곧 기능의 부재를 뜻하지는 않습니다.</p>' +
  '<div class="twrap"><table><thead><tr><th>모델</th>' +
    FEATURES.map(f => '<th title="' + f[2] + '">' + f[1] + '</th>').join("") +
  '</tr></thead><tbody>' +
  VERSIONS.map(v =>
    '<tr><td class="model">' + v.name + '<span>' + v.tool + '</span></td>' +
    FEATURES.map(f =>
      '<td class="mark">' + (v.f[f[0]]
        ? '<span class="yes" role="img" aria-label="있음"></span>'
        : '<span class="no" role="img" aria-label="없음"></span>') + '</td>'
    ).join("") + '</tr>'
  ).join("") +
  '</tbody></table></div>' +

  '<h2>메모</h2>' +
  '<p class="sub">각 구현에서 눈에 띄는 점.</p>' +
  '<div class="twrap"><table><thead><tr><th>모델</th><th style="white-space:normal">특징</th></tr></thead><tbody>' +
  VERSIONS.map(v =>
    '<tr><td class="model">' + v.name + '<span>' + v.tool + '</span></td>' +
    '<td style="white-space:normal;color:var(--stone)">' + v.note + '</td></tr>'
  ).join("") +
  '</tbody></table></div>' +
  '<p class="note">모든 버전은 동일한 요구사항 하나로 만들어졌습니다 — 수초와 유목과 바위로 꾸민 3D 수조, 흔들리는 수초와 올라오는 기포, 3종 이상의 자유 유영 물고기, 조절 가능한 조명, 오브젝트를 클릭하면 나오는 명언.</p>';

/* ── tabs ───────────────────────────────────────────── */
const tabTank = document.getElementById("tabTank");
const tabCmp = document.getElementById("tabCmp");
const paneTank = document.getElementById("paneTank");

function showTab(which){
  const tank = which === "tank";
  tabTank.setAttribute("aria-selected", String(tank));
  tabCmp.setAttribute("aria-selected", String(!tank));
  paneTank.hidden = !tank;
  cmp.hidden = tank;
}
tabTank.addEventListener("click", () => showTab("tank"));
tabCmp.addEventListener("click", () => showTab("cmp"));

/* ── boot ───────────────────────────────────────────── */
select(location.hash.slice(1) || VERSIONS[VERSIONS.length-1].slug, false);
window.addEventListener("hashchange", () => select(location.hash.slice(1), false));
</script>
</body>
</html>
